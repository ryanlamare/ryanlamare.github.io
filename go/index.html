<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Answer</title>
<link rel="stylesheet" href="/brand.css">
<style>
/* Participant page for live polls in the exec sessions. One tap to answer;
   tapping again changes the answer. Results never show here — the reveal
   happens on the room screen. Poll definitions live in ./polls.json;
   ?p=<id> picks a poll (every slide QR carries one), and a hand-typed
   bare /go shows a pick-your-question list instead — so nothing ever
   needs switching on. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:22px 18px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tag{font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--muted)}
.tag i{display:inline-block;width:10px;height:10px;background:var(--red);margin-right:10px;vertical-align:middle}
h1{font-weight:700;font-size:24px;line-height:1.25;color:var(--red)}
button.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  font-family:var(--sans);font-weight:600;font-size:17px;line-height:1.35;color:var(--ink);
  background:var(--card);border:2.5px solid var(--ink);padding:16px 18px;cursor:pointer}
button.opt .e{font-size:26px;flex:none;letter-spacing:.05em}
button.opt.mine{background:var(--red);border-color:var(--red);color:var(--paper)}
.status{font-weight:600;font-size:15px;color:var(--muted);min-height:1.4em}
.status b{color:var(--red)}
/* write-in polls (type:"text"): send as many answers as you like */
.sayrow{display:flex;gap:10px}
.sayrow input{flex:1;font-family:var(--sans);font-weight:600;font-size:17px;color:var(--ink);
  background:var(--card);border:2.5px solid var(--ink);padding:14px 16px;min-width:0}
.sayrow button{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:.08em;
  background:var(--red);border:2.5px solid var(--red);color:var(--paper);padding:14px 20px;cursor:pointer}
.sent{display:flex;flex-direction:column;gap:8px}
.sent .s{border:2px solid var(--ink);background:var(--card);font-weight:600;font-size:15px;padding:9px 14px}
/* hand-typed /go: pick the question that is on the screen */
button.pick{display:block;text-align:left;width:100%;font-family:var(--sans);
  background:var(--card);border:2.5px solid var(--ink);padding:13px 16px;cursor:pointer}
button.pick .pm{display:block;font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--red);margin-bottom:4px}
button.pick .pq{display:block;font-weight:600;font-size:15.5px;line-height:1.35;color:var(--ink)}
</style>
</head><body>
<div class="wrap">
  <div class="tag"><i></i>APPLIED GAME THEORY · LIVE</div>
  <h1 id="q">&hellip;</h1>
  <div id="opts"></div>
  <div class="status" id="status"></div>
</div>
<script>
const API='https://gt-poll.rlamare.workers.dev';
const qs=new URLSearchParams(location.search);
let voter=null;
try{
  voter=localStorage.getItem('gt-voter');
  if(!voter){voter=([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
    localStorage.setItem('gt-voter',voter);}
}catch(_){voter='v'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);}
let pollId=null;
fetch('polls.json').then(r=>r.json()).then(cfg=>{
  const wanted=qs.get('p');
  if(wanted&&cfg.polls[wanted]){renderPoll(cfg.polls[wanted],wanted);}
  else{renderChooser(cfg);}
}).catch(()=>{document.getElementById('q').textContent='Could not load the poll — check the address.';});
function renderChooser(cfg){
  document.getElementById('q').textContent='Which question is on the screen?';
  const opts=document.getElementById('opts');
  opts.innerHTML='';
  opts.style.display='flex';opts.style.flexDirection='column';opts.style.gap='10px';
  Object.entries(cfg.polls).forEach(([id,poll])=>{
    const b=document.createElement('button');
    b.className='pick';
    const mod=id.match(/^m(\d+)/);
    b.innerHTML='<span class="pm">'+(mod?'Module '+mod[1]:'Poll')+'</span><span class="pq"></span>';
    b.querySelector('.pq').textContent=poll.q;
    b.addEventListener('click',()=>{
      history.replaceState(null,'','?p='+id);
      document.getElementById('status').textContent='';
      renderPoll(poll,id);
    });
    opts.appendChild(b);
  });
}
function renderPoll(poll,id){
  pollId=id;
  document.getElementById('q').textContent=poll.q;
  const opts=document.getElementById('opts');
  opts.innerHTML='';
  if(poll.type==='text'){setupText(opts);return;}
  opts.style.display='flex';opts.style.flexDirection='column';opts.style.gap='12px';
  poll.options.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<span class="e">'+o.e+'</span><span></span>';
    b.children[1].textContent=o.t;
    b.addEventListener('click',()=>vote(i,b));
    opts.appendChild(b);
  });
  let mine=null;
  try{mine=localStorage.getItem('gt-vote-'+pollId);}catch(_){}
  if(mine!==null&&opts.children[+mine]){opts.children[+mine].classList.add('mine');
    document.getElementById('status').innerHTML='<b>Answer received.</b> Tap another option to change it.';}
}
function setupText(opts){
  opts.style.display='flex';opts.style.flexDirection='column';opts.style.gap='14px';
  const row=document.createElement('div');row.className='sayrow';
  const inp=document.createElement('input');
  inp.maxLength=80;inp.placeholder='Type an example…';inp.autocomplete='off';
  const btn=document.createElement('button');btn.textContent='SEND';
  row.appendChild(inp);row.appendChild(btn);opts.appendChild(row);
  const sent=document.createElement('div');sent.className='sent';opts.appendChild(sent);
  const st=document.getElementById('status');
  function send(){
    const t=inp.value.trim();
    if(!t)return;
    btn.disabled=true;st.textContent='Sending…';
    fetch(API+'/p/'+pollId+'/say',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({t:t,v:voter})})
    .then(r=>{if(!r.ok)throw r.status;
      const s=document.createElement('div');s.className='s';s.textContent=t;
      sent.prepend(s);
      inp.value='';inp.focus();
      st.innerHTML='<b>Sent.</b> Keep them coming — send as many as you can think of.';})
    .catch(code=>{st.textContent=code===429?'That’s plenty from one phone — thank you!':'That didn’t send — try again.';})
    .finally(()=>{btn.disabled=false;});
  }
  btn.addEventListener('click',send);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send();}});
  inp.focus();
}
function vote(i,btn){
  const st=document.getElementById('status');
  st.textContent='Sending…';
  fetch(API+'/p/'+pollId+'/vote',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({o:i,v:voter})})
  .then(r=>{if(!r.ok)throw 0;
    document.querySelectorAll('.opt').forEach(b=>b.classList.remove('mine'));
    btn.classList.add('mine');
    try{localStorage.setItem('gt-vote-'+pollId,String(i));}catch(_){}
    st.innerHTML='<b>Answer received.</b> Tap another option to change it.';})
  .catch(()=>{st.textContent='That didn’t send — try again.';});
}
</script>
</body></html>
