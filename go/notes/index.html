<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Your notes · Applied Game Theory</title>
<link rel="stylesheet" href="/brand.css">
<style>
/* Your notes (27 Sep 2026, Ryan's go; Kimberly's idea): an optional place
   for each person to keep their own answers to the your-world questions, a
   section per module. It saves on this device as they type and sends
   nothing anywhere: their answers are real deals, and the poll server is
   readable by anyone who knows its address. SAVE AS A WORD FILE takes it
   all away; COPY ALL is for pasting into an email. A table that wants one
   record has one person keep it on a laptop and send the file round.
   The questions are copied from the modules' your-world slides; when one
   changes there, change it here too (trial/notes.test.mjs checks). */
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none !important}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:26px 18px 60px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tag{font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--muted)}
.tag i{display:inline-block;width:10px;height:10px;background:var(--red);margin-right:10px;vertical-align:middle}
h1{font-family:var(--display);font-weight:900;font-size:34px;line-height:1.05;text-transform:uppercase;color:var(--red)}
.intro{font-weight:500;font-size:17px;line-height:1.5}
.intro b{color:var(--red)}
details.mod{border:2.5px solid var(--ink);background:var(--card)}
details.mod summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;column-gap:14px;align-items:baseline;padding:14px 18px}
details.mod summary::-webkit-details-marker{display:none}
details.mod summary .mn{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--red)}
details.mod summary .mt{font-weight:700;font-size:18px;line-height:1.3}
details.mod summary .mc{font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
details.mod[open] summary{border-bottom:1.5px solid var(--rule)}
.body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:16px}
.lead{font-weight:500;font-style:italic;font-size:16px;line-height:1.45;color:var(--muted)}
label.q{display:flex;flex-direction:column;gap:7px}
label.q span{font-weight:700;font-size:16px;line-height:1.4}
label.q textarea{font-family:var(--sans);font-weight:500;font-size:17px;line-height:1.45;color:var(--ink);background:var(--paper-soft);
  border:2px solid var(--ink);border-radius:0;padding:10px 12px;width:100%;min-height:74px;resize:vertical;overflow:hidden}
label.q textarea:focus{outline:3px solid var(--red);outline-offset:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.bar button{font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:.12em;background:var(--red);color:var(--paper);border:2.5px solid var(--red);padding:14px 18px;cursor:pointer}
.bar button.alt{background:var(--card);color:var(--ink);border-color:var(--ink)}
.st{font-weight:600;font-size:14px;color:var(--muted);min-height:1.3em}
@media (max-width:520px){h1{font-size:28px}details.mod summary{grid-template-columns:1fr auto}details.mod summary .mn{grid-column:1 / -1}}
</style>
</head><body>
<div class="wrap">
  <div class="tag"><i></i>APPLIED GAME THEORY</div>
  <h1>Your notes</h1>
  <p class="intro"><b>Optional.</b> A place to keep your own thinking on the questions at the end of each module. It saves on this device as you type, and nothing you write here is sent anywhere. Easiest on a laptop.</p>
  <div id="mods"></div>
  <div class="bar">
    <button type="button" id="doc">SAVE AS A WORD FILE</button>
    <button type="button" id="copy" class="alt">COPY ALL</button>
    <span class="st" id="st"></span>
  </div>
</div>
<script>
(function(){
  /* each module's your-world questions, as the slides have them, under the module's name (28 Sep 2026: "in your world" six times over read as repetitive, his word) */
  const M=[
    {m:1,t:'Introduction to game theory and strategic thinking',lead:'Pick one real situation where your goal is to maximize your self-interest, then answer four questions:',q:[
      'What prevents you from acting unilaterally to get what you want?',
      'Who is the other player or group of players in the game?',
      'What do you need to know about the others to achieve your goal?',
      'What do you think they know about you that matters in this game?']},
    {m:2,t:'Sequential strategies',lead:'Try your best to chart a complete course of action on one thing you’d like to get in the future.',q:[
      'What outcome would you like to achieve?',
      'Who else is in this game?',
      'Your two opening moves, and how they react to each',
      'Keep going as far as you can']},
    {m:3,t:'Simultaneous zero-sum games',lead:'Think of a situation where one of you and another party had to divide something and could not collaborate.',q:[
      'What was being divided?',
      'Who was on the other side?',
      'Did either side have a dominant or inferior strategy?',
      'How was the pie divided in the end?',
      'Was the game from your world really zero-sum?']},
    {m:4,t:'Prisoner’s dilemmas and how to overcome them',lead:'A situation from your world where each side is tempted to do the thing that leaves you both worse off.',q:[
      'Who are the two sides?',
      'What does cooperating look like?',
      'What does defecting look like?',
      'How would you get out of yours? Make it repeat, bring in an enforcer, change the payoffs, or is there no way out?']},
    {m:5,t:'Coordination games',lead:'Think of a situation from your world where two sides had to coordinate on the same thing for it to work.',q:[
      'Who were the players, and what was the situation?',
      'What were the options?',
      'Was it a stag hunt, battle of the sexes, or chicken game?',
      'What was the focal point?',
      'Did the equilibrium you coordinated on align with your personal preferences?']},
    {m:6,t:'Mixed strategies',lead:'Pick one real situation from one of your worlds, then answer the four questions together.',q:[
      'Where can it strategically benefit you to be inconsistent?',
      'Who is the other player in this game?',
      'What happens if they can always predict your moves?',
      'Is there any way mixing might backfire here?']},
    {m:7,t:'Credibility, commitment, and strategic moves',lead:'',q:[
      'Think about a strategic game you’ve already identified from your own world – a sequential game, a prisoner’s dilemma, a coordination game, etc.',
      'Change that game in your favor by making a strategic move: a commitment, a threat or a promise',
      'What would give the move credibility?',
      'Are there potential downsides to making the move?']},
    {m:8,t:'Information asymmetries',lead:'',q:[
      'Do you think the other side has hidden information only they know?',
      'How could you get them to reveal that information to you?',
      'How confident are you that they would be unable to fake the information they give you?',
      'Have you ever had someone use screening devices on you?']},
  ];
  const KEY='gt-notes';
  let notes={};
  try{notes=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(_){notes={};}
  const st=document.getElementById('st'), host=document.getElementById('mods');
  const grow=t=>{t.style.height='auto';t.style.height=(t.scrollHeight+4)+'px';};
  const count=d=>d.q.filter((_,i)=>(notes['m'+d.m+'-'+(i+1)]||'').trim()).length;
  let timer=null;
  function save(){
    clearTimeout(timer);
    timer=setTimeout(()=>{
      try{localStorage.setItem(KEY,JSON.stringify(notes));st.textContent='Saved on this device';}
      catch(_){st.textContent='This browser is not keeping notes: save them as a Word file before you close it';}
    },300);
  }
  M.forEach(d=>{
    const det=document.createElement('details');det.className='mod';det.dataset.m=d.m;
    const sum=document.createElement('summary');
    sum.innerHTML='<span class="mn"></span><span class="mt"></span><span class="mc"></span>';
    sum.querySelector('.mn').textContent='Module '+d.m;
    sum.querySelector('.mt').textContent=d.t;
    const mc=sum.querySelector('.mc');
    const tally=()=>{const n=count(d);mc.textContent=n?n+' of '+d.q.length:'';};
    det.appendChild(sum);
    const body=document.createElement('div');body.className='body';
    if(d.lead){const p=document.createElement('p');p.className='lead';p.textContent=d.lead;body.appendChild(p);}
    d.q.forEach((q,i)=>{
      const k='m'+d.m+'-'+(i+1);
      const l=document.createElement('label');l.className='q';
      const s=document.createElement('span');s.textContent=q;
      const t=document.createElement('textarea');t.dataset.k=k;t.value=notes[k]||'';
      t.addEventListener('input',()=>{notes[k]=t.value;grow(t);tally();save();});
      l.appendChild(s);l.appendChild(t);body.appendChild(l);
    });
    det.appendChild(body);
    det.addEventListener('toggle',()=>{if(det.open)det.querySelectorAll('textarea').forEach(grow);});
    if(count(d))det.open=true;   /* a module with notes opens */
    tally();
    host.appendChild(det);
  });
  host.querySelectorAll('details[open] textarea').forEach(grow);

  /* everything written, module by module; empty modules and questions left out */
  function written(){
    return M.map(d=>({d,qs:d.q.map((q,i)=>[q,(notes['m'+d.m+'-'+(i+1)]||'').trim()]).filter(x=>x[1])})).filter(x=>x.qs.length);
  }
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  document.getElementById('doc').addEventListener('click',()=>{
    const W=written();
    if(!W.length){st.textContent='Nothing written yet';return;}
    const day=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
    const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Applied Game Theory: my notes</title>'+
      '<style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt}h1{font-size:18pt;color:#b3202a}h2{font-size:13pt;margin-top:18pt}p.q{font-weight:bold;margin:10pt 0 2pt}</style></head><body>'+
      '<h1>Applied Game Theory: my notes</h1><p>'+esc(day)+'</p>'+
      W.map(({d,qs})=>'<h2>Module '+d.m+': '+esc(d.t)+'</h2>'+qs.map(([q,a])=>'<p class="q">'+esc(q)+'</p><p>'+esc(a).replace(/\n/g,'<br>')+'</p>').join('')).join('')+
      '</body></html>';
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['﻿',html],{type:'application/msword'}));
    a.download='Applied game theory notes.doc';
    document.body.appendChild(a);a.click();a.remove();
    st.textContent='Saved as a Word file';
  });
  document.getElementById('copy').addEventListener('click',()=>{
    const W=written();
    if(!W.length){st.textContent='Nothing written yet';return;}
    const text='Applied Game Theory: my notes\n\n'+W.map(({d,qs})=>'Module '+d.m+': '+d.t+'\n'+qs.map(([q,a])=>q+'\n'+a).join('\n\n')).join('\n\n\n');
    const done=()=>{st.textContent='Copied. Paste it into an email or a document';};
    const fallback=()=>{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');done();}catch(_){st.textContent='Copying did not work here: use the Word file';}t.remove();};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fallback);else fallback();
  });
})();
</script>
</body></html>
