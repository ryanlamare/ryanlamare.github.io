<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" width="1600" height="220">
  <!-- The White City in silhouette, for the game's backdrop under ?fair (style.css
       draws it faint along the foot of the screen, repeating). One colour on
       purpose: the board sits in front of it and must win every time. -->
  <g fill="#1C2747">
    <!-- the Ferris Wheel on the Midway -->
    <g fill="none" stroke="#1C2747">
      <circle cx="210" cy="112" r="92" stroke-width="7"/>
      <circle cx="210" cy="112" r="78" stroke-width="2.5"/>
      <path d="M210,20V204M118,112H302M145,47L275,177M145,177L275,47M175,27L245,197M175,197L245,27M125,77L295,147M125,147L295,77" stroke-width="2"/>
      <path d="M210,112L150,214M210,112L270,214" stroke-width="8"/>
    </g>
    <circle cx="210" cy="112" r="9"/>
    <g>
      <rect x="203" y="12" width="14" height="11" rx="2"/><rect x="203" y="201" width="14" height="11" rx="2"/>
      <rect x="110" y="106" width="14" height="11" rx="2"/><rect x="296" y="106" width="14" height="11" rx="2"/>
      <rect x="138" y="40" width="14" height="11" rx="2"/><rect x="268" y="40" width="14" height="11" rx="2"/>
      <rect x="138" y="172" width="14" height="11" rx="2"/><rect x="268" y="172" width="14" height="11" rx="2"/>
    </g>
    <!-- Manufactures: the long hall and its little dome -->
    <rect x="300" y="168" width="170" height="46"/><rect x="296" y="160" width="178" height="9"/>
    <rect x="360" y="140" width="50" height="22"/><path d="M362,140A23,22 0 0 1 408,140Z"/>
    <rect x="304" y="148" width="18" height="14"/><rect x="448" y="148" width="18" height="14"/>
    <!-- a campanile -->
    <rect x="490" y="118" width="22" height="96"/><path d="M488,118L501,92L514,118Z"/><rect x="486" y="114" width="30" height="5"/>
    <!-- the Administration Building and its dome -->
    <rect x="540" y="160" width="220" height="54"/><rect x="536" y="152" width="228" height="9"/>
    <rect x="540" y="136" width="40" height="18"/><rect x="720" y="136" width="40" height="18"/>
    <rect x="596" y="118" width="108" height="36"/><rect x="608" y="102" width="84" height="18"/>
    <path d="M610,103A40,48 0 0 1 690,103Z"/>
    <rect x="644" y="44" width="12" height="14"/><path d="M642,46A8,8 0 0 1 658,46Z"/>
    <path d="M650,38V18" stroke="#1C2747" stroke-width="2"/><path d="M651,18L668,23L651,28Z"/>
    <!-- the Statue of the Republic -->
    <rect x="782" y="172" width="18" height="42"/><rect x="786" y="140" width="10" height="33"/>
    <path d="M786,146L778,126M796,146L803,124" stroke="#1C2747" stroke-width="3" stroke-linecap="round"/><circle cx="791" cy="136" r="5"/>
    <!-- Electricity and Machinery: twin spires and a pediment -->
    <rect x="820" y="166" width="240" height="48"/><rect x="816" y="158" width="248" height="9"/>
    <path d="M900,158L940,132L980,158Z"/>
    <rect x="836" y="110" width="18" height="50"/><path d="M834,110L845,78L856,110Z"/>
    <rect x="1026" y="110" width="18" height="50"/><path d="M1024,110L1035,78L1046,110Z"/>
    <!-- the Peristyle: an entablature on a row of columns, the arch in the middle -->
    <rect x="1080" y="164" width="220" height="11"/><rect x="1170" y="140" width="40" height="26"/>
    <path d="M1174,140L1190,128L1206,140Z"/>
    <g><rect x="1084" y="175" width="5" height="39"/><rect x="1098" y="175" width="5" height="39"/><rect x="1112" y="175" width="5" height="39"/><rect x="1126" y="175" width="5" height="39"/><rect x="1140" y="175" width="5" height="39"/><rect x="1154" y="175" width="5" height="39"/><rect x="1168" y="175" width="44" height="39"/><rect x="1222" y="175" width="5" height="39"/><rect x="1236" y="175" width="5" height="39"/><rect x="1250" y="175" width="5" height="39"/><rect x="1264" y="175" width="5" height="39"/><rect x="1278" y="175" width="5" height="39"/><rect x="1292" y="175" width="5" height="39"/></g>
    <!-- Fine Arts, domed -->
    <rect x="1330" y="170" width="220" height="44"/><rect x="1326" y="162" width="228" height="9"/>
    <rect x="1416" y="146" width="48" height="18"/><path d="M1414,147A26,30 0 0 1 1466,147Z"/>
    <path d="M1338,162A12,12 0 0 1 1362,162Z"/><path d="M1518,162A12,12 0 0 1 1542,162Z"/>
    <!-- trees and lamps between -->
    <rect x="523.5" y="196" width="3" height="18"/><circle cx="525" cy="187" r="10"/><rect x="771.5" y="196" width="3" height="18"/><circle cx="773" cy="188" r="8"/><rect x="1066.5" y="196" width="3" height="18"/><circle cx="1068" cy="187" r="10"/><rect x="1314.5" y="196" width="3" height="18"/><circle cx="1316" cy="187" r="9"/><rect x="1572.5" y="196" width="3" height="18"/><circle cx="1574" cy="187" r="11"/>
    <!-- the ground -->
    <rect x="0" y="213" width="1600" height="7"/>
  </g>
</svg>
