<!--
  A league page is a stub, and this is the whole of it: a title, the league id,
  and the shared engine. `data-league` is the front of the term key — every game
  played under `ler565-<season>` lands on this page, and the season picker
  inside it does the rest.

  ⚠️ Seasons are not URL segments and cannot be: GitHub Pages serves files and
  cannot route, so `/records/ler565/2027` would mean a folder per season forever
  (PAVILION.md, The site shape). Starting a new cohort needs no change here.

  To publish a new league: copy this file to `records/<league>/index.html`,
  change the id and the two headings, and link it from `records/index.html`.
  Leaving it unlinked is how a league stays unlisted.
-->
<body data-league="ler565">
<div class="wrap">
  <header>
    <p class="eyebrow"><i></i> <a href="/pavilion/records/">Pavilion records</a></p>
    <h1>LER 565</h1>
    <p class="lede">The weekly league, the week 6 Cup, and every record the course has set.
      Results record themselves — the server replays each game and derives the winner.</p>
  </header>

  <main id="app">
    <p class="empty">Loading the records…</p>
  </main>

  <footer>
    <a href="/pavilion/">Play Pavilion</a> · <a href="/pavilion/records/">All leagues</a>
  </footer>
</div>

<script type="module" src="/pavilion/records/records.js"></script>
</body>
