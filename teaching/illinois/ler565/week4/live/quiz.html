<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LER 565 · Week 4 · The Focal-Point Quiz</title>
<link rel="stylesheet" href="/brand.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper-soft);color:var(--ink);font-family:var(--sans);line-height:1.5;padding:40px 16px 80px;-webkit-font-smoothing:antialiased}
.sheet{max-width:760px;margin:0 auto;background:var(--paper);padding:54px 60px 60px;box-shadow:0 2px 30px rgba(27,28,25,.10);border:1px solid var(--rule)}
.hhead{text-align:center}
.hkick{font-weight:700;text-transform:uppercase;letter-spacing:.26em;font-size:12px;color:var(--muted)}
.hicon{width:44px;height:44px;margin:16px auto 6px;display:block}
.hword{font-family:var(--display);font-weight:900;font-size:62px;line-height:.92;color:var(--red)}
.hsub{font-weight:600;font-size:18px;color:var(--muted);margin-top:8px}
.hrule{border:0;border-top:2px solid var(--ink);margin:24px 0 26px}
.intro{font-size:17px;line-height:1.6}
.rules{list-style:none;margin:20px 0 28px}
.rules li{position:relative;padding-left:30px;margin-bottom:13px;font-size:16.5px}
.rules li::before{content:"";position:absolute;left:0;top:7px;width:12px;height:12px;background:var(--red)}
.prog{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.prog .qn{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:12.5px;color:var(--muted)}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:13px;height:13px;border:2px solid var(--rule);background:transparent}
.pip.done{background:var(--ink);border-color:var(--ink)}
.pip.cur{border-color:var(--red)}
.qtext{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.22;color:var(--ink);margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{text-align:left;background:var(--card);border:2px solid var(--rule);color:var(--ink);font-family:var(--sans);font-weight:600;font-size:18px;padding:15px 20px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--red);background:color-mix(in srgb, var(--red) 9%, var(--card))}
.act{margin-top:26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--paper);font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.02em;border:0;padding:14px 30px;cursor:pointer}
.btn:disabled{opacity:.32;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:12px 28px}
.donehead{font-family:var(--display);font-weight:900;font-size:40px;color:var(--red);text-align:center;margin-bottom:6px}
.doneline{text-align:center;font-size:17px;color:var(--muted);margin-bottom:24px}
.summary{list-style:none;margin:0 0 26px}
.summary li{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--rule);font-size:16px}
.summary li .qlab{color:var(--muted)}
.summary li .ans{font-weight:700;color:var(--ink);text-align:right}
.note{font-size:16px;line-height:1.55;background:var(--paper-soft);border-left:5px solid var(--red);padding:18px 22px;margin-bottom:26px}
.note b{color:var(--red)}
.center{display:flex;justify-content:center}
.hfoot{display:flex;justify-content:space-between;margin-top:48px;padding-top:16px;border-top:1.5px solid var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;color:var(--muted)}
@media (max-width:640px){.sheet{padding:36px 22px}.hword{font-size:46px}.qtext{font-size:22px}}
</style>
</head>
<body>
<main class="sheet">
  <div class="hhead">
    <div class="hkick">LER 565 &nbsp;&middot;&nbsp; WEEK 4 &nbsp;&middot;&nbsp; COORDINATION</div>
    <svg class="hicon" viewBox="0 0 64 64" aria-hidden="true"><path fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" d="M8 10 L28 30"/><path fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M28 30 l-8 0 m8 0 l0 -8"/><path fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" d="M56 10 L36 30"/><path fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M36 30 l8 0 m-8 0 l0 -8"/><circle fill="var(--red)" cx="32" cy="44" r="10"/></svg>
    <div class="hword">The Focal-Point Quiz</div>
    <div class="hsub">Answer to match the rest of your classmates!</div>
  </div>
  <hr class="hrule">
  <div id="app" aria-live="polite"></div>
  <div class="hfoot"><span>Ryan Lamare</span><span>LER 565 &middot; Coordination Games</span></div>
</main>

<script>
const QUESTIONS = [
  {short:"Meeting time", q:"A meeting to review candidate shortlists is booked for Tuesday, but no time is given. When do you assume it starts?",
   opts:["6:00 AM","9:00 AM","12:00 PM","3:00 PM"]},
  {short:"Who speaks first", q:"A team meeting on next quarter's hiring plan opens in silence, with no chair named. Who's expected to speak first?",
   opts:["The most senior person","The person who called it","Whoever's most affected","The first to break the silence"]},
  {short:"Shared tool", q:"Two teams must standardize on one shared tool, but never discussed it. Which wins out?",
   opts:["The cheapest option","The newest option","The one most staff prefer","The one leadership already uses"]},
  {short:"Pick a number", q:"Your team must each pick the same number from 1 to 4 to unlock a bonus — no talking. Which?",
   opts:["1","2","3","4"]},
  {short:"Splitting credit", q:"You and a colleague jointly delivered a project and must split the credit, with no rule given. What split?",
   opts:["By hours each put in","By seniority","Whoever pitched it gets more","50/50"]},
  {short:"Salary anchor", q:"You and a manager must each name a \u201cfair\u201d salary for a mid-level role with a posted band. What do you both anchor on?",
   opts:["The top of the band","The bottom of the band","The midpoint of the band","The last hire's salary"]},
  {short:"Meet in Paris", q:"You're to meet someone in Paris \u2014 you know the day and time, but not the place. Where do you go?",
   opts:["The Louvre","The Eiffel Tower","Notre-Dame","A caf\u00e9 on the Champs-\u00c9lys\u00e9es"]},
  {short:"Hiring vote", q:"Your hiring committee is voting on which finalist to make an offer to. The straw poll so far \u2014 Okafor 9, Singh 28, Rivera 19, Walsh 29, Tan 6. You only want to back whoever the committee picks. Who do you vote for?",
   opts:["Singh","Okafor","Walsh","Rivera","Tan"]},
  {short:"Matching bonus", q:"Leadership will pay every employee a bonus \u2014 but only if everyone independently names the same figure. Any mismatch and nobody gets a cent. What do you ask for?",
   opts:["$1,000","$10,000","$100,000","$1,000,000"]},
];

let state = {phase:'start', i:0, answers:[]};
const app = document.getElementById('app');
const N = QUESTIONS.length;

function pips(){
  let s='<div class="pips">';
  for(let k=0;k<N;k++){
    let c='pip';
    if(state.answers[k]!=null) c+=' done';
    if(k===state.i) c+=' cur';
    s+=`<span class="${c}"></span>`;
  }
  return s+'</div>';
}

function render(){
  if(state.phase==='start') return renderStart();
  if(state.phase==='play')  return renderPlay();
  return renderEnd();
}

function renderStart(){
  app.innerHTML = `
    <p class="intro">A <b>coordination game</b> with no talking. For each question, pick the answer you think <b>most of the class</b> will pick &mdash; you're not trying to be right or clever, you're trying to <b>land where everyone else lands</b>.</p>
    <ul class="rules">
      <li>No conferring &mdash; you're coordinating on instinct.</li>
      <li>You'll just <b>lock in your answers</b> here. Nothing is scored on screen.</li>
      <li>We'll <b>reveal where the class converged together</b>, in the session.</li>
    </ul>
    <div class="act"><button class="btn" onclick="start()">Start the quiz &rsaquo;</button></div>`;
}

function renderPlay(){
  const item = QUESTIONS[state.i];
  const picked = state.answers[state.i];
  const opts = item.opts.map((o,idx)=>
    `<button class="opt${idx===picked?' sel':''}" onclick="pick(${idx})">${o}</button>`).join('');
  const last = state.i===N-1;
  app.innerHTML = `
    <div class="prog"><span class="qn">Question ${state.i+1} of ${N}</span>${pips()}</div>
    <div class="qtext">${item.q}</div>
    <div class="opts">${opts}</div>
    <div class="act">
      ${state.i>0?'<button class="btn ghost" onclick="back()">&lsaquo; Back</button>':''}
      <button class="btn" id="nextbtn" onclick="next()" ${picked==null?'disabled':''}>${last?'Finish':'Next'} &rsaquo;</button>
    </div>`;
}

function renderEnd(){
  const rows = QUESTIONS.map((item,k)=>{
    const a = state.answers[k]!=null ? item.opts[state.answers[k]] : '\u2014';
    return `<li><span class="qlab">${item.short}</span><span class="ans">${a}</span></li>`;
  }).join('');
  app.innerHTML = `
    <div class="donehead">Locked in.</div>
    <div class="doneline">Here's what you chose &mdash; hold onto it.</div>
    <ul class="summary">${rows}</ul>
    <div class="note">Don't change anything. In the session we'll <b>reveal where the class converged</b> on each one &mdash; and you'll see how often you landed on the focal point without a word of coordination.</div>
    <div class="center"><button class="btn ghost" onclick="restart()">Start over</button></div>`;
}

function start(){ state={phase:'play',i:0,answers:[]}; render(); }
function pick(idx){ state.answers[state.i]=idx; render(); }
function next(){ if(state.answers[state.i]==null) return; if(state.i<N-1){state.i++;render();} else {state.phase='end';render();} }
function back(){ if(state.i>0){state.i--;render();} }
function restart(){ state={phase:'start',i:0,answers:[]}; render(); }

render();
</script>
<script defer src="/edit.js"></script>
</body>
</html>
