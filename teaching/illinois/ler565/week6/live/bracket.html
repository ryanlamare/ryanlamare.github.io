<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LER 565 · Azee Tournament · Bracket Board</title>
<link rel="stylesheet" href="/brand.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper-soft);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;background:var(--ink);color:var(--paper);flex-wrap:wrap}
.bar .brand{display:flex;align-items:baseline;gap:14px}
.bar .wm{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.01em}
.bar .wm .r{color:var(--red)}
.bar .sub{font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--peach)}
.bar .ctrls{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--sans);font-weight:700;font-size:14px;letter-spacing:.02em;border:0;padding:10px 18px;cursor:pointer;background:var(--red);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--paper);border:2px solid var(--paper);padding:8px 16px}
.btn.dark{background:var(--paper);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.wrap{padding:30px 28px 80px}

/* setup */
.setup{max-width:640px;margin:24px auto;background:var(--paper);border:1px solid var(--rule);padding:34px 36px}
.setup h1{font-family:var(--display);font-weight:900;font-size:40px;color:var(--red);line-height:1}
.setup p{font-size:15px;color:var(--muted);margin:10px 0 18px;line-height:1.55}
.setup textarea{width:100%;height:240px;resize:vertical;font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--ink);background:var(--paper-soft);border:2px solid var(--rule);padding:14px 16px}
.setup textarea:focus{outline:none;border-color:var(--ink)}
.setrow{display:flex;align-items:center;gap:20px;margin-top:16px;flex-wrap:wrap}
.setrow.end{justify-content:flex-end}
.opt{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink);cursor:pointer;user-select:none}
.opt input{width:17px;height:17px;accent-color:var(--red)}
.fld{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.fld select{font-family:var(--sans);font-size:14px;padding:6px 8px;border:2px solid var(--rule);background:var(--paper-soft);color:var(--ink)}
.count{font-size:13.5px;color:var(--muted);flex:1 1 100%;line-height:1.5}
.count b{color:var(--ink)}
.count .warn{color:var(--red);font-weight:700}

/* group stage */
.gs{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;align-items:start}
@media (max-width:900px){.gs{grid-template-columns:minmax(0,1fr)}}
.board{display:flex;gap:34px;overflow-x:auto;padding:8px 4px 20px;align-items:stretch}
.col{display:flex;flex-direction:column;min-width:210px;gap:14px}
.col .rh{font-family:var(--sans);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted);text-align:center;padding-bottom:4px;flex:none}
.col .rh.fin{color:var(--red)}
.col .rh .done{color:var(--red)}
.matches{display:flex;flex-direction:column;justify-content:space-around;gap:16px;flex:1}
.match{background:var(--paper);border:1.5px solid var(--rule)}
.match .mh{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:5px 13px 0}
.slot{display:flex;align-items:center;gap:10px;padding:11px 13px;font-size:15.5px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--rule)}
.slot:last-child{border-bottom:0}
.slot .sd{width:22px;font-size:11px;font-weight:700;color:var(--muted);flex:none;text-align:center}
.slot .nm{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.win{background:color-mix(in srgb, var(--red) 10%, var(--paper))}
.slot.win .nm{font-weight:800;color:var(--red)}
.slot.win::after{content:"✓";color:var(--red);font-weight:800;font-size:15px}
.slot.bye{cursor:default}
.slot.bye .nm{color:var(--muted);font-style:italic;font-weight:500}
.slot.tbd{cursor:default}
.slot.tbd .nm{color:var(--rule);font-style:italic}
.slot.pick:hover{background:var(--card)}

/* standings */
.stand{background:var(--paper);border:1.5px solid var(--rule);padding:18px 18px 16px;position:sticky;top:18px}
.stand h2{font-family:var(--sans);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted);margin-bottom:12px}
.stand table{width:100%;border-collapse:collapse}
.stand td{padding:6px 2px;font-size:14.5px;border-bottom:1px solid var(--rule)}
.stand tr:last-child td{border-bottom:0}
.stand .rk{width:22px;color:var(--muted);font-weight:700;font-size:12px}
.stand .nm{font-weight:600}
.stand .wl{width:52px;text-align:right;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.stand .ck{width:24px;text-align:right}
.stand .ck input{width:16px;height:16px;accent-color:var(--red)}
.stand tr.adv .nm{color:var(--red);font-weight:800}
.stand tr.adv .wl{color:var(--red)}
.stand .foot{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.stand .note{font-size:12.5px;color:var(--muted);line-height:1.45}
.stand .note b{color:var(--red)}
.stand .btn{width:100%;text-align:center}
.stand .lnk{background:none;border:0;color:var(--muted);font-family:var(--sans);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start}
.stand .lnk:hover{color:var(--red)}

/* knockout */
.champ{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:230px;gap:12px}
.champ svg{width:78px;height:78px}
.champ .lbl{font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--muted)}
.champ .who{font-family:var(--display);font-weight:900;font-size:34px;line-height:1.05;color:var(--red)}
.champ .who.tbd{color:var(--rule);font-size:24px}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}
.ko .board{justify-content:center;align-items:center}
.ko .col{justify-content:space-around}
@media print{.bar .ctrls,.stand .foot{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="bar">
  <div class="brand"><span class="wm">LER <span class="r">565</span></span><span class="sub">Azee Tournament &middot; Bracket Board</span></div>
  <div class="ctrls" id="ctrls"></div>
</div>
<div class="wrap"><div id="app"></div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="trophy" viewBox="0 0 64 64"><path fill="var(--red,#CE1E32)" d="M18 9 h28 v11 a14 14 0 0 1 -28 0 z"/><path fill="none" stroke="var(--ink,#1B1C19)" stroke-width="3.6" d="M18 13 h-7 a6 6 0 0 0 0 12 h4"/><path fill="none" stroke="var(--ink,#1B1C19)" stroke-width="3.6" d="M46 13 h7 a6 6 0 0 1 0 12 h-4"/><rect fill="var(--ink,#1B1C19)" x="29" y="34" width="6" height="11"/><rect fill="var(--ink,#1B1C19)" x="19" y="45" width="26" height="5"/><rect fill="var(--ink,#1B1C19)" x="23" y="50" width="18" height="7"/></symbol></svg>

<script>
/* S = { p:[names], R:rounds, adv:2|4, res:{"r-m":0|1}, sel:[idx]|null, ko:null|{slots,picks} } */
let S = null;

/* ---------- round pairings: circle method, no repeat matchups ---------- */
function maxRounds(n){ return n%2 ? n : n-1; }          // distinct rounds available
function pairs(r){
  const n=S.p.length, m=n%2 ? n+1 : n;                  // m-1 == index of the ghost (a bye)
  const rest=[]; for(let i=1;i<m;i++) rest.push(i);
  const k=((r%(m-1))+(m-1))%(m-1);
  const line=[0].concat(rest.slice(k)).concat(rest.slice(0,k));
  const out=[];
  for(let i=0;i<m/2;i++){
    const a=line[i], b=line[m-1-i];
    if(a>=n) out.push([b,-1]); else if(b>=n) out.push([a,-1]); else out.push([a,b]);
  }
  return out;
}
function setRes(r,m,side){
  const p=pairs(r)[m];
  if(!p || p[1]===-1) return;                            // byes aren't clickable
  if(S.res[r+"-"+m]===side) delete S.res[r+"-"+m]; else S.res[r+"-"+m]=side;
  if(!S.selManual) S.sel=null;                           // let the default re-derive
  save(); render();
}

/* ---------- standings ---------- */
function h2h(i,j){                                        // i's wins over j
  let w=0;
  for(let r=0;r<S.R;r++){
    pairs(r).forEach((pr,m)=>{
      if(pr[1]===-1) return;
      const v=S.res[r+"-"+m]; if(v===undefined) return;
      if(pr[v]===i && pr[1-v]===j) w++;
    });
  }
  return w;
}
function standings(){
  const rows=S.p.map((nm,i)=>({i,nm,w:0,l:0,bye:0,h:0}));
  for(let r=0;r<S.R;r++){
    pairs(r).forEach((pr,m)=>{
      if(pr[1]===-1){ rows[pr[0]].w++; rows[pr[0]].bye++; return; }   // bye counts as a win
      const v=S.res[r+"-"+m];
      if(v===0){ rows[pr[0]].w++; rows[pr[1]].l++; }
      else if(v===1){ rows[pr[1]].w++; rows[pr[0]].l++; }
    });
  }
  const byW={};                                           // head-to-head inside each win group
  rows.forEach(r=>{ (byW[r.w]=byW[r.w]||[]).push(r); });
  Object.keys(byW).forEach(k=>{
    const g=byW[k];
    if(g.length>1) g.forEach(a=>{ a.h=g.reduce((s,b)=> s+(b===a?0:h2h(a.i,b.i)), 0); });
  });
  rows.sort((a,b)=> b.w-a.w || b.h-a.h || a.bye-b.bye || a.i-b.i);
  return rows;
}
function cutTie(rows,k){                                  // names still level at the cut line
  if(k<1 || k>=rows.length) return null;
  const a=rows[k-1], b=rows[k];
  if(a.w!==b.w || a.h!==b.h) return null;
  return rows.filter(r=>r.w===a.w && r.h===a.h).map(r=>r.nm);
}
function defaultSel(){ return standings().slice(0,Math.min(S.adv,S.p.length)).map(r=>r.i); }
function sel(){ return S.sel || defaultSel(); }
function toggleSel(i){
  const cur=sel().slice(), at=cur.indexOf(i);
  if(at>=0) cur.splice(at,1); else cur.push(i);
  S.sel=cur; S.selManual=true; save(); render();
}
function resetSel(){ S.sel=null; S.selManual=false; save(); render(); }
function roundDone(r){ return pairs(r).every((pr,m)=> pr[1]===-1 || S.res[r+"-"+m]!==undefined); }

/* ---------- knockout (seeds selected players 1v4, 2v3) ---------- */
function buildKO(){
  const order=standings().filter(r=>sel().indexOf(r.i)>=0).map(r=>S.p[r.i]);
  const n=order.length;
  if(n<2){ alert("Pick at least 2 players to advance."); return; }
  const size=Math.pow(2,Math.ceil(Math.log2(n)));
  const seeds= size===4 ? [1,4,2,3] : size===2 ? [1,2] : seedOrder(size);
  S.ko={slots:seeds.map(s=> s<=n ? order[s-1] : "BYE"), picks:{}};
  save(); render();
}
function seedOrder(size){
  let seeds=[1,2];
  while(seeds.length<size){
    const sum=seeds.length*2+1, next=[];
    for(const s of seeds){ next.push(s); next.push(sum-s); }
    seeds=next;
  }
  return seeds;
}
const nRounds=()=>Math.log2(S.ko.slots.length);
function participant(r,m,side){
  if(r===0) return S.ko.slots[2*m+side];
  return winner(r-1, 2*m+side);
}
function winner(r,m){
  const a=participant(r,m,0), b=participant(r,m,1);
  if(a==="BYE"&&b==="BYE") return "BYE";
  if(a==="BYE") return b;
  if(b==="BYE") return a;
  if(!a||!b) return null;
  const p=S.ko.picks[r+"-"+m];
  return p===0?a : p===1?b : null;
}
function pick(r,m,side){
  const a=participant(r,m,0), b=participant(r,m,1);
  if(!a||!b||a==="BYE"||b==="BYE") return;
  S.ko.picks[r+"-"+m]=side;
  let rr=r+1, mm=m>>1;
  while(rr<nRounds()){ delete S.ko.picks[rr+"-"+mm]; rr++; mm=mm>>1; }
  save(); render();
}
function koLabel(r){
  const entering=S.ko.slots.length/Math.pow(2,r);
  if(entering===2) return "Final";
  if(entering===4) return "Semi-finals";
  if(entering===8) return "Quarter-finals";
  return "Round of "+entering;
}

/* ---------- persistence (URL hash; no storage APIs) ---------- */
function save(){
  try{ location.hash = S ? btoa(unescape(encodeURIComponent(JSON.stringify(S)))) : ""; }catch(e){}
}
function load(){
  if(location.hash.length>1){
    try{ const s=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1))))); if(s&&s.p){ S=s; } }catch(e){ S=null; }
  }
}

/* ---------- setup ---------- */
function buildStage(names, shuffle, R, adv){
  names=names.map(n=>n.trim()).filter(Boolean);
  if(names.length<2){ alert("Enter at least 2 players (one name per line)."); return; }
  if(shuffle){ for(let i=names.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[names[i],names[j]]=[names[j],names[i]];} }
  S={p:names, R:Math.min(R,maxRounds(names.length)), adv:Math.min(adv,names.length), res:{}, sel:null, selManual:false, ko:null};
  save(); render();
}

/* ---------- rendering ---------- */
function render(){
  const ctrls=document.getElementById('ctrls'), app=document.getElementById('app');
  if(!S){ renderSetup(ctrls,app); return; }
  if(S.ko){ renderKO(ctrls,app); return; }
  renderStage(ctrls,app);
}

function renderSetup(ctrls,app){
  ctrls.innerHTML="";
  app.innerHTML=`<div class="setup">
    <h1>Set up the tournament</h1>
    <p>Paste your players from the Google Sheet &mdash; <b>one name per line</b>. Everyone plays every round; pairings rotate so nobody meets the same opponent twice. Odd numbers get a rotating bye.</p>
    <textarea id="names" placeholder="Avery Tan&#10;Jordan Lee&#10;Sam Okafor&#10;Priya Nair&#10;..."></textarea>
    <div class="setrow">
      <label class="opt"><input type="checkbox" id="shuffle" checked> Randomize pairings</label>
      <span class="fld">Rounds
        <select id="rounds"><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
      </span>
      <span class="fld">Advance
        <select id="adv"><option value="2">Top 2 &rarr; final</option><option value="4" selected>Top 4 &rarr; semis</option></select>
      </span>
      <span class="count" id="cnt"></span>
    </div>
    <div class="setrow end"><button class="btn" onclick="go()">Start round 1 &rsaquo;</button></div>
  </div>`;
  const ta=document.getElementById('names'), cnt=document.getElementById('cnt');
  const rs=document.getElementById('rounds'), av=document.getElementById('adv');
  const upd=()=>{
    const n=ta.value.split(String.fromCharCode(10)).map(x=>x.trim()).filter(Boolean).length;
    if(n<2){ cnt.innerHTML='&nbsp;'; return; }
    const R=Math.min(+rs.value, maxRounds(n)), adv=Math.min(+av.value,n);
    const per=Math.floor(n/2), bye=n%2?' + 1 bye each round':'';
    let msg=`<b>${n}</b> players &rarr; <b>${per}</b> game${per===1?'':'s'} at a time${bye}, <b>${R}</b> rounds = <b>${per*R}</b> games. Everyone plays ${R}. Top <b>${adv}</b> advance.`;
    if(+rs.value>maxRounds(n)) msg+=` <span class="warn">${n} players only support ${maxRounds(n)} rounds without a rematch.</span>`;
    if(adv>=n) msg+=` <span class="warn">That advances everyone &mdash; drop to top 2.</span>`;
    cnt.innerHTML=msg;
  };
  ta.addEventListener('input',upd); rs.addEventListener('change',upd); av.addEventListener('change',upd);
  upd(); ta.focus();
}
function go(){
  buildStage(document.getElementById('names').value.split(String.fromCharCode(10)),
    document.getElementById('shuffle').checked,
    +document.getElementById('rounds').value,
    +document.getElementById('adv').value);
}

function renderStage(ctrls,app){
  ctrls.innerHTML=`<button class="btn ghost" onclick="editPlayers()">Edit players</button>
    <button class="btn ghost" onclick="addRound()">Add a round</button>
    <button class="btn ghost" onclick="clearWins()">Clear results</button>
    <button class="btn dark" onclick="reset()">New tournament</button>`;
  let cols="";
  for(let r=0;r<S.R;r++){
    const ps=pairs(r);
    let matches="";
    ps.forEach((pr,m)=>{
      const v=S.res[r+"-"+m];
      if(pr[1]===-1){
        matches+=`<div class="match"><div class="mh">Game ${m+1}</div>`
          +`<div class="slot win"><span class="sd"></span><span class="nm">${esc(S.p[pr[0]])}</span></div>`
          +`<div class="slot bye"><span class="sd"></span><span class="nm">Bye &mdash; sits out</span></div></div>`;
        return;
      }
      matches+=`<div class="match"><div class="mh">Game ${m+1}</div>`
        +stageSlot(r,m,0,pr[0],v)+stageSlot(r,m,1,pr[1],v)+`</div>`;
    });
    const done=roundDone(r);
    cols+=`<div class="col"><div class="rh">Round ${r+1}${done?' <span class="done">&check; done</span>':''}</div><div class="matches">${matches}</div></div>`;
  }
  const rows=standings(), chosen=sel();
  const allDone=[...Array(S.R).keys()].every(roundDone);
  let trs="";
  rows.forEach((row,ix)=>{
    const on=chosen.indexOf(row.i)>=0;
    trs+=`<tr class="${on?'adv':''}"><td class="rk">${ix+1}</td><td class="nm">${esc(row.nm)}</td>`
      +`<td class="wl">${row.w}&ndash;${row.l}${row.bye?' *':''}</td>`
      +`<td class="ck"><input type="checkbox" ${on?'checked':''} onclick="toggleSel(${row.i})" aria-label="Advance ${esc(row.nm)}"></td></tr>`;
  });
  const anyBye=rows.some(r=>r.bye);
  const tied=S.selManual?null:cutTie(rows,chosen.length);
  const stand=`<aside class="stand"><h2>Standings</h2><table>${trs}</table>
    <div class="foot">
      ${tied?`<div class="note"><b>Still level at the cut:</b> ${tied.map(esc).join(', ')} &mdash; same record, head-to-head doesn't separate them. Tick the ones you want.</div>`:''}
      ${anyBye?'<div class="note">* includes a bye, which counts as a win. Untick to override.</div>':''}
      <div class="note">${allDone?'All rounds in.':'<b>'+[...Array(S.R).keys()].filter(r=>!roundDone(r)).map(r=>'Round '+(r+1)).join(', ')+'</b> still open.'} ${chosen.length} selected to advance.</div>
      ${S.selManual?'<button class="lnk" onclick="resetSel()">Reset to top by record</button>':''}
      <button class="btn" onclick="buildKO()">Send ${chosen.length} to the bracket &rsaquo;</button>
    </div></aside>`;
  app.innerHTML=`<div class="gs"><div><div class="board">${cols}</div>
    <div class="hint">Click the winner of each game. Click again to undo. Pairings rotate each round &mdash; nobody plays the same opponent twice.</div></div>${stand}</div>`;
}
function stageSlot(r,m,side,pi,v){
  const won = v===side;
  return `<div class="slot pick${won?' win':''}" onclick="setRes(${r},${m},${side})"><span class="sd"></span><span class="nm">${esc(S.p[pi])}</span></div>`;
}

function renderKO(ctrls,app){
  ctrls.innerHTML=`<button class="btn ghost" onclick="backToRounds()">&lsaquo; Back to rounds</button>
    <button class="btn ghost" onclick="clearKO()">Clear winners</button>
    <button class="btn dark" onclick="reset()">New tournament</button>`;
  const R=nRounds(); let cols="";
  for(let r=0;r<R;r++){
    const fin=(S.ko.slots.length/Math.pow(2,r))===2;
    let matches="";
    const count=S.ko.slots.length/Math.pow(2,r+1);
    for(let m=0;m<count;m++){
      const w=winner(r,m);
      matches+=`<div class="match">${koSlot(r,m,0,w)}${koSlot(r,m,1,w)}</div>`;
    }
    cols+=`<div class="col"><div class="rh${fin?' fin':''}">${koLabel(r)}</div><div class="matches">${matches}</div></div>`;
  }
  const champ=winner(R-1,0), done=champ&&champ!=="BYE";
  cols+=`<div class="col champ"><svg><use href="#trophy"/></svg><div class="lbl">Champion</div><div class="who${done?'':' tbd'}">${done?esc(champ):'TBD'}</div></div>`;
  app.innerHTML=`<div class="ko"><div class="board">${cols}</div>
    <div class="hint">Click a name to send them through. A pick can be changed any time &mdash; later rounds update automatically.</div></div>`;
}
function koSlot(r,m,side,w){
  const p=participant(r,m,side);
  let cls="slot", label;
  if(p==null){ cls+=" tbd"; label="TBD"; }
  else if(p==="BYE"){ cls+=" bye"; label="Bye"; }
  else { label=esc(p); const a=participant(r,m,0), b=participant(r,m,1);
    if(a&&b&&a!=="BYE"&&b!=="BYE") cls+=" pick";
    if(w===p) cls+=" win"; }
  const onclick=(p&&p!=="BYE")?` onclick="pick(${r},${m},${side})"`:"";
  return `<div class="${cls}"${onclick}><span class="sd"></span><span class="nm">${label}</span></div>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- control actions ---------- */
function editPlayers(){ const names=S.p.slice(); S=null; save(); render();
  setTimeout(()=>{const ta=document.getElementById('names'); if(ta){ta.value=names.join(String.fromCharCode(10)); ta.dispatchEvent(new Event('input'));}},0); }
function addRound(){ if(S.R>=maxRounds(S.p.length)){ alert("With "+S.p.length+" players you'd start repeating matchups."); return; } S.R++; if(!S.selManual) S.sel=null; save(); render(); }
function clearWins(){ if(confirm("Clear all results? Players and pairings stay.")){ S.res={}; S.sel=null; S.selManual=false; save(); render(); } }
function backToRounds(){ if(confirm("Back to the rounds? The bracket picks are cleared.")){ S.ko=null; save(); render(); } }
function clearKO(){ if(confirm("Clear the bracket winners?")){ S.ko.picks={}; save(); render(); } }
function reset(){ if(confirm("Start a new tournament? This clears everything.")){ S=null; save(); render(); } }

load(); render();
</script>
<script defer src="/edit.js"></script>
</body>
