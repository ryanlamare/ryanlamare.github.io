<!doctype html><html lang="en"><head><meta charset="utf-8"><script src="/teaching/exec/negotiation/kit/gtrooms.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Session 6 · Oil Pricing desk</title>
<link rel="stylesheet" href="/brand.css">
<style>
/* Ryan's desk for the Oil Pricing Exercise (9 Nov 2026; the rules of the log are in ../oil.js). He moves the game on
   from here and nothing else does: start it with the number of groups, then one button opens each month, shows the
   room its prices, sends out each memo and sends the representatives to meet. The grid shows which boards have a
   phone, whose price is in for the open month, and each board's answer to a memo. Tapping a board lets him set or
   correct its price, or answer the memo for it, when a phone has failed. Every tap is kept on this phone until the
   poll server has it. ?room=x runs a rehearsal in its own room. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:20px 14px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tag{font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--muted)}
.tag i{display:inline-block;width:10px;height:10px;background:var(--red);margin-right:10px;vertical-align:middle}
h1{font-weight:700;font-size:24px;line-height:1.25;color:var(--red)}
.lbl{font-weight:600;font-size:15px;line-height:1.4;color:var(--muted)}
button{font-family:var(--sans);cursor:pointer;-webkit-tap-highlight-color:transparent}
button.go{width:100%;font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper);background:var(--red);border:2.5px solid var(--red);padding:18px 10px;line-height:1.3}
button.go.warn{background:var(--ink);border-color:var(--ink)}
button.go:disabled{opacity:.3}
.row{display:grid;gap:8px}
button.opt{font-weight:700;font-size:20px;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);padding:14px 0}
table{width:100%;border-collapse:collapse}
th{font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:6px 4px;text-align:left}
th.a{color:var(--teal)} th.b{color:var(--terracotta)}
td{border-top:1.5px solid var(--rule);padding:0}
td.g{font-family:var(--display);font-weight:900;font-size:22px;width:44px;padding:8px 4px}
td button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 4px;color:var(--ink)}
td .v{font-family:var(--display);font-weight:900;font-size:22px}
td .v.wait{color:var(--muted);font-family:var(--sans);font-weight:600;font-size:15px}
td .s{font-weight:600;font-size:12px;color:var(--muted)}
.sheet{border:2.5px solid var(--ink);background:var(--card);padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet .sh{font-weight:700;font-size:15px}
.quiet{background:none;border:0;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:underline;padding:8px;align-self:center}
.net{font-weight:600;font-size:13px;color:var(--muted);text-align:center;min-height:1.2em}
.net.bad{color:var(--red)}
</style></head><body>
<div class="wrap" id="app"></div>
<script src="../oil.js?v=1109"></script>   <!-- bump v with every change to oil.js -->
<script>
(function(){
const O = window.OIL, app = document.getElementById('app');
const SESSION = Math.random().toString(36).slice(2, 8);
let G = O.parse([]), lines = [], loaded = false, pending = [], sent = 0, sending = false, netBad = false, pick = null, armed = false;
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const btn = (cls, text, on) => { const b = h('button', cls, text); b.type = 'button'; b.onclick = on; return b; };

/* every tap goes into a queue and is applied here at once; the queue empties as the server takes each line */
function say(line){ pending.push(line); armed = false; rebuild(); pump(); }
function pump(){
  if (sending || !pending.length) return;
  sending = true;
  O.say('oild-' + SESSION + '-' + Math.floor(sent / 15), pending[0]).then(() => { lines.push(pending.shift()); sent++; sending = false; netBad = false; rebuild(); pump(); })
    .catch(() => { sending = false; netBad = true; render(); setTimeout(pump, 2500); });
}
function rebuild(){ G = O.parse(lines.concat(pending)); render(); }
function pull(){ if (pending.length || sending) return; O.entries().then(l => { if (pending.length || sending) return; lines = l; loaded = true; netBad = false; rebuild(); }).catch(() => { netBad = true; render(); }); }

function render(){
  app.replaceChildren();
  const t = h('div', 'tag'); t.append(h('i'), 'Oil Pricing · desk'); app.append(t);
  if (!loaded) { app.append(h('div', 'lbl', 'Connecting…')); return; }
  if (!G.n) {
    app.append(h('h1', null, 'How many groups?'), h('div', 'lbl', 'Each group is one Alba board and one Batia board.'));
    const r = h('div', 'row'); r.style.gridTemplateColumns = 'repeat(5,1fr)';
    for (let n = 2; n <= 6; n++) r.append(btn('opt', String(n), () => say('o|g|' + n)));
    app.append(r, net()); return;
  }
  const s = G.stage, m = O.month(G), B = O.boards(G);
  app.append(h('h1', null, O.title(s)));
  const isMonth = /^m\d$/.test(s), isQ = s[0] === 'q';
  const inN = isMonth ? B.filter(b => O.p(G, b, m)).length : isQ ? B.filter(b => O.ans(G, b, m)).length : 0;
  if (isMonth) app.append(h('div', 'lbl', inN + ' of ' + B.length + ' boards have set their price'));
  if (isQ) app.append(h('div', 'lbl', inN + ' of ' + B.length + ' boards have answered the memo'));
  if (s.slice(0, 2) === 'mm') { const met = []; for (let j = 1; j <= G.n; j++) if (O.meets(G, m, j)) met.push(j);
    app.append(h('div', 'lbl', met.length ? 'Meeting: group' + (met.length > 1 ? 's ' : ' ') + met.join(', ') + '. The others have no meeting.' : 'No group has a meeting: at least one board in each said no.')); }
  const nx = O.NEXT[s];
  if (nx) {
    const short = (isMonth || isQ) && inN < B.length;
    const b = btn('go' + (short && armed ? ' warn' : ''), short && armed ? 'Not every board is in. Tap again to go on anyway' : nx[1], () => { if (short && !armed) { armed = true; render(); return; } say('o|st|' + nx[0]); });
    app.append(b);
  } else app.append(h('div', 'lbl', 'The game is over. The deck’s results slide has every group’s eight months.'));

  /* the grid: a row a group, Alba beside Batia */
  const tb = h('table'), hr = h('tr'); hr.append(h('th', null, ''), h('th', 'a', 'Alba'), h('th', 'b', 'Batia')); tb.append(hr);
  for (let j = 1; j <= G.n; j++) {
    const r = h('tr'); r.append(h('td', 'g', String(j)));
    ['a', 'b'].forEach(c => {
      const b = c + j, td = h('td'), k = G.joins[b] || 0;
      let v = '', wait = false;
      if (isMonth) { const p = O.p(G, b, m); v = p ? '$' + p : 'waiting'; wait = !p; }
      else if (isQ || s.slice(0, 2) === 'mm') { const a = O.ans(G, b, m); v = a === 'y' ? 'Yes' + (O.rep(G, b, m) ? ' · ' + O.rep(G, b, m) : '') : a === 'n' ? 'No' : 'waiting'; wait = !a; }
      else { const p = O.p(G, b, m); v = p ? '$' + p : '–'; }
      const x = btn(null, '', () => { pick = pick === b ? null : b; render(); });
      x.append(h('div', 'v' + (wait ? ' wait' : ''), v), h('div', 's', k ? k + (k === 1 ? ' phone' : ' phones') : 'no phone yet'));
      td.append(x); r.append(td);
    });
    tb.append(r);
  }
  app.append(tb);
  /* set or correct a board's price, or answer the memo for it */
  if (pick && (isMonth || isQ)) {
    const sh = h('div', 'sheet'); sh.append(h('div', 'sh', O.NAME[pick[0]] + ', group ' + pick[1] + (isMonth ? ': set its price for month ' + m : ': answer the memo for it')));
    const r = h('div', 'row');
    if (isMonth) { r.style.gridTemplateColumns = 'repeat(3,1fr)'; O.PRICES.forEach(p => r.append(btn('opt', '$' + p, () => { const b = pick; pick = null; say('o|P|' + b + '|' + m + '|' + p); }))); }
    else { r.style.gridTemplateColumns = '1fr 1fr';
      r.append(btn('opt', 'Yes', () => { const b = pick; pick = null; say('o|Q|' + b + '|' + m + '|y'); }),
               btn('opt', 'No', () => { const b = pick; pick = null; say('o|Q|' + b + '|' + m + '|n'); })); }
    sh.append(r, btn('quiet', 'Close', () => { pick = null; render(); })); app.append(sh);
  }
  app.append(net());
}
function net(){ return h('div', 'net' + (netBad ? ' bad' : ''), netBad ? 'No connection: ' + pending.length + ' tap' + (pending.length === 1 ? '' : 's') + ' waiting to send' : pending.length ? 'Sending…' : ''); }
render(); pull(); setInterval(pull, 2000);
})();
</script>
</body></html>
