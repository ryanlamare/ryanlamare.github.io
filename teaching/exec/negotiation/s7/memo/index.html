<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Strategic Negotiation · Session 7 — A memo for the Oil Pricing Boards</title>
<link rel="stylesheet" href="/brand.css">
<style>
/* His two Oil Pricing memos (BADM 590, word for word; the text is in ../oil.js), for the screen: memo/#4 before month 4
   and memo/#7 before month 7. A page of its own, on purpose (his 21 Sep 2026 rule for Price Wars' news): the memos are
   not in the Session 7 deck, so no keypress there brings one up early and nobody paging through the deck finds them.
   The game slide shows a link to the right memo only once the desk has sent it out; the boards' phones show it too.
   BACK TO SESSION 7 returns to the game slide. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:28px 20px 60px}
.paper{max-width:980px;margin:0 auto;background:var(--paper);padding:44px 56px 40px;display:flex;flex-direction:column;gap:16px}
.mh{font-family:var(--display);font-weight:900;font-size:54px;line-height:1;color:var(--red);letter-spacing:.03em}
.mm{font-weight:600;font-size:19px;color:var(--muted);line-height:1.5}
.rule{height:4px;background:var(--ink);margin:4px 0 6px}
p{font-weight:500;font-size:23px;line-height:1.5}
.back{display:block;max-width:980px;margin:22px auto 0;font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper);text-decoration:none}
.back:hover{text-decoration:underline}
@media (max-width:700px){.paper{padding:24px 20px}.mh{font-size:34px}p{font-size:17px}.mm{font-size:15px}}
</style></head><body>
<div class="paper" id="paper"></div>
<a class="back" id="back" href="../#4">&larr; Back to Session 7</a>
<script src="../oil.js?v=1109"></script>
<script>
(function(){
const O = window.OIL, el = document.getElementById('paper');
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function draw(){
  const n = /^#7/.test(location.hash) ? 7 : 4, M = O.MEMO[n];
  el.replaceChildren(h('div', 'mh', M.head), h('div', 'mm', 'To: ' + M.to), h('div', 'mm', 'From: ' + M.from), h('div', 'rule'), h('p', null, M.open));
  M.p.forEach(t => el.append(h('p', null, t)));
  el.append(h('p', null, M.close), h('p', null, M.sign));
  /* a rehearsal keeps its room on the way back */
  const rm = new URLSearchParams(location.search).get('room');
  document.getElementById('back').href = '../' + (rm ? '?room=' + encodeURIComponent(rm) : '') + '#4';
}
draw(); addEventListener('hashchange', draw);
})();
</script>
</body></html>
