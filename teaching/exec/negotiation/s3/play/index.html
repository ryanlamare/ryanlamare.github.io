<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>The Job Offer · Your phone</title>
<link rel="stylesheet" href="/brand.css">
<style>
/* The Job Offer played on phones (a sample block for Ryan, 15 Oct 2026; unlinked). Our own version
   of the exercise, so nothing here is licensed: the brief, the numbers and the record are all on the
   phone, and nothing is printed.
     pair → role → the brief (one page, the rules first) → the numbers, which add up whatever is on the
     table while the pair negotiates, against the person's BATNA → record → their own score.
   No planning step: before they talk nobody can know what the other side wants, so a target would only
   ever be the maximum, and with the BATNA given in points the resistance point is the BATNA (Ryan, 15 Oct).
   The words and option labels are public; each side's POINTS and BATNA are not. They sit next to this
   page encrypted (numbers.enc) and open only with the key in the session's link (#k=...), which the
   browser never sends to a server. Without the key the page runs on invented demo numbers.
   Nothing is sent anywhere unless the link names a rehearsal room (?room=<x>): then the deal goes to
   neg3-deals-<x> as the deck's usual "d|..." line.
   Deep links for screenshots: ?fresh&pair=7&role=a&step=brief|table|record|done&tab=…
   All wording is Claude's draft, for Ryan to change. */
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);--sel:var(--ink);--pad:14px}
body.role-a{--sel:var(--teal)} body.role-r{--sel:var(--terracotta)}
.wrap{max-width:520px;margin:0 auto;padding:16px var(--pad) 36px;display:flex;flex-direction:column;gap:16px}
.tag{font-weight:500;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag i{display:inline-block;width:10px;height:10px;background:var(--red);margin-right:9px;vertical-align:middle}
.tag b{font-weight:700;letter-spacing:.1em;color:var(--sel)}
.tag .demo{background:var(--ochre);color:var(--ink);font-weight:700;letter-spacing:.12em;padding:2px 7px;font-size:10px}
h2{font-weight:700;font-size:22px;line-height:1.25}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.nums button{font-family:var(--display);font-weight:900;font-size:22px;padding:12px 0 9px;background:var(--card);border:2px solid var(--ink);color:var(--ink);cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rolebtn{font-family:var(--sans);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper);border:none;padding:30px 8px;cursor:pointer}
.rolebtn.a{background:var(--teal)} .rolebtn.r{background:var(--terracotta)}
.back{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:none;border:none;color:var(--muted);cursor:pointer;text-decoration:underline;align-self:flex-start;padding:2px 0}
.go{font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper);background:var(--sel);border:none;padding:16px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.go:disabled{opacity:.35;cursor:default}
.go.ghost{background:none;color:var(--ink);border:2px solid var(--ink)}
.err{font-weight:600;font-size:14px;color:var(--red);min-height:1.2em;text-align:center}

/* the brief: one page */
.brief{display:flex;flex-direction:column;gap:14px}
.brief p{font-weight:400;font-size:17px;line-height:1.5}
.brief h3{font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.rules{border-left:5px solid var(--red);background:var(--paper-soft);padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.rules h3{margin:0;color:var(--red)}
.rules ol{list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:8px}
.rules li{counter-increment:r;position:relative;padding-left:26px;font-weight:500;font-size:16px;line-height:1.4}
.rules li::before{content:counter(r);position:absolute;left:0;top:0;font-family:var(--display);font-weight:900;color:var(--red)}
.rules li b{font-weight:700}
.terms{list-style:none;display:flex;flex-direction:column;gap:6px}
.terms li{font-size:16px;line-height:1.4} .terms b{font-weight:700}

/* the numbers: one screen, no scrolling on a phone */
.board{height:100vh;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom))}
.sum{display:flex;flex-direction:column;gap:5px}
.sum .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sum .k{font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sum .v{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;color:var(--ink)}
.sum .v small{font-family:var(--sans);font-weight:600;font-size:13px;color:var(--muted);margin-left:4px}
.sum .v.part{color:var(--grey)}
.sum .of{font-weight:600;font-size:13px;color:var(--muted);text-align:right}
.track{position:relative;height:10px;background:var(--rule)}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--sel);transition:width .25s}
.track.part .fill{opacity:.45}
.track .tk{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px}
.track .tk.bt{background:var(--red)}
.marks{position:relative;height:14px;font-weight:700;font-size:10.5px;letter-spacing:.04em;white-space:nowrap}
.marks span{position:absolute;top:0;transform:translateX(-50%)}
.marks .bt{color:var(--red)}
.hint{font-weight:500;font-size:13px;line-height:1.35;color:var(--muted)}
.grid{flex:1;min-height:0;display:grid;grid-template-rows:repeat(8,minmax(36px,1fr));gap:5px;max-height:560px}
@media (max-height:600px){.board .hint{display:none}.sum .v{font-size:28px}.board{gap:6px}}
.trm{display:grid;grid-template-columns:76px 1fr;gap:6px;align-items:stretch;min-height:0}
.tn{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
.tn b{font-weight:700;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;line-height:1.15;color:var(--ink)}
.tn i{display:block;height:4px;background:var(--sel);opacity:.8}
.ch{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;min-width:0}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;background:var(--paper-soft);border:1.5px solid var(--rule);cursor:pointer;padding:2px 1px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;color:var(--ink);font-family:var(--sans)}
.chip .o{font-weight:500;font-size:10.5px;line-height:1.1;color:var(--muted);white-space:nowrap;overflow:hidden;max-width:100%}
.chip .p{font-family:var(--display);font-weight:900;font-size:16px;line-height:1.05}
.chip.on{background:var(--sel);border-color:var(--sel)} .chip.on .o,.chip.on .p{color:var(--paper)}
.foot{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.foot .go{padding:14px 8px;font-size:14px}

/* the record */
.deal{list-style:none;display:flex;flex-direction:column}
.deal li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:16px}
.deal li span{font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.deal li b{font-weight:700;color:var(--sel)}
.score{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score b{font-family:var(--display);font-weight:900;font-size:28px;color:var(--ink);letter-spacing:0}
.extra{display:flex;flex-direction:column;gap:6px}
.extra label{font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.extra textarea{font-family:var(--sans);font-weight:500;font-size:16px;color:var(--ink);background:var(--paper-soft);border:2px solid var(--rule);padding:10px 12px;resize:none;height:64px}
.extra textarea:focus{outline:none;border-color:var(--sel)}
.nodeal{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.04em;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;align-self:center;padding:4px}
.hold{position:relative;overflow:hidden;font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper);background:var(--red);border:2.5px solid var(--red);padding:17px 18px;cursor:pointer;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hold:disabled{opacity:.35;cursor:default}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink)}
.hold.holding .fill{width:100%;transition:width 650ms linear}
.hold span{position:relative}
.splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--paper);padding:24px;text-align:center;animation:cin .35s ease-out;background:var(--sel)}
.splash .ck{font-weight:700;font-size:15px;letter-spacing:.3em;text-transform:uppercase}
.splash .cp{font-family:var(--display);font-weight:900;font-size:40px;line-height:1.05;text-transform:uppercase}
@keyframes cin{from{transform:scale(1.1);opacity:0}to{transform:scale(1);opacity:1}}
.done{text-align:center;padding:50px 0 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.done .k{font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.done .big{font-family:var(--display);font-weight:900;font-size:64px;line-height:1}
.done .sm{font-weight:600;font-size:16px;color:var(--muted);line-height:1.5}
</style></head><body>
<div id="app"></div>
<script src="/teaching/exec/negotiation/s3/deals.js"></script>
<script>
(function(){
const N = window.NEG, Q = new URLSearchParams(location.search), H = new URLSearchParams(location.hash.slice(1));
const app = document.getElementById('app');
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const fmt = n => Math.round(n).toLocaleString('en-GB');
const LIVE = !!N.suffix;                      /* only a rehearsal room (?room=<x>) ever sends anything */

/* the eight terms, in the order of the agreement form; o is the option, s its short form for the numbers */
const TERMS = [
  {n:'Salary',           o:['£54,000','£56,000','£58,000','£60,000','£62,000'], s:['£54k','£56k','£58k','£60k','£62k'],
   a:'Salary: what you are paid a year', r:'Salary: what the applicant is paid a year'},
  {n:'Joining bonus',    o:['£2,000','£3,000','£4,000','£5,000','£6,000'], s:['£2k','£3k','£4k','£5k','£6k'],
   a:'Joining bonus: a one-off payment when you join', r:'Joining bonus: a one-off payment when the applicant joins'},
  {n:'Base office',      o:['London','Reading','Bristol','Leeds','Glasgow'],
   a:'Base office: where you work from', r:'Base office: where the applicant works from'},
  {n:'Annual leave',     o:['22 days','24 days','26 days','28 days','30 days'],
   a:'Annual leave: days a year, plus bank holidays', r:'Annual leave: days a year, plus bank holidays'},
  {n:'First assignment', o:['Ports','Depots','Accounts','Fleet','Sales'],
   a:'First assignment: the part of the business you run first', r:'First assignment: the part of the business the applicant runs first'},
  {n:'Training budget',  o:['£1,000','£1,500','£2,000','£2,500','£3,000'], s:['£1k','£1.5k','£2k','£2.5k','£3k'],
   a:'Training budget: what Harbourline spends on your training each year', r:'Training budget: what Harbourline spends on the applicant’s training each year'},
  {n:'Start date',       o:['4 weeks','6 weeks','8 weeks','10 weeks','12 weeks'], s:['4 wks','6 wks','8 wks','10 wks','12 wks'],
   a:'Start date: how many weeks after signing you start', r:'Start date: how many weeks after signing the applicant starts'},
  {n:'Minimum stay',     o:['12 months','18 months','24 months','30 months','36 months'], s:['12 mo','18 mo','24 mo','30 mo','36 mo'],
   a:'Minimum stay: if you leave sooner, you repay the joining bonus', r:'Minimum stay: if the applicant leaves sooner, they repay the joining bonus'},
];
const ROLE = {a:'Applicant', r:'Recruiter'};
const OTHER = {a:'recruiter', r:'applicant'};
const BRIEF = {
  a: {who:'You are the applicant',
      story:['You are an operations manager with eight years’ experience in freight and logistics, and you live in London. Harbourline Logistics, a growing company with sites around the UK, is hiring a manager for its operations team.',
             'After two rounds of interviews, Harbourline has told you that you are its first choice. You like the company and you want the job. It is yours if you and Harbourline’s recruiter can agree the terms of your contract.'],
      worth:'to you',
      alt: b => 'You also have a written offer from a smaller logistics company outside London, open until the end of this week. The pay is lower, the job is smaller, and you would have to move. You have worked out that it is worth ' + fmt(b) + ' points to you, on the same scale as your numbers. If you and the recruiter do not reach a deal, you take that job and score ' + fmt(b) + ' points.'},
  r: {who:'You are the recruiter',
      story:['You are on the recruiting committee of Harbourline Logistics, a growing company with sites around the UK. Harbourline is hiring a manager for its operations team.',
             'After two rounds of interviews, the committee agreed that its first choice is an operations manager with eight years’ experience in freight and logistics, who lives in London. The applicant wants the job, and you can hire them if the two of you can agree the terms of the contract.'],
      worth:'to Harbourline',
      alt: b => 'If you do not reach a deal, the committee will offer the job to its second choice, who has less experience and would need more support in the first year. You have worked out that hiring the second choice is worth ' + fmt(b) + ' points to Harbourline, on the same scale as your numbers. If you and the applicant do not reach a deal, you hire the second choice and score ' + fmt(b) + ' points.'},
};

/* invented numbers for anyone without the key: the same scale, but not the exercise's real structure */
const DEMO = {
  a: [[0,500,1000,1500,2000],[0,200,400,600,800],[600,1200,900,300,0],[0,400,800,1200,1600],
      [1600,1200,800,400,0],[0,200,400,800,600],[1600,1200,800,400,0],[400,300,200,100,0]],
  r: [[2000,1500,1000,500,0],[1600,1200,800,400,0],[600,1200,900,300,0],[1600,1200,800,400,0],
      [0,100,200,300,400],[0,200,400,800,600],[0,100,200,300,400],[0,500,1000,1500,2000]],
  batna: {a:4200, r:4600},
};
let PTS = null, demo = false;

/* ---------- state ---------- */
const KEY = 'neg3-play-' + N.room;
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(_) { return {}; } };
let st = Q.has('fresh') ? {} : load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(_){} };
if (Q.get('pair')) st.pair = +Q.get('pair') || 1;
if (Q.get('role') === 'a' || Q.get('role') === 'r') st.role = Q.get('role');
const digits = (s, fill) => s.slice(0, 8).padEnd(8, '-').split('').map(c => /[0-4]/.test(c) ? +c : fill);
if (Q.get('tab')) st.tab = digits(Q.get('tab'), -1);
if (Q.get('step')) st.step = Q.get('step');
let voter; try { voter = localStorage.getItem('neg3-voter'); } catch(_){}
if (!voter) { voter = 'neg3-' + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 6); try { localStorage.setItem('neg3-voter', voter); } catch(_){} }
const send = t => LIVE && !demo ? N.say(voter, t) : Promise.resolve({ok:true});

const mine = () => PTS[st.role];
const best = i => Math.max(...mine()[i]);
const MAX = () => mine().reduce((t, r) => t + Math.max(...r), 0);
const total = arr => arr.reduce((t, o, i) => t + (o >= 0 ? mine()[i][o] : 0), 0);
const count = arr => arr.filter(o => o >= 0).length;

/* ---------- pieces ---------- */
function head(){
  document.body.classList.toggle('role-a', st.role === 'a');
  document.body.classList.toggle('role-r', st.role === 'r');
  const t = el('div', 'tag'), l = el('span');
  l.append(el('i'), document.createTextNode('The Job Offer'));
  t.appendChild(l);
  const r = el('span');
  if (demo) r.append(el('span', 'demo', 'Demo numbers'), document.createTextNode(' '));
  if (st.pair) r.appendChild(el('b', null, 'Pair ' + st.pair + (st.role ? ' · ' + ROLE[st.role] : '')));
  t.appendChild(r);
  return t;
}
function button(cls, label, fn){ const b = el('button', cls, label); b.type = 'button'; b.onclick = fn; return b; }
function holdButton(label, onDone){
  const b = el('button', 'hold'); b.type = 'button';
  const f = el('div', 'fill'), s = el('span', null, label); b.append(f, s);
  let timer = null;
  const start = e => { if (b.disabled) return; e.preventDefault(); b.classList.add('holding'); timer = setTimeout(() => { timer = null; b.classList.remove('holding'); onDone(); }, 650); };
  const stop = () => { if (timer) { clearTimeout(timer); timer = null; } b.classList.remove('holding'); };
  b.addEventListener('pointerdown', start); b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop); b.addEventListener('pointercancel', stop);
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.setLabel = x => { s.textContent = x; };
  return b;
}
function splash(line, then){
  const s = el('div', 'splash'); s.append(el('div', 'ck', 'Pair ' + st.pair), el('div', 'cp', line));
  document.body.appendChild(s); setTimeout(() => { s.remove(); then(); }, 1300);
}
/* keep the screen awake while the numbers are up */
let lock = null;
const wake = on => {
  if (on && !lock && navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { lock = l; l.addEventListener('release', () => { lock = null; }); }).catch(() => {});
  if (!on && lock) { lock.release().catch(() => {}); lock = null; }
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && st.step === 'table') wake(true); });

/* ---------- screens ---------- */
function shell(){ const w = el('div', 'wrap'); app.replaceChildren(w); return w; }
function pairScreen(){
  const w = shell(); w.append(head(), el('h2', null, 'Your pair number'));
  const g = el('div', 'nums');
  for (let n = 1; n <= 24; n++) g.appendChild(button(null, String(n), () => { st.pair = n; save(); draw(); }));
  w.appendChild(g);
}
function roleScreen(){
  const w = shell(); w.append(head(), el('h2', null, 'Your role'));
  const two = el('div', 'two');
  ['a', 'r'].forEach(k => two.appendChild(button('rolebtn ' + k, ROLE[k], () => { st.role = k; st.step = 'brief'; save(); draw(); })));
  w.append(two, button('back', 'Change pair number', () => { delete st.pair; save(); draw(); }));
}
function briefScreen(){
  const B = BRIEF[st.role], w = shell(), b = el('div', 'brief');
  b.appendChild(el('h2', null, B.who));
  B.story.forEach(p => b.appendChild(el('p', null, p)));
  const rules = el('div', 'rules'), ol = el('ol');
  rules.append(el('h3', null, 'The rules'), ol);
  [['Your goal is to score as many points as you can.', true],
   ['Your numbers show what each option is worth ' + B.worth + '. The most you can score is ' + fmt(MAX()) + ' points.'],
   ['You have a deal only when you agree on all eight terms, and you can mix options across the terms however you like.'],
   ['Never show your numbers to the ' + OTHER[st.role] + ', and never tell them how many points anything is worth ' + B.worth + '.'],
   ['If you do not reach a deal, you score ' + fmt(PTS.batna[st.role]) + ' points.']]
    .forEach(([t, bold]) => { const li = el('li'); li.appendChild(bold ? el('b', null, t) : document.createTextNode(t)); ol.appendChild(li); });
  b.appendChild(rules);
  b.appendChild(el('h3', null, 'The eight terms'));
  const ul = el('ul', 'terms');
  TERMS.forEach(t => { const li = el('li'), s = t[st.role], k = s.indexOf(':');
    if (k < 0) li.appendChild(el('b', null, s)); else li.append(el('b', null, s.slice(0, k)), document.createTextNode(s.slice(k))); ul.appendChild(li); });
  b.appendChild(ul);
  b.append(el('h3', null, 'Your alternative'), el('p', null, B.alt(PTS.batna[st.role])));
  w.append(head(), b);
  w.appendChild(button('go', st.seen ? 'Back to your numbers' : 'See your numbers', () => { st.step = 'table'; save(); draw(); }));
  w.appendChild(button('back', 'Change pair or role', () => { st = {}; save(); draw(); }));
  scrollTo(0, 0);
}
/* the numbers: tap what is on the table, and the total adds it up against the person's BATNA */
function board(){
  const sel = st.tab || (st.tab = Array(8).fill(-1));
  st.seen = true; save();
  const bd = el('div', 'board'); app.replaceChildren(bd);
  const sum = el('div', 'sum'), r1 = el('div', 'row');
  const v = el('div', 'v'), of = el('div', 'of'), left = el('div');
  left.append(el('div', 'k', 'On the table'), v); r1.append(left, of);
  const mx = MAX(), bt = PTS.batna[st.role];
  const pos = n => Math.max(0, Math.min(100, n / mx * 100)) + '%';
  const track = el('div', 'track'), fill = el('div', 'fill'), tk = el('i', 'tk bt');
  tk.style.left = pos(bt); track.append(fill, tk);
  const marks = el('div', 'marks'), m = el('span', 'bt', 'BATNA ' + fmt(bt));
  m.style.left = pos(bt); marks.appendChild(m);
  sum.append(r1, track, marks);
  const hint = el('div', 'hint', 'Tap the options on the table, and the total adds them up. The bar under each term shows how much it can be worth.');
  const grid = el('div', 'grid'), chips = [];
  TERMS.forEach((t, i) => {
    const row = el('div', 'trm'), tn = el('div', 'tn'), w = el('i');
    w.style.width = (best(i) / 2400 * 100) + '%';
    tn.append(el('b', null, t.n), w);
    const ch = el('div', 'ch');
    chips[i] = t.o.map((o, j) => {
      const c = el('button', 'chip'); c.type = 'button';
      c.setAttribute('aria-label', t.n + ', ' + o + ', ' + mine()[i][j] + ' points');
      c.append(el('span', 'o', (t.s || t.o)[j]), el('span', 'p', fmt(mine()[i][j])));
      c.onclick = () => { sel[i] = sel[i] === j ? -1 : j; save(); paint(); };
      ch.appendChild(c); return c;
    });
    row.append(tn, ch); grid.appendChild(row);
  });
  const foot = el('div', 'foot');
  foot.append(button('go ghost', 'Brief', () => { st.step = 'brief'; save(); draw(); }),
              button('go', 'Record our deal', () => { st.step = 'record'; save(); draw(); }));
  bd.append(head(), sum, hint, grid, foot);
  function paint(){
    const n = count(sel), tot = total(sel);
    v.replaceChildren(document.createTextNode(fmt(tot)), el('small', null, '/ ' + fmt(mx)));
    v.classList.toggle('part', n < 8);
    of.textContent = n < 8 ? n + ' of 8 terms' : 'All eight terms';
    fill.style.width = pos(tot); track.classList.toggle('part', n < 8);
    chips.forEach((row, i) => row.forEach((c, j) => c.classList.toggle('on', sel[i] === j)));
  }
  paint(); wake(true);
}
function recordScreen(){
  const w = shell(), tab = st.tab || [], all = count(tab) === 8;
  w.append(head(), el('h2', null, st.nodeal ? 'No deal' : 'The deal you agreed'));
  const err = el('div', 'err');
  let go;
  if (st.nodeal) {
    w.appendChild(el('p', 'hint', 'With no deal, you score ' + fmt(PTS.batna[st.role]) + ' points.'));
    go = holdButton('Hold to send: no deal', () => record('x'));
    w.append(go, err);
  } else if (!all) {
    w.appendChild(el('p', 'hint', 'Set all eight terms on your numbers first, or tell us there was no deal.'));
  } else {
    const ul = el('ul', 'deal');
    TERMS.forEach((t, i) => { const li = el('li'); li.append(el('span', null, t.n), el('b', null, t.o[tab[i]])); ul.appendChild(li); });
    const sc = el('div', 'score'); sc.append('Your score', el('b', null, fmt(total(tab))));
    const ex = el('div', 'extra'), lab = el('label', null, 'Anything else you agreed?'), ta = el('textarea');
    ta.maxLength = 140; ta.placeholder = 'Optional'; ta.value = st.extra || ''; ta.oninput = () => { st.extra = ta.value; save(); };
    lab.htmlFor = ta.id = 'extra'; ex.append(lab, ta);
    go = holdButton('Hold to send', () => record(tab.join(''), N.clean(ta.value)));
    w.append(ul, sc, ex, go, err);
  }
  function record(d, c){
    send('d|' + st.pair + '|' + st.role + '|' + d).then(() => c ? send('c|' + st.pair + '|' + st.role + '|' + c) : null)
      .then(() => { st.sent = d; st.step = 'done'; save(); splash(d === 'x' ? 'No deal' : 'Deal recorded', draw); })
      .catch(() => { err.textContent = 'That did not go through. Hold again.'; });
  }
  w.append(button('nodeal', st.nodeal ? 'We did reach a deal' : 'We did not reach a deal', () => { st.nodeal = !st.nodeal; save(); draw(); }),
           button('back', 'Back to your numbers', () => { st.step = 'table'; save(); draw(); }));
  wake(false);
}
function doneScreen(){
  const w = shell(), d = el('div', 'done'), nd = st.sent === 'x';
  const mine2 = nd ? PTS.batna[st.role] : total(st.tab);
  d.append(el('div', 'k', 'Your score'), el('div', 'big', fmt(mine2)));
  const sm = el('div', 'sm');
  sm.append('Your BATNA was ' + fmt(PTS.batna[st.role]), el('br'), 'Eyes on the screen');
  d.appendChild(sm);
  w.append(head(), d);
  if (!LIVE) w.appendChild(button('back', 'Start again', () => { st = {}; save(); draw(); }));
  wake(false);
}
function draw(){
  if (!st.pair) return pairScreen();
  if (!st.role) return roleScreen();
  if (st.sent != null && st.step !== 'done') st.step = 'done';
  switch (st.step) {
    case 'table': return board();
    case 'record': return recordScreen();
    case 'done': return doneScreen();
    default: return briefScreen();
  }
}

/* ---------- the numbers: the real ones with the session's key, invented ones without ---------- */
function failed(msg){ app.replaceChildren(); const w = shell(); w.append(el('h2', null, 'These numbers could not be opened'), el('p', 'hint', msg)); }
async function open(){
  let k = H.get('k');
  try { if (k) sessionStorage.setItem('neg3-play-k', k); else k = sessionStorage.getItem('neg3-play-k'); } catch(_){}
  if (!k) { PTS = DEMO; demo = true; return; }
  const b64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/').replace(/\s+/g, '')), c => c.charCodeAt(0));
  const blob = b64(await (await fetch('/teaching/exec/negotiation/s3/play/numbers.enc', {cache:'no-store'})).text());
  const key = await crypto.subtle.importKey('raw', b64(k), 'AES-GCM', false, ['decrypt']);
  const p = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:blob.slice(0, 12)}, key, blob.slice(12))));
  if (p.issues.join('|') !== TERMS.map(t => t.n).join('|')) throw new Error('terms');
  PTS = p;
}
open().then(draw)
  .catch(() => failed('Check that you opened the link from the session, all of it, and try again.'));
})();
</script>
