<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Your own prisoner's dilemma</title>
<link rel="stylesheet" href="/brand.css">
<style>
/* Module 4's closing exercise, in two touches, one phone each (solo since
   18 Sep 2026, Ryan's call; it was one phone per Price Wars team only because
   the team shared a phone). One real situation from their world filled into
   the template from Strip out the story: the two sides, the collective
   action, the individual action. The cell at the top of this page builds as
   they type: each side walks in as a prisoner, the actions are chalked on
   the wall, and LOCK IT IN slams the door. The deck (m4/index.html, the
   prison wall) shows every cell. Then, once the deck has opened the second
   question (after Four lessons), the same phone answers how they would get
   out of it, and its own cell plays the escape.

   Wire and the drawing: cell.js. The name goes on line 1 so Module 7 can
   hand the dilemma back to its owner on any phone. ?room=<x> suffixes the
   room for a rehearsal. All wording is Claude's, for veto. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:22px 18px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tag{font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--muted)}
.tag i{display:inline-block;width:10px;height:10px;background:var(--red);margin-right:10px;vertical-align:middle}
h1{font-weight:700;font-size:22px;line-height:1.25;color:var(--red)}
.hint{font-weight:500;font-size:15px;line-height:1.4;color:var(--muted)}
.status{font-weight:600;font-size:15px;color:var(--muted);min-height:1.4em}
.me{display:flex;align-items:baseline;justify-content:space-between;gap:12px} .me[hidden]{display:none}
.me .who{font-weight:700;font-size:15px}
.me .who b{color:var(--red)}
.me button,.back{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:none;border:none;color:var(--muted);cursor:pointer;text-decoration:underline;padding:0;align-self:flex-start}
.choices{display:flex;flex-direction:column;gap:11px}
button.pick{display:block;text-align:left;width:100%;font-family:var(--sans);font-weight:600;font-size:17px;line-height:1.35;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);padding:14px 16px;cursor:pointer}
.namerow{display:flex;gap:10px}
.namerow input{flex:1 1 0;width:0;font-family:var(--sans);font-weight:600;font-size:17px;color:var(--ink);background:var(--paper-soft);border:2.5px solid var(--ink);padding:12px 14px;outline:none;min-width:0}
.namerow button{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:.08em;background:var(--red);border:2.5px solid var(--red);color:var(--paper);padding:0 18px;cursor:pointer}
/* the cell, built as the answers come in */
.build{border:2.5px solid var(--ink);background:#2A2825;position:sticky;top:0;z-index:2;box-shadow:0 4px 0 rgba(0,0,0,.07);overflow:hidden}
.build .jc{width:100%;aspect-ratio:2/1}
.build .plate{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;background:#D9C5AD;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;min-height:26px}
.build .plate span{flex:1 1 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.build .plate .a{color:var(--teal)} .build .plate .b{color:var(--terracotta);text-align:right}
.build .plate .ph{color:var(--muted);font-weight:500;font-style:italic;text-transform:none;letter-spacing:0}
/* the cards */
.card{border:3px solid var(--side,var(--ink));border-radius:14px;background:var(--paper-soft);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.07)}
.card.sides{--side:var(--red)} .card.hold{--side:var(--teal)} .card.defect{--side:var(--terracotta)} .card.route{--side:var(--ink)}
.card .suit{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;color:var(--side);padding-bottom:7px;border-bottom:2px solid var(--side)}
.card .pq{font-weight:600;font-size:16px;line-height:1.35}
.card .pq small{display:block;font-weight:500;font-size:13.5px;color:var(--muted);margin-top:3px}
.card input[type=text]{font-family:var(--sans);font-weight:600;font-size:17px;line-height:1.35;color:var(--ink);background:transparent;border:0;border-bottom:1.5px dashed var(--rule);padding:6px 0 8px;width:100%;outline:none}
.card input[type=text]:focus{border-bottom-color:var(--side)}
.card input:disabled{opacity:.45}
.card ::placeholder{color:var(--muted);font-weight:400;opacity:.8}
.card .two{display:flex;flex-direction:column;gap:2px}
.card .two label{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;margin-top:6px}
.card .two label.a{color:var(--teal)} .card .two label.b{color:var(--terracotta)}
.chips{display:flex;flex-direction:column;gap:8px}
button.opt{display:block;text-align:left;width:100%;font-family:var(--sans);font-weight:600;font-size:15px;line-height:1.35;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);padding:11px 14px;cursor:pointer}
button.opt small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:2px}
button.opt.mine{background:var(--side,var(--red));border-color:var(--side,var(--red));color:var(--paper)}
button.opt.mine small{color:var(--paper);opacity:.85}
button.opt:disabled{opacity:.45;cursor:default}
button.lock{width:100%;font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:.1em;background:var(--red);border:2.5px solid var(--red);color:var(--paper);padding:15px 18px;cursor:pointer}
button.lock:disabled{background:var(--card);border-color:var(--ink);color:var(--ink);opacity:.45;cursor:default}
.bigcard{border:2.5px solid var(--ink);background:var(--card);padding:18px;text-align:center}
.bigcard .head{font-weight:700;font-size:22px;color:var(--red)}
.bigcard .sub{font-weight:600;font-size:15px;color:var(--muted);margin-top:8px;line-height:1.4}
#app{display:flex;flex-direction:column;gap:12px}
</style>
</head><body>
<div class="wrap">
  <div class="tag"><i></i>APPLIED GAME THEORY · MODULE 4</div>
  <h1 id="q">Your own prisoner’s dilemma</h1>
  <div class="hint" id="hint"></div>
  <div class="build" id="build" hidden><div class="plate" id="plate"></div><div class="jc" id="cell"></div></div>
  <div class="me" id="me" hidden><span class="who">Playing as <b></b></span><button type="button">change</button></div>
  <div id="app"></div>
  <div class="status" id="status" aria-live="polite"></div>
</div>
<script src="/go/names.js"></script>
<script src="/teaching/exec/gt/m4/pds/cell.js"></script>
<script>
const C=window.M4_CELL;
document.head.appendChild(Object.assign(document.createElement('style'),{textContent:C.CSS}));
const QS=new URLSearchParams(location.search);
const SUF=QS.get('room')?('-'+QS.get('room').replace(/[^a-z0-9-]/g,'')):'';
const API=QS.get('api')||'https://gt-poll.rlamare.workers.dev', ROOM='m4-pds'+SUF, LOCKKEY='gt-pd-locked'+SUF, ROUTEKEY='gt-pd-route'+SUF;
const SIDEMAX=50, MOVEMAX=90;
let voter=null;
try{
  voter=localStorage.getItem('gt-voter');
  if(!voter){voter=([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
    localStorage.setItem('gt-voter',voter);}
}catch(_){voter='v'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);}
const app=document.getElementById('app'), st=document.getElementById('status'), hint=document.getElementById('hint'), q=document.getElementById('q');
const build=document.getElementById('build'), cellEl=document.getElementById('cell'), plate=document.getElementById('plate'), meEl=document.getElementById('me');
const clean=n=>String(n||'').trim().replace(/[|‖]/g,'/').replace(/\s+/g,' ');
const cleanName=n=>clean(n).slice(0,30);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function say(line){
  return fetch(API+'/p/'+ROOM+'/say',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({t:line,v:voter})}).then(r=>{if(!r.ok)throw r.status;});
}
const failMsg=code=>code===429?'That’s plenty from one phone — flag the instructor.':'That didn’t send — try again.';

/* the name, as on every solo exercise: the join key for the points system, and what
   lets Module 7 hand this dilemma back to its owner on any phone */
let name=null, roster=[];
try{name=localStorage.getItem('gt-name');}catch(_){}
if(name)claimOnce();
fetch('/go/roster.json').then(r=>r.json()).then(d=>{roster=d.names||[];render();}).catch(()=>{render();});
function claimOnce(){
  let done=false;
  try{done=localStorage.getItem('gt-claimed')===name;}catch(_){}
  if(done||!name)return;
  fetch(API+'/p/gt-names/say',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t:name,v:voter})})
  .then(r=>{if(r.ok){try{localStorage.setItem('gt-claimed',name);}catch(_){}}}).catch(()=>{});
}
function renderName(title,done){
  q.textContent=title;app.innerHTML='';build.hidden=true;
  const list=document.createElement('div');list.className='choices';
  roster.forEach(n=>{const b=document.createElement('button');b.className='pick';b.type='button';b.textContent=n;b.addEventListener('click',()=>done(cleanName(n)));list.appendChild(b);});
  app.appendChild(list);
  const row=document.createElement('div');row.className='namerow';row.style.marginTop=roster.length?'12px':'0';
  const inp=document.createElement('input');inp.maxLength=30;inp.placeholder=roster.length?'Not on the list? Type the name':'Type the first name';inp.autocomplete='off';
  const b=document.createElement('button');b.type='button';b.textContent='OK';
  const go=()=>{const v=cleanName(inp.value);if(v)done(v);};
  b.addEventListener('click',go);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
  row.appendChild(inp);row.appendChild(b);app.appendChild(row);
}
meEl.querySelector('button').addEventListener('click',()=>{name=null;try{localStorage.removeItem('gt-name');}catch(_){}render();});

/* ---- the cell at the top: the two sides walk in, the actions are chalked, the door slams on LOCK IT IN ---- */
let shown=new Set();
function drawCell(a,b,hold,defect,bars,opts){
  const parts={a:!!a,b:!!b,hold:!!hold,defect:!!defect,bars:!!bars}, inn={};
  Object.keys(parts).forEach(k=>{if(parts[k]&&!shown.has(k))inn[k]=true;});
  cellEl.className='jc'+(opts&&opts.esc?' esc-'+opts.esc:'');
  cellEl.innerHTML=C.svg({parts,in:inn,late:!!(opts&&opts.late)});
  shown=new Set(Object.keys(parts).filter(k=>parts[k]));
  plate.innerHTML='<span class="a'+(a?'':' ph')+'">'+(a?esc(a):'Your side')+'</span><span class="b'+(b?'':' ph')+'">'+(b?esc(b):'The other side')+'</span>';
  build.hidden=false;
}

/* ---- the form ---- */
let locked=null, route=null;
try{locked=JSON.parse(localStorage.getItem(LOCKKEY));route=localStorage.getItem(ROUTEKEY);}catch(_){}
function render(){
  st.textContent='';app.innerHTML='';meEl.hidden=true;hint.textContent='';
  if(!name){renderName('Who are you?',n=>GT_NAMES.guard(n,voter,m=>{name=m;try{localStorage.setItem('gt-name',name);}catch(_){}claimOnce();render();},app,{clean:cleanName}));return;}
  q.textContent='Your own prisoner’s dilemma';meEl.hidden=false;meEl.querySelector('b').textContent=name;
  if(locked){renderLocked();return;}
  hint.textContent='On your own phone. A situation from your own world where each side is tempted to do the thing that leaves you both worse off.';
  shown=new Set();drawCell('','','','',false);
  const c1=card('sides','THE TWO SIDES','Who are the two sides?','You, and the one other party whose choice decides what you get');
  const two=document.createElement('div');two.className='two';
  const la=document.createElement('label');la.className='a';la.textContent='Your side';const sa=input(SIDEMAX,'e.g. us, the sales team…');
  const lb=document.createElement('label');lb.className='b';lb.textContent='The other side';const sb=input(SIDEMAX,'e.g. their buying team…');
  two.append(la,sa,lb,sb);c1.appendChild(two);
  const c2=card('hold','THE COLLECTIVE ACTION','What does cooperating look like?','The move that pays you both, if you both make it');
  const hold=input(MOVEMAX,'e.g. hold the price…');c2.appendChild(hold);
  const c3=card('defect','THE INDIVIDUAL ACTION','What does defecting look like?','The move each of you is tempted to make, whatever the other does');
  const defect=input(MOVEMAX,'e.g. undercut…');c3.appendChild(defect);
  const lk=btn('LOCK IT IN','lock');lk.disabled=true;
  function sync(){drawCell(clean(sa.value),clean(sb.value),clean(hold.value),clean(defect.value),false);
    lk.disabled=!(clean(sa.value)&&clean(sb.value)&&clean(hold.value)&&clean(defect.value));}
  [sa,sb,hold,defect].forEach(i=>i.addEventListener('input',sync));
  lk.addEventListener('click',()=>{
    const A=clean(sa.value),B=clean(sb.value),H=clean(hold.value),D=clean(defect.value);
    if(!A||!B||!H||!D)return;
    lk.disabled=true;[sa,sb,hold,defect].forEach(i=>i.disabled=true);st.textContent='Sending…';
    say('1‖'+A+'‖'+B+'‖'+name).then(()=>say('2‖'+H)).then(()=>say('3‖'+D))
      .then(()=>{locked={a:A,b:B,hold:H,defect:D,at:Date.now()};try{localStorage.setItem(LOCKKEY,JSON.stringify(locked));}catch(_){}render();})
      .catch(cd=>{st.textContent=failMsg(cd);lk.disabled=false;[sa,sb,hold,defect].forEach(i=>i.disabled=false);});
  });
  [c1,c2,c3].forEach(c=>app.appendChild(c));app.appendChild(lk);
  sa.focus();
}
/* locked: the door has shut; the second question arrives when the deck opens it */
let routesOpen=false, poller=null, routedNow=false;
function renderLocked(){
  if(route){
    /* the escape: played once, the moment the way out is chosen; a reload shows its end state */
    shown=new Set(['a','b','hold','defect','bars']);
    drawCell(locked.a,locked.b,locked.hold,locked.defect,true,{esc:route});
    if(!routedNow)cellEl.classList.add('done');routedNow=false;
  }else{
    /* the door slams once, the first time this screen is seen after the send */
    const fresh=Date.now()-(locked.at||0)<4000&&!shown.has('bars');
    if(!fresh)shown=new Set(['a','b','hold','defect','bars']);
    drawCell(locked.a,locked.b,locked.hold,locked.defect,true);
  }
  const big=document.createElement('div');big.className='bigcard';
  big.innerHTML='<div class="head"></div><div class="sub"></div>';
  if(route){
    const r=C.ROUTES[route];
    big.querySelector('.head').textContent=C.ESCAPED_YOU[route];
    big.querySelector('.sub').textContent=r[0]+'. '+r[1]+'.';
    app.appendChild(big);
    const again=startOver('← start over (this replaces your way out)',()=>{route=null;try{localStorage.removeItem(ROUTEKEY);}catch(_){}render();});
    app.appendChild(again);
    return;
  }
  big.querySelector('.head').textContent='Your cell is on the wall';
  big.querySelector('.sub').textContent=locked.a+' & '+locked.b+'. Look up at the screen.';
  app.appendChild(big);
  if(routesOpen){renderRoute();return;}
  const wait=document.createElement('div');wait.className='hint';wait.textContent='Keep this page open. There is one more question later in the session.';
  app.appendChild(wait);
  app.appendChild(startOver('← start over (this replaces your dilemma)',()=>{locked=null;shown=new Set();try{localStorage.removeItem(LOCKKEY);}catch(_){}render();}));
  if(!poller)poller=setInterval(checkOpen,3000);checkOpen();
}
function checkOpen(){
  if(routesOpen||route||!locked)return;
  fetch(API+'/p/'+ROOM+'/entries').then(r=>r.json()).then(d=>{
    const en=d.entries||[];
    /* a Poll Desk reset emptied the room: forget the lock, so a rehearsal phone is not stuck (a send from the last few seconds is left alone) */
    if(!en.some(e=>e.v===voter)&&Date.now()-(locked.at||0)>15000){locked=null;shown=new Set();try{localStorage.removeItem(LOCKKEY);}catch(_){}clearInterval(poller);poller=null;render();return;}
    if(C.routesOpen(en)){routesOpen=true;clearInterval(poller);poller=null;render();}
  }).catch(()=>{});
}
function renderRoute(){
  const c=card('route','THE WAY OUT','How would you get out of it?','Tap the one you would try first');
  const chips=document.createElement('div');chips.className='chips';
  let pick=null;const cb=[];
  Object.keys(C.ROUTES).forEach(kk=>{const [label,sub]=C.ROUTES[kk];
    const b=document.createElement('button');b.className='opt';b.type='button';b.innerHTML=esc(label)+'<small>'+esc(sub)+'</small>';b.dataset.k=kk;
    b.addEventListener('click',()=>{pick=kk;cb.forEach(x=>x.classList.toggle('mine',x===b));lk.disabled=false;});
    chips.appendChild(b);cb.push(b);});
  c.appendChild(chips);
  const lk=btn('LOCK IT IN','lock');lk.disabled=true;
  lk.addEventListener('click',()=>{
    if(!pick)return;lk.disabled=true;cb.forEach(b=>b.disabled=true);st.textContent='Sending…';
    say('5‖'+pick).then(()=>{route=pick;try{localStorage.setItem(ROUTEKEY,route);}catch(_){}routedNow=true;render();window.scrollTo({top:0,behavior:'smooth'});})
      .catch(cd=>{st.textContent=failMsg(cd);lk.disabled=false;cb.forEach(b=>b.disabled=false);});
  });
  app.appendChild(c);app.appendChild(lk);
}
function startOver(label,fn){const b=document.createElement('button');b.className='back';b.type='button';b.textContent=label;b.addEventListener('click',fn);return b;}
function card(side,suit,question,sub){const c=document.createElement('div');c.className='card '+side;c.innerHTML='<div class="suit"></div><div class="pq"></div>';c.querySelector('.suit').textContent=suit;
  c.querySelector('.pq').textContent=question;if(sub){const s=document.createElement('small');s.textContent=sub;c.querySelector('.pq').appendChild(s);}return c;}
function input(max,ph){const i=document.createElement('input');i.type='text';i.maxLength=max;i.placeholder=ph;i.autocomplete='off';return i;}
function btn(label,cls){const b=document.createElement('button');b.className=cls;b.type='button';b.textContent=label;return b;}
</script>
</body></html>
