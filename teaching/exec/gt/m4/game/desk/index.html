<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Price Wars — facilitator desk</title>
<link rel="stylesheet" href="/brand.css">
<style>
/* The instructor's private view of the price war: the pairing the room
   never sees, every team's members, locks and sign for the open week,
   and the week's money. Reads the same four rooms as the deck and the
   phones (?room= suffix, ?api= override). Refreshes every two seconds. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);padding:24px 20px 60px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tag{font-weight:500;text-transform:uppercase;letter-spacing:.2em;font-size:12px;color:var(--muted)}
.tag i{display:inline-block;width:10px;height:10px;background:var(--red);margin-right:10px;vertical-align:middle}
h1{font-family:var(--display);font-weight:900;font-size:34px;color:var(--red);line-height:1}
.st{font-weight:600;font-size:15px;color:var(--muted)}
.st b{color:var(--ink)}
table{border-collapse:collapse;width:100%}
th{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2.5px solid var(--ink)}
td{padding:9px 10px;border-bottom:1.5px solid var(--rule);font-weight:600;font-size:15px;vertical-align:top}
td.a{color:var(--teal);font-weight:700} td.b{color:var(--terracotta);font-weight:700}
td.m{font-weight:500;color:var(--muted);font-size:13.5px}
td.p150{color:var(--green)} td.p140{color:var(--red)}
td.def{color:var(--muted);font-style:italic}
tr.match td{background:var(--card)}
.err{color:var(--red)}
.w{display:inline-block;min-width:44px}
button.nm{font-family:var(--sans);font-weight:600;font-size:13.5px;color:var(--ink);background:var(--card);border:1.5px solid var(--rule);padding:3px 8px;cursor:pointer;margin:1px 0}
button.nm:hover{border-color:var(--ink)}
</style></head><body>
<div class="wrap">
  <div class="tag"><i></i>MODULE 4 · FACILITATOR ONLY</div>
  <h1>PRICE DESK</h1>
  <div class="st" id="status">Connecting…</div>
  <table><thead><tr><th>Match</th><th>Team</th><th>On the phones</th><th>This week</th><th>W1</th><th>W2</th><th>W3</th><th>W4</th><th>W5</th><th>W6</th><th>Total</th></tr></thead><tbody id="rows"></tbody></table>
  <div class="st" id="foot"></div>
</div>
<script>
const qs=new URLSearchParams(location.search);
const API=qs.get('api')||'https://gt-poll.rlamare.workers.dev';
const SUF=qs.get('room')?('-'+qs.get('room').replace(/[^a-z0-9-]/g,'')):'';
const ROOM={teams:'m4-teams'+SUF,prices:'m4-prices'+SUF,huddle:'m4-huddle'+SUF,meet:'m4-meet'+SUF};
const LBL={a:'Aura',b:'Buco’s'};
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const answers=room=>fetch(API+'/p/'+room+'/answers').then(r=>r.json()).then(d=>d.answers||[]);
const G={};
function parse(teams,prices,huddle,meet){
  Object.assign(G,{pair:{},opened:0,revealed:0,shock:false,meetOpen:0,repsSent:0,paper:0,sign:{},lock:{},members:{},ask:{}});
  const claim={},drop={};
  teams.forEach(t=>{const m=String(t).match(/^([ab][1-5])\s*\|\s*(.{1,40}?)$/i);if(m)claim[norm(m[2])]={name:m[2].trim(),st:m[1].toLowerCase()};});
  prices.forEach(t=>{const p=String(t).trim().toLowerCase().split('|').map(s=>s.trim());
    if(p[0]==='::pair'&&p[1]){p[1].split(',').forEach(x=>{const m=x.match(/^(a[1-5])=(b[1-5])$/);if(m){G.pair[m[1]]=m[2];G.pair[m[2]]=m[1];}});}
    else if(p[0]==='::open')G.opened=Math.max(G.opened,+p[1]||0);
    else if(p[0]==='::reveal')G.revealed=Math.max(G.revealed,+p[1]||0);
    else if(p[0]==='::shock')G.shock=p[1]==='on';
    else if(p[0]==='::meet')G.meetOpen=Math.max(G.meetOpen,+p[1]||0);
    else if(p[0]==='::reps')G.repsSent=Math.max(G.repsSent,+p[1]||0);
    else if(p[0]==='::paper')G.paper=Math.max(G.paper,+p[1]||0);
    else if(/^[ab][1-5]$/.test(p[0])&&/^[1-6]$/.test(p[1])&&/^1\.[45]0$/.test(p[2]))G.sign[p[0]+'|'+p[1]]=p[2];});
  huddle.forEach(t=>{const p=String(t).split('|').map(s=>s.trim());const s=p[0].toLowerCase();
    if(!/^[ab][1-5]$/.test(s))return;
    if(p[2]==='drop'&&p[3])drop[s+'|'+norm(p[3])]=true;
    else if(p[2]==='lock'&&p[3]&&/^1\.[45]0$/.test(p[4])){const k=s+'|'+p[1];G.lock[k]=G.lock[k]||{};G.lock[k][norm(p[3])]=p[4];}});
  Object.entries(claim).forEach(([n,c])=>{if(drop[c.st+'|'+n])return;(G.members[c.st]=G.members[c.st]||[]).push(c.name);});
  meet.forEach(t=>{const p=String(t).split('|').map(s=>s.trim());if(p[2]==='ask')G.ask[p[0].toLowerCase()+'|'+p[1]]=p[3]==='y';});
}
function profit(mine,theirs,w){
  if(G.shock&&w>=5){if(mine==='1.40'&&theirs==='1.50')return 72;if(mine==='1.50'&&theirs==='1.40')return 2;return mine==='1.50'?12:9;}
  const d=(w===3||w===6)?2:1;return mine==='1.50'?(theirs==='1.50'?12:2)*d:(theirs==='1.50'?18:9)*d;
}
const sign=(t,w)=>G.sign[t+'|'+w]||(w<=G.revealed?'1.50':'');
function tick(){
  Promise.all([answers(ROOM.teams),answers(ROOM.prices),answers(ROOM.huddle),answers(ROOM.meet)]).then(([t,p,h,m])=>{
    parse(t,p,h,m);
    const teams=Object.keys(G.members).sort();
    const A=teams.filter(k=>k[0]==='a'),B=teams.filter(k=>k[0]==='b');
    const paired=Object.keys(G.pair).filter(k=>k[0]==='a').sort().map(a=>[a,G.pair[a]]);
    const listed=new Set(paired.flat());
    const rows=[];
    const w=G.opened>G.revealed?G.opened:0;
    const row=(t,mi,mate)=>{
      const mem=G.members[t]||[],locks=w?(G.lock[t+'|'+w]||{}):{};
      let h='<tr class="'+(mi?'match':'')+'"><td>'+(mi||'—')+'</td><td class="'+t[0]+'">'+LBL[t[0]]+' '+t[1]+'</td><td class="m">'+mem.map(n=>'<button type="button" class="nm" data-n="'+esc(n)+'">'+esc(n)+'</button>').join(' ')+'</td>';
      h+='<td>'+(w?(G.sign[t+'|'+w]?'sign up £'+G.sign[t+'|'+w]:mem.map(n=>locks[norm(n)]?'£'+locks[norm(n)]:'·').join(' ')):'')+'</td>';
      let tot=0;
      for(let k=1;k<=6;k++){const s=sign(t,k),o=mate?sign(mate,k):'';const p=(s&&o&&k<=G.revealed)?profit(s,o,k):null;if(p!==null)tot+=p;
        h+='<td class="'+(s?('p'+s.replace('.','')+(G.sign[t+'|'+k]?'':' def')):'')+'">'+(s?'£'+s+(p!==null?'<br><span class="m">£'+p+'k</span>':''):'–')+'</td>';}
      return h+'<td>'+(G.revealed?'£'+tot+'k':'')+'</td></tr>';
    };
    paired.forEach(([a,b],i)=>{rows.push(row(a,i+1,b));rows.push(row(b,i+1,a));});
    teams.filter(t=>!listed.has(t)).forEach(t=>rows.push(row(t,'',null)));
    document.getElementById('rows').innerHTML=rows.join('')||'<tr><td colspan="11" class="m">Nobody has joined yet.</td></tr>';
    document.querySelectorAll('button.nm').forEach(b=>b.addEventListener('click',()=>moveName(b.dataset.n)));
    document.getElementById('status').innerHTML='<b>'+A.length+'</b> Aura and <b>'+B.length+'</b> Buco’s teams · '+(paired.length?'paired, <b>'+paired.length+'</b> matches':'not started')+
      ' · week <b>'+(G.opened||'—')+'</b>'+(G.opened>G.revealed?' open':' (week '+G.revealed+' revealed)')+(G.shock?' · <b class="err">Gazette rules on</b>':'')+
      (G.meetOpen>G.revealed?' · meetings before week '+G.meetOpen+(G.repsSent>=G.meetOpen?' (reps sent)':' (asking)'):'');
    document.getElementById('foot').innerHTML='Tap a name to move that person to another team; their phone follows within a few seconds. To put someone on a team who hasn\u2019t picked one, type their name exactly as on their phone: <button type="button" id="addn" class="nm">add a name</button>. Drop a dead phone from a team by posting "a1|0|drop|Name" into the huddle room from the Poll Desk.';
    document.getElementById('addn').addEventListener('click',()=>{const n=prompt('Their name, exactly as on their phone');if(n)moveName(n.trim());});
  }).catch(()=>{document.getElementById('status').innerHTML='<span class="err">No connection to the poll server.</span>';});
}
function moveName(n){
  const t=prompt('Put '+n+' on which team? (a1–a5 for Aura, b1–b5 for Buco’s)');
  if(!t||!/^[ab][1-5]$/i.test(t.trim()))return;
  fetch(API+'/p/'+ROOM.teams+'/say',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t:t.trim().toLowerCase()+'|'+n,v:'desk-'+Math.random().toString(36).slice(2,12)})}).then(tick);
}
setInterval(tick,2000);tick();
</script>
</body></html>
