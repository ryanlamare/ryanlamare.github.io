<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Module 4 · Price Wars</title>
<link rel="stylesheet" href="/brand.css">
<style>
/* Participant page for the Module 4 price war (the capstone of day one).
   Teams of three run one petrol station each, Aura Fuels or Buco's
   Service Station, and post a price every week without seeing the other
   station's sign. Nobody knows which station they are playing against:
   the deck pairs the teams at random when the game starts and the only
   people who ever learn are the reps who meet. The whole brief lives on
   this page, there is no separate rules sheet, and no payoff matrix is
   shown during play (the deck puts the matrix up after the game).

   Wire (four gt-poll rooms; ?room=<x> suffixes all of them for a
   rehearsal, ?demo=1 runs the whole thing locally with no network):
     m4-teams   "a1|Name"                     one line per phone, who is on which station
     m4-prices  "a1|w|1.40"                   the team's lock for week w, latest wins until the reveal
                "::pair|a1=b3,a2=b5"          the deck's random pairing (the game has started)
                "::open|w"  "::reveal|w"      the deck opens a week, then puts the signs up
                "::meet|w"  "::reps|w"        the deck offers a meeting before week w, then closes the asking
                "::shock|on"                  the Gazette rules for weeks 5 and 6 (read by the points system too)
     m4-huddle  "a1|w|1.40|Name|reason"       a teammate's leaning, seen only by that team; "a1|w|lock|Name"
     m4-meet    "a1|w|ask|y"                  the team asked (or not) for the meeting before week w
                "a1|w|agreed|Name|text"       the rep's private note of what was agreed, for the debrief
   A week is revealed on this phone only once the deck says so, never
   from the other station's lock arriving. */
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:22px 18px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tag{font-weight:500;text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag>span{white-space:nowrap}
.tag i{display:inline-block;width:10px;height:10px;background:var(--red);margin-right:10px;vertical-align:middle}
h1{font-family:var(--display);font-weight:900;font-size:40px;line-height:.95;color:var(--red);letter-spacing:.01em}
h2{font-weight:700;font-size:21px;line-height:1.25}
h2 .st{color:var(--red)}
p{font-size:16px;line-height:1.5}
p b{font-weight:700}
.lbl{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted)}
.status{font-weight:600;font-size:15px;color:var(--muted);min-height:1.4em}
.status b{color:var(--red)}
.tbtn{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:none;border:1.5px solid var(--muted);color:var(--muted);padding:5px 9px;cursor:pointer}
.tbtn.playing{border-color:var(--red);color:var(--red)}
.card{border:2.5px solid var(--ink);background:var(--card);padding:16px 18px}
.card.soft{border-style:dashed;border-color:var(--muted);background:none}
.card h3{font-weight:700;font-size:16px;margin-bottom:6px}
.card p{font-size:15px}
.card p+p{margin-top:8px}
.stack{display:flex;flex-direction:column;gap:11px}
button.big{display:block;width:100%;font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--paper);background:var(--red);border:2.5px solid var(--red);padding:16px 18px;cursor:pointer}
button.big:disabled{opacity:.4;cursor:default}
button.big.quiet{background:var(--card);color:var(--ink);border-color:var(--ink)}
.namerow{display:flex;gap:10px}
.namerow input{flex:1;font-family:var(--sans);font-weight:600;font-size:17px;color:var(--ink);
  background:var(--card);border:2.5px solid var(--ink);padding:14px 16px;min-width:0}
.namerow button{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:.08em;
  background:var(--red);border:2.5px solid var(--red);color:var(--paper);padding:14px 20px;cursor:pointer}
.me{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.me .who{font-weight:700;font-size:15px}
.me .who b{color:var(--red)}
.me button{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  background:none;border:none;color:var(--muted);cursor:pointer;text-decoration:underline}
.waitcard{border:2.5px dashed var(--muted);padding:18px;font-weight:600;font-size:15px;color:var(--muted)}
.pulse{display:inline-block;width:10px;height:10px;background:var(--red);border-radius:50%;
  margin-right:9px;vertical-align:middle;animation:pu 1.2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.25}50%{opacity:1}}

/* the station picker */
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stgrid .col{display:flex;flex-direction:column;gap:8px}
.stgrid .colh{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:12px;padding-bottom:2px;min-height:38px;display:flex;align-items:flex-end}
.stgrid .col.a .colh{color:var(--teal)} .stgrid .col.b .colh{color:var(--terracotta)}
.stgrid button{font-family:var(--sans);font-weight:700;font-size:16px;color:var(--ink);background:var(--card);
  border:2.5px solid var(--ink);padding:13px 10px;cursor:pointer}
.stgrid .col.a button.on{background:var(--teal);border-color:var(--teal);color:var(--paper)}
.stgrid .col.b button.on{background:var(--terracotta);border-color:var(--terracotta);color:var(--paper)}


/* how it's played */
.tdots{display:flex;gap:6px}
.tdots i{width:22px;height:6px;background:var(--rule)}
.tdots i.on{background:var(--red)}
.tcard h3{font-weight:700;font-size:20px;line-height:1.2}
.tcard p{font-size:15.5px;line-height:1.45;margin-top:5px}
.tcard+.signs{margin-top:2px}
.signg{transform-box:fill-box;transform-origin:center}
.signg.flip{animation:flip .52s ease-in-out}
@keyframes flip{0%{transform:scaleY(1)}50%{transform:scaleY(.04)}100%{transform:scaleY(1)}}
.fc.dim{opacity:.32}
.result.small{padding:12px}
.result.small .amt{font-size:44px}
.result.small .verdict{font-size:15px}
.cal{display:block;width:100%;height:auto}
ul.tlist{list-style:none;display:flex;flex-direction:column;gap:9px}
ul.tlist li{position:relative;padding-left:22px;font-size:15px;line-height:1.45}
ul.tlist li::before{content:"";position:absolute;left:0;top:8px;width:9px;height:9px;background:var(--red)}
.goal{background:var(--ink);color:var(--paper);padding:16px 18px;text-align:center;font-weight:700;font-size:17px;line-height:1.35}
.back{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:none;border:none;color:var(--muted);cursor:pointer;text-decoration:underline;align-self:flex-start;font-family:var(--sans)}

/* the junction */
.junction{border:2.5px solid var(--ink);background:var(--tan-light);overflow:hidden}
.junction svg{display:block;width:100%;height:auto}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wkhead .wk{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;color:var(--red)}
.wkhead .dbl{font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ochre);border:2px solid var(--ochre);padding:4px 8px}
.wkhead .shk{color:var(--red);border-color:var(--red)}
.wkhead .mine{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.wkhead .mine.a{color:var(--teal)} .wkhead .mine.b{color:var(--terracotta)}

/* the two signs you can post */
.signs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.signbtn{font-family:var(--sans);text-align:left;background:var(--card);border:2.5px solid var(--ink);padding:0;cursor:pointer;color:var(--ink);overflow:hidden}
.signbtn .top{background:var(--ink);color:var(--paper);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:6px 10px}
.signbtn .pr{font-family:var(--display);font-weight:900;font-size:46px;line-height:1;padding:12px 10px 4px}
.signbtn .pr small{font-size:22px;vertical-align:top;margin-right:1px}
.signbtn .why{font-size:12.5px;line-height:1.35;color:var(--muted);padding:0 10px 10px;font-weight:500}
.signbtn.lean{border-color:var(--red);border-width:3.5px}
.signbtn.lean .top{background:var(--red)}
.signbtn.locked{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.signbtn.locked .why{color:color-mix(in srgb,var(--paper) 75%,transparent)}
.signbtn:disabled{cursor:default}
.huddle{display:flex;flex-direction:column;gap:8px}
.huddle .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.huddle .chips{display:flex;flex-direction:column;gap:5px;min-height:10px}
.chip{font-size:13px;line-height:1.3;background:var(--card);border-left:4px solid var(--ink);padding:5px 8px}
.chip b{font-weight:700}
.chip.me{border-left-color:var(--red)}
.chip .r{display:block;color:var(--muted);font-weight:500}
.reason{width:100%;font-family:var(--sans);font-weight:600;font-size:15px;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);padding:12px 14px}
.reason::placeholder{color:var(--muted);font-weight:500}
.lockline{font-weight:600;font-size:14px;color:var(--muted)}
.lockline b{color:var(--ink)}

/* the result card and the ledger */
.result{border:2.5px solid var(--ink);background:var(--card);padding:16px;text-align:center}
.result .amt{font-family:var(--display);font-weight:900;font-size:54px;line-height:1;color:var(--ink)}
.result .amt.good{color:var(--green)} .result .amt.bad{color:var(--red)}
.result .amt small{font-size:26px;vertical-align:top}
.result .verdict{font-weight:700;font-size:16px;margin-top:8px}
.result .run{font-weight:600;font-size:13.5px;color:var(--muted);margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
.result .run b{color:var(--ink);font-size:15px}
.result .note{font-weight:600;font-size:14px;color:var(--muted);margin-top:8px}
table.ledger{width:100%;border-collapse:collapse;font-size:14px}
table.ledger th{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:2px solid var(--ink)}
table.ledger td{padding:7px 6px;border-bottom:1.5px solid var(--rule);font-weight:600}
table.ledger td.w{font-weight:700}
table.ledger td.w em{font-style:normal;font-size:10px;color:var(--ochre);margin-left:4px;letter-spacing:.1em}
table.ledger td.w em.s{color:var(--red)}
table.ledger td.you{color:var(--ink)} table.ledger td.them{color:var(--muted)}
table.ledger td.p150{color:var(--green)} table.ledger td.p140{color:var(--red)}
table.ledger tr.cur td{background:color-mix(in srgb,var(--card) 70%,transparent)}
table.ledger tr.tot td{border-top:2.5px solid var(--ink);border-bottom:none;font-weight:700;font-size:15px}
table.ledger td.blank{color:var(--rule)}

/* the meeting */
.meet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spot{background:var(--ink);color:var(--paper);padding:16px;text-align:center}
.spot .where{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;color:var(--paper);margin:4px 0}
.spot .sub{font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--paper) 70%,transparent)}
.bulletin{border:3px double var(--ink);background:var(--paper-soft);padding:14px 16px}
.bulletin .mast{font-family:var(--display);font-weight:900;font-size:22px;line-height:1;text-align:center;letter-spacing:.02em}
.bulletin .mast small{display:block;font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.bulletin h3{font-weight:700;font-size:17px;line-height:1.2;margin:10px 0 6px;color:var(--red)}
.bulletin p{font-size:14px;line-height:1.45}
.bulletin a{color:var(--ink);font-weight:700}
.foot{font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;text-align:center;margin-top:10px}

/* demo driver */
.demo{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);display:flex;gap:10px;align-items:center;padding:10px 14px;font-size:13px;font-weight:600;z-index:9}
.demo button{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--red);border:none;color:var(--paper);padding:9px 12px;cursor:pointer;margin-left:auto;white-space:nowrap}
.demo .dl{color:color-mix(in srgb,var(--paper) 70%,transparent)}
body.demo-on{padding-bottom:90px}
</style>
</head><body>
<div class="wrap">
  <div class="tag"><span><i></i>APPLIED GAME THEORY · MODULE 4</span><button class="tbtn" id="theme" type="button" aria-label="Play the theme">Theme</button></div>
  <h1 id="q">PRICE WARS</h1>
  <div id="app"></div>
  <div class="status" id="status"></div>
</div>
<audio id="themeAudio" src="showdown.mp3" preload="none"></audio>
<script src="/go/names.js"></script>
<script>
const API='https://gt-poll.rlamare.workers.dev';
const qs=new URLSearchParams(location.search);
const DEMO=qs.get('demo')==='1';
const SUF=qs.get('room')?('-'+qs.get('room').replace(/[^a-z0-9-]/g,'')):'';
const ROOM={teams:'m4-teams'+SUF,prices:'m4-prices'+SUF,huddle:'m4-huddle'+SUF,meet:'m4-meet'+SUF};
const WEEKS=6, N=5;
const LBL={a:'Aura',b:'Buco’s'};
const FULL={a:'Aura Fuels',b:'Buco’s Service Station'};
const SPOTS=['the door','the window','the back of the room','the front of the room','the corridor'];
const SK='pw'+SUF+'-';   /* localStorage keys, per room */

/* ---------- identity ---------- */
let voter=null;
try{
  voter=localStorage.getItem('gt-voter');
  if(!voter){voter=([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
    localStorage.setItem('gt-voter',voter);}
}catch(_){voter='v'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);}
let name=null, station='';
try{name=localStorage.getItem('gt-name');station=localStorage.getItem(SK+'station')||'';}catch(_){}
if(DEMO&&!name)name='You';
const app=document.getElementById('app'), st=document.getElementById('status');
const clean=n=>n.trim().replace(/[|]/g,' ').replace(/\s+/g,' ').slice(0,30);
const norm=n=>String(n).trim().toLowerCase().replace(/\s+/g,' ');
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function claimOnce(){
  if(DEMO)return;
  let done=false;
  try{done=localStorage.getItem('gt-claimed')===name;}catch(_){}
  if(done||!name)return;
  fetch(API+'/p/gt-names/say',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t:name,v:voter})})
  .then(r=>{if(r.ok){try{localStorage.setItem('gt-claimed',name);}catch(_){}}}).catch(()=>{});
}
if(name)claimOnce();

/* ---------- the wire ---------- */
const sayN={};
function say(room,line,tag){
  /* fifteen lines per voter per room is the Worker's cap; a tag (the week)
     gives each week its own allowance, so a team that changes its mind is
     never locked out */
  if(DEMO){demoSay(room,line);return Promise.resolve();}
  const k=room+(tag||'');sayN[k]=(sayN[k]||0)+1;
  const v=voter+(tag?'-'+tag:'')+'-'+(sayN[k]%9);
  return fetch(API+'/p/'+room+'/say',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({t:line,v})}).then(r=>{if(!r.ok)throw r.status;});
}
const answers=room=>DEMO?Promise.resolve(demoAnswers(room)):fetch(API+'/p/'+room+'/answers').then(r=>r.json()).then(d=>d.answers||[]);
const failMsg=code=>code===429?'That’s plenty from one phone. Flag the instructor.':'That didn’t send. Try again.';

/* the game as the wire describes it */
const G={pair:{},opened:0,revealed:0,shock:false,meetOpen:0,repsSent:0,lock:{},lean:{},locker:{},ask:{},agreed:{}};
function parse(prices,huddle,meet){
  G.pair={};G.opened=0;G.revealed=0;G.shock=false;G.meetOpen=0;G.repsSent=0;G.lock={};G.lean={};G.locker={};G.ask={};G.agreed={};
  prices.forEach(t=>{
    const p=String(t).trim().toLowerCase().split('|').map(s=>s.trim());
    if(p[0]==='::pair'&&p[1]){p[1].split(',').forEach(x=>{const m=x.match(/^(a[1-5])=(b[1-5])$/);if(m){G.pair[m[1]]=m[2];G.pair[m[2]]=m[1];}});}
    else if(p[0]==='::open'&&/^[1-6]$/.test(p[1]))G.opened=Math.max(G.opened,+p[1]);
    else if(p[0]==='::reveal'&&/^[1-6]$/.test(p[1]))G.revealed=Math.max(G.revealed,+p[1]);
    else if(p[0]==='::shock')G.shock=p[1]==='on';
    else if(p[0]==='::meet'&&/^[1-6]$/.test(p[1]))G.meetOpen=Math.max(G.meetOpen,+p[1]);
    else if(p[0]==='::reps'&&/^[1-6]$/.test(p[1]))G.repsSent=Math.max(G.repsSent,+p[1]);
    else if(/^[ab][1-5]$/.test(p[0])&&/^[1-6]$/.test(p[1])&&/^1\.[45]0$/.test(p[2]))G.lock[p[0]+'|'+p[1]]=p[2];
  });
  huddle.forEach(t=>{
    const p=String(t).split('|').map(s=>s.trim());
    const s=p[0].toLowerCase();
    if(!/^[ab][1-5]$/.test(s)||!/^[1-6]$/.test(p[1]))return;
    if(p[2]==='lock'&&p[3])G.locker[s+'|'+p[1]]=p[3];
    else if(/^1\.[45]0$/.test(p[2])&&p[3]){
      const k=s+'|'+p[1];G.lean[k]=G.lean[k]||{};G.lean[k][norm(p[3])]={name:p[3],price:p[2],why:p[4]||''};
    }
  });
  meet.forEach(t=>{
    const p=String(t).split('|').map(s=>s.trim());
    const s=p[0].toLowerCase();
    if(!/^[ab][1-5]$/.test(s)||!/^[1-6]$/.test(p[1]))return;
    if(p[2]==='ask')G.ask[s+'|'+p[1]]=p[3]==='y';
    else if(p[2]==='agreed'&&p[3]){G.agreed[s+'|'+p[1]]={name:p[3],text:p.slice(4).join(' | ')};}
  });
}
function profit(mine,theirs,week){
  if(G.shock&&week>=5){
    if(mine==='1.40'&&theirs==='1.50')return 72;
    if(mine==='1.50'&&theirs==='1.40')return 2;
    return mine==='1.50'?12:9;
  }
  const dbl=(week===3||week===6)?2:1;
  if(mine==='1.50')return (theirs==='1.50'?12:2)*dbl;
  return (theirs==='1.50'?18:9)*dbl;
}
const rival=()=>G.pair[station]||'';
const isDouble=w=>!G.shock||w<5?(w===3||w===6):false;
const meetWeeks=()=>G.shock?[3,5]:[3,6];
function ledger(){
  const r=rival();let run=0;const rows=[];
  for(let w=1;w<=WEEKS;w++){
    const mine=G.lock[station+'|'+w], theirs=r?G.lock[r+'|'+w]:'';
    const shown=w<=G.revealed&&mine&&theirs;
    const p=shown?profit(mine,theirs,w):null;
    if(p!==null)run+=p;
    rows.push({w,mine:shown?mine:'',theirs:shown?theirs:'',p,run:shown?run:null});
  }
  return {rows,total:run};
}

/* ---------- phases ---------- */
function phase(){
  if(!name)return 'name';
  if(!station)return 'station';
  if(!G.pair[station])return 'brief';
  const next=G.revealed+1;                                   /* the week that comes next */
  if(G.revealed>=WEEKS)return 'over';
  if(G.opened<next){                                          /* between weeks */
    if(G.meetOpen===next)return G.repsSent===next?'meeting':'asking';
    return G.revealed===0?'brief':'between';
  }
  return G.revealed<G.opened?'week':'between';
}
let lastKey='';
function render(force){
  const ph=phase();
  const key=ph+'|'+G.opened+'|'+G.revealed+'|'+G.shock+'|'+G.meetOpen+'|'+G.repsSent+'|'+station;
  const same=key===lastKey&&!force;
  lastKey=key;
  if(!same){app.replaceChildren();stopCars();}
  ({name:renderName,station:renderStation,brief:renderBrief,week:renderWeek,between:renderBetween,asking:renderAsking,meeting:renderMeeting,over:renderOver})[ph](same);
}

/* who are you */
function renderName(same){
  if(same)return;
  app.innerHTML='<h2>Who are you?</h2><p>Your name, so your station’s result counts for you in the points.</p>'+
    '<div class="namerow"><input id="nm" maxlength="30" autocomplete="off" placeholder="First name and initial"><button id="nmgo" type="button">GO</button></div>';
  const inp=document.getElementById('nm');
  const go=()=>{const n=clean(inp.value);if(!n)return;
    GT_NAMES.guard(n,voter,m=>{name=m;try{localStorage.setItem('gt-name',name);}catch(_){}claimOnce();render(true);},app,{clean});};
  document.getElementById('nmgo').addEventListener('click',go);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  inp.focus();
}

/* which station */
function renderStation(same){
  if(same)return;
  let h='<div class="me"><span class="who">You are <b>'+esc(name)+'</b></span><button type="button" id="notme">Not me</button></div>'+
    '<h2>Which station are you?</h2><p>Ryan will tell your team which one you are. Everyone on the team picks the same one.</p><div class="stgrid">';
  ['a','b'].forEach(s=>{h+='<div class="col '+s+'"><div class="colh">'+FULL[s]+'</div>';
    for(let i=1;i<=N;i++)h+='<button type="button" data-st="'+s+i+'">'+LBL[s]+' '+i+'</button>';h+='</div>';});
  h+='</div>';
  app.innerHTML=h;
  document.getElementById('notme').addEventListener('click',()=>{name=null;try{localStorage.removeItem('gt-name');localStorage.removeItem('gt-claimed');}catch(_){}render(true);});
  app.querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click',()=>{
    station=b.dataset.st;try{localStorage.setItem(SK+'station',station);}catch(_){}
    say(ROOM.teams,station+'|'+name).catch(c=>{st.textContent=failMsg(c);});
    render(true);
  }));
}

/* ---------- how it's played: a guided practice week ----------
   Five cards, a picture and a line each, the way a cooking game shows a
   recipe. The team posts a sign against a station that holds, then the
   other sign, then sees what both cutting looks like, then the shape of
   the six weeks, then the goal. Nothing to read at length. */
const tut={step:0,first:'',second:''};
function tutDone(){try{return localStorage.getItem(SK+'tut')==='1';}catch(_){return false;}}
function renderBrief(same){
  if(same)return;
  if(tutDone()){
    app.innerHTML='<div class="me"><span class="who">You are <b>'+esc(name)+'</b> on <b>'+LBL[station[0]]+' '+station[1]+'</b></span><button type="button" id="chst">Change</button></div>'+
      '<div class="waitcard"><span class="pulse"></span>Waiting for the game to start.</div>'+
      '<div class="goal">Make as much money as you can across the six weeks. Not beat the other station, and not be liked by them.</div>'+
      '<button type="button" class="back" id="again">Show me how it’s played again</button>';
    document.getElementById('chst').addEventListener('click',()=>{station='';try{localStorage.removeItem(SK+'station');}catch(_){}render(true);});
    document.getElementById('again').addEventListener('click',()=>{try{localStorage.removeItem(SK+'tut');}catch(_){}tut.step=0;tut.first='';tut.second='';render(true);});
    return;
  }
  tut.step=0;tut.first='';tut.second='';
  tutCard();
}
function tutCard(){
  const me=station[0], them=me==='a'?'b':'a';
  const other=LBL[them];
  const dots='<div class="tdots">'+[0,1,2,3,4].map(i=>'<i class="'+(i<=Math.min(tut.step,4)?'on':'')+'"></i>').join('')+'</div>';
  const card=(h,p,btn,id)=>'<div class="tcard"><h3>'+h+'</h3>'+(p?'<p>'+p+'</p>':'')+'</div>'+(btn?'<button type="button" class="big" id="'+id+'">'+btn+'</button>':'');
  const mine=p=>me==='a'?p:'', theirs=p=>me==='b'?p:'';
  const setBoth=(pm,pt)=>setSigns(me==='a'?pm:pt,me==='a'?pt:pm);
  const payoff=(pm,pt)=>({12:'They held too. A quiet week, and nobody wins a driver.',18:'They held at £1.50 and nearly every car on the road turned in to you. They kept the regulars: £2k.',9:'You both cut. Cheap fuel for the district, and nothing gained from each other.',2:'They cut, you held, and only the regulars came in.'})[profit(pm,pt,1)];
  app.innerHTML='<div class="me"><span class="who">You are <b>'+esc(name)+'</b> on <b>'+LBL[me]+' '+station[1]+'</b></span><button type="button" id="chst">Change</button></div>'+
    '<div class="lbl">How it’s played</div>'+dots+junctionSVG(me)+'<div id="tbody"></div>';
  document.getElementById('chst').addEventListener('click',()=>{station='';try{localStorage.removeItem(SK+'station');}catch(_){}render(true);});
  const body=document.getElementById('tbody');
  const dim=on=>{const f=app.querySelector('.fc.'+them);if(f)f.classList.toggle('dim',on);};
  if(tut.step===0){
    dim(true);setBoth('','');startCars('flow');
    body.innerHTML=card('This is you','Same fuel, same road, same drivers as '+other+' opposite. The number on your sign is the only difference.','Next','tnext');
    document.getElementById('tnext').addEventListener('click',()=>{tut.step=1;tutCard();});
  }
  else if(tut.step===1||tut.step===2){
    /* post a sign; the other station holds. Then the other sign. */
    const second=tut.step===2;
    dim(false);setBoth('','');startCars('flow');
    body.innerHTML=card(second?'Now try the other one':'Post a sign',second?'':'Every Monday you post your price without seeing theirs. Tap one.')+
      '<div class="signs">'+
      '<button type="button" class="signbtn" data-p="1.50"'+(second&&tut.first==='1.50'?' disabled':'')+'><div class="top">Hold</div><div class="pr"><small>£</small>1.50</div></button>'+
      '<button type="button" class="signbtn" data-p="1.40"'+(second&&tut.first==='1.40'?' disabled':'')+'><div class="top">Cut</div><div class="pr"><small>£</small>1.40</div></button></div>'+
      '<div id="tres"></div>';
    body.querySelectorAll('.signbtn').forEach(b=>b.addEventListener('click',()=>{
      const p=b.dataset.p;if(second)tut.second=p;else tut.first=p;
      body.querySelectorAll('.signbtn').forEach(x=>{x.disabled=true;x.classList.toggle('locked',x.dataset.p===p);});
      setBoth(p,'');
      setTimeout(()=>{flipSign(them,'1.50');},700);
      setTimeout(()=>{
        startCars('split',me==='a'?p:'1.50',me==='a'?'1.50':p);
        const pr=profit(p,'1.50',1);
        document.getElementById('tres').innerHTML='<div class="result small"><div class="amt '+(pr>12?'good':'')+'"><small>£</small><span id="tamt">0</span><small>k</small></div><div class="verdict">'+payoff(p,'1.50')+'</div></div>'+
          '<button type="button" class="big" id="tnext">'+(second?'What if they cut too?':'Now try the other one')+'</button>';
        countUp('tamt',pr);
        document.getElementById('tnext').addEventListener('click',()=>{tut.step=second?3:2;tutCard();});
      },1500);
    }));
  }
  else if(tut.step===3){
    dim(false);setBoth('1.40','');startCars('flow');
    body.innerHTML=card('They can think it too','')+'<div id="tres"></div>';
    setTimeout(()=>{flipSign(them,'1.40');},500);
    setTimeout(()=>{
      startCars('split','1.40','1.40');
      document.getElementById('tres').innerHTML='<div class="result small"><div class="amt bad"><small>£</small><span id="tamt">0</span><small>k</small></div><div class="verdict">'+payoff('1.40','1.40')+'</div>'+
        '<div class="note">And hold while they cut, and you’re the one on £2k.</div></div>'+
        '<button type="button" class="big" id="tnext">Next</button>';
      countUp('tamt',9);
      document.getElementById('tnext').addEventListener('click',()=>{tut.step=4;tutCard();});
    },1300);
  }
  else if(tut.step===4){
    setBoth('','');startCars('flow');
    body.innerHTML=card('Six weeks','')+calendarSVG()+
      '<ul class="tlist"><li>Weeks 3 and 6 pay double. Before each, you can ask for a two-minute meeting with the other station. It happens only if both sides ask, and nothing said in it binds anyone.</li>'+
      '<li>Each week your team leans on this page and one of you locks the price. The other station sees none of it.</li>'+
      '<li>You won’t know which '+other+' you are playing. Only the person you send to a meeting will ever find out.</li></ul>'+
      '<button type="button" class="big" id="tnext">One more thing</button>';
    document.getElementById('tnext').addEventListener('click',()=>{tut.step=5;tutCard();});
  }
  else{
    setBoth('','');startCars('flow');
    body.innerHTML='<div class="goal">Make as much money as you can across the six weeks. Not beat the other station, and not be liked by them.</div>'+
      '<button type="button" class="big" id="tnext">I’m ready</button>';
    document.getElementById('tnext').addEventListener('click',()=>{try{localStorage.setItem(SK+'tut','1');}catch(_){}render(true);});
  }
}
function flipSign(side,price){
  const g=document.getElementById('sign'+side.toUpperCase()+'g');if(!g)return;
  g.classList.remove('flip');void g.getBBox();g.classList.add('flip');
  setTimeout(()=>{const t=document.getElementById('sign'+side.toUpperCase());if(t)t.textContent='£'+price;},260);
}
function countUp(id,to){
  const el=document.getElementById(id);if(!el)return;const t0=performance.now();
  const step=now=>{const u=Math.min(1,(now-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-u,3)));if(u<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
function calendarSVG(){
  /* six boxes, weeks 3 and 6 taller and gold, a speech mark in the gap before each */
  let h='<svg class="cal" viewBox="0 0 360 100" role="img" aria-label="Six weeks; weeks 3 and 6 pay double and each has a meeting before it">';
  let x=26;
  for(let w=1;w<=6;w++){
    const dbl=w===3||w===6, hgt=dbl?66:46, y=80-hgt;
    if(dbl){x+=14;const cx=x-11;
      h+='<path d="M'+(cx-8)+' 46 h16 v12 h-5 l-3 5 l-3 -5 h-5 z" fill="var(--ink)"/>'+
         '<text x="'+cx+'" y="96" text-anchor="middle" font-family="Jost,sans-serif" font-weight="700" font-size="8" letter-spacing="1" fill="var(--muted)">MEET</text>';}
    h+='<rect x="'+x+'" y="'+y+'" width="40" height="'+hgt+'" fill="'+(dbl?'var(--ochre)':'var(--card)')+'" stroke="var(--ink)" stroke-width="2.5"/>'+
       '<text x="'+(x+20)+'" y="'+(y+(dbl?26:22))+'" text-anchor="middle" font-family="League Spartan,sans-serif" font-weight="900" font-size="'+(dbl?22:18)+'" fill="var(--ink)">'+w+'</text>'+
       (dbl?'<text x="'+(x+20)+'" y="'+(y+50)+'" text-anchor="middle" font-family="Jost,sans-serif" font-weight="700" font-size="12" letter-spacing="1" fill="var(--ink)">\u00d72</text>':'');
    x+=48;
  }
  h+='</svg>';
  return h;
}

/* ---------- the junction ---------- */
let carsRAF=null, cars=[], carsMode='none', carsMine='', carsTheirs='';
function junctionSVG(me){
  /* Aura's forecourt on the left of the road, Buco's on the right, cars
     come down the road and turn into whichever forecourt the prices send
     them to; the sign boards carry the week's prices */
  const A=me==='a', side=s=>s===me?'mine':'';
  return '<div class="junction"><svg viewBox="0 0 360 230" role="img" aria-label="The junction, with Aura Fuels on the left of the road and Buco’s on the right">'+
    '<rect x="0" y="0" width="360" height="230" fill="var(--tan-light)"/>'+
    '<rect x="150" y="0" width="60" height="230" fill="var(--grey)"/>'+
    '<g fill="var(--paper)"><rect x="178" y="8" width="4" height="18"/><rect x="178" y="42" width="4" height="18"/><rect x="178" y="76" width="4" height="18"/><rect x="178" y="110" width="4" height="18"/><rect x="178" y="144" width="4" height="18"/><rect x="178" y="178" width="4" height="18"/><rect x="178" y="212" width="4" height="18"/></g>'+
    '<rect x="118" y="90" width="32" height="70" fill="var(--grey)"/><rect x="210" y="90" width="32" height="70" fill="var(--grey)"/>'+
    '<g class="fc a '+side('a')+'"><rect x="18" y="86" width="104" height="78" fill="var(--paper)" stroke="var(--teal)" stroke-width="3"/>'+
    '<rect x="34" y="104" width="12" height="30" fill="var(--teal)"/><rect x="58" y="104" width="12" height="30" fill="var(--teal)"/><rect x="82" y="104" width="12" height="30" fill="var(--teal)"/>'+
    '<rect x="18" y="86" width="104" height="10" fill="var(--teal)"/></g>'+
    '<g class="fc b '+side('b')+'"><rect x="238" y="86" width="104" height="78" fill="var(--paper)" stroke="var(--terracotta)" stroke-width="3"/>'+
    '<rect x="254" y="104" width="12" height="30" fill="var(--terracotta)"/><rect x="278" y="104" width="12" height="30" fill="var(--terracotta)"/><rect x="302" y="104" width="12" height="30" fill="var(--terracotta)"/>'+
    '<rect x="238" y="86" width="104" height="10" fill="var(--terracotta)"/></g>'+
    '<g id="cars"></g>'+
    /* the signs, drawn last so cars pass behind them */
    '<g id="signAg" class="signg"><rect x="18" y="14" width="104" height="58" fill="var(--ink)"/><rect x="66" y="72" width="8" height="14" fill="var(--ink)"/>'+
    '<text x="70" y="30" text-anchor="middle" font-family="Jost,sans-serif" font-weight="700" font-size="10" letter-spacing="1.5" fill="var(--teal)">AURA FUELS'+(A?' · YOU':'')+'</text>'+
    '<text id="signA" x="70" y="62" text-anchor="middle" font-family="League Spartan,sans-serif" font-weight="900" font-size="30" fill="var(--paper)">?</text></g>'+
    '<g id="signBg" class="signg"><rect x="238" y="14" width="104" height="58" fill="var(--ink)"/><rect x="286" y="72" width="8" height="14" fill="var(--ink)"/>'+
    '<text x="290" y="30" text-anchor="middle" font-family="Jost,sans-serif" font-weight="700" font-size="10" letter-spacing="1.5" fill="var(--terracotta)">BUCO’S'+(!A?' · YOU':'')+'</text>'+
    '<text id="signB" x="290" y="62" text-anchor="middle" font-family="League Spartan,sans-serif" font-weight="900" font-size="30" fill="var(--paper)">?</text></g>'+
    '</svg></div>';
}
function setSigns(a,b){
  const sa=document.getElementById('signA'), sb=document.getElementById('signB');
  if(sa)sa.textContent=a?'£'+a:'?';
  if(sb)sb.textContent=b?'£'+b:'?';
}
function startCars(mode,pa,pb){
  /* mode: 'flow' before the reveal (everyone drives past), 'split' after
     it (the prices decide who turns in) */
  stopCars();carsMode=mode;carsMine=pa;carsTheirs=pb;cars=[];
  const g=document.getElementById('cars');if(!g)return;
  let last=performance.now(), spawn=0;
  const pick=()=>{
    if(carsMode!=='split')return 's';
    const r=Math.random();
    if(pa===pb)return r<.38?'a':(r<.76?'b':'s');
    const cheap=pa==='1.40'?'a':'b';
    return r<.78?cheap:(r<.88?(cheap==='a'?'b':'a'):'s');
  };
  const tick=now=>{
    const dt=Math.min(50,now-last);last=now;spawn-=dt;
    if(spawn<=0){cars.push({t:-0.05,dest:pick(),lane:Math.random()<.5?168:192});spawn=carsMode==='split'?260:420;}
    cars.forEach(c=>{c.t+=dt/2600;});
    cars=cars.filter(c=>c.t<1.05);
    let h='';
    cars.forEach(c=>{
      let x,y,rot=0,op=1;
      if(c.dest==='s'){x=c.lane;y=-30+c.t*290;}
      else{
        /* down to the junction, then a curve into the forecourt */
        const k=c.t/0.42;
        if(k<1){x=c.lane;y=-30+k*130;}
        else{const u=Math.min(1,(c.t-0.42)/0.5);const tx=c.dest==='a'?70:290;
          x=c.lane+(tx-c.lane)*(1-Math.pow(1-u,2));y=100+u*40;rot=(c.dest==='a'?-1:1)*Math.sin(u*Math.PI)*70;op=u>0.8?1-(u-0.8)/0.2:1;}
      }
      h+='<rect x="-7" y="-12" width="14" height="24" rx="3" fill="var(--ink)" opacity="'+op.toFixed(2)+'" transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+rot.toFixed(1)+')"/>';
    });
    g.innerHTML=h;
    carsRAF=requestAnimationFrame(tick);
  };
  carsRAF=requestAnimationFrame(tick);
}
function stopCars(){if(carsRAF){cancelAnimationFrame(carsRAF);carsRAF=null;}}

/* ---------- a week in play ---------- */
function weekHead(w){
  const s=G.shock&&w>=5;
  return '<div class="wkhead"><span class="wk">WEEK '+w+'</span>'+
    (s?'<span class="dbl shk">Gazette rules</span>':(isDouble(w)?'<span class="dbl">Pays double</span>':''))+
    '<span class="mine '+station[0]+'">'+LBL[station[0]]+' '+station[1]+'</span></div>';
}
function bulletinHTML(){
  return '<div class="bulletin"><div class="mast">The Junction Gazette<small>Stop the presses · special edition</small></div>'+
    '<h3>Price wars at the junction go digital</h3>'+
    '<p>FuelWatch, the price app sweeping the region, has just added the junction to its map. From this Monday every driver within twenty miles sees both signs, live, before choosing where to fill up.</p>'+
    '<p><b>Undercut alone and the app sends every car on every road to your forecourt: £72k for the week.</b> The undercut station keeps its £2k of regulars. Match each other and the app has nothing to show: £12k each at £1.50, £9k each at £1.40. The week 6 doubling is off. <a href="../extra/" target="_blank" rel="noopener">Read the paper</a></p></div>';
}
let leanPrice='', leanWhy='';
function renderWeek(same){
  const w=G.opened, r=rival();
  const mine=G.lock[station+'|'+w];
  const leans=G.lean[station+'|'+w]||{};
  const myLean=leans[norm(name)];
  if(!same){
    leanPrice=myLean?myLean.price:'';leanWhy=myLean?myLean.why:'';
    app.innerHTML=weekHead(w)+junctionSVG(station[0])+
      (G.shock&&w>=5?bulletinHTML():'')+
      '<div class="lbl">Post your sign</div>'+
      '<input class="reason" id="why" maxlength="60" autocomplete="off" placeholder="A few words for your team (optional)" value="'+esc(leanWhy)+'">'+
      '<div class="huddle"><div class="row">'+
      '<button type="button" class="signbtn" data-p="1.50"><div class="top">Hold</div><div class="pr"><small>£</small>1.50</div><div class="why">Your standard price. A good week if they hold too.</div></button>'+
      '<button type="button" class="signbtn" data-p="1.40"><div class="top">Cut</div><div class="pr"><small>£</small>1.40</div><div class="why">Take the road if they hold. Cheap fuel for everyone if they cut too.</div></button>'+
      '</div><div class="row"><div class="chips" id="chipsA"></div><div class="chips" id="chipsB"></div></div></div>'+
      '<button type="button" class="big" id="lockgo" disabled>Lock it in for the team</button>'+
      '<div class="lockline" id="lockline"></div>'+
      '<div class="lbl">Your ledger</div>'+ledgerHTML(w);
    startCars('flow');
    const why=document.getElementById('why');
    why.addEventListener('input',()=>{leanWhy=why.value;});
    why.addEventListener('change',()=>{if(leanPrice)postLean();});
    app.querySelectorAll('.signbtn').forEach(b=>b.addEventListener('click',()=>{
      leanPrice=b.dataset.p;postLean();paintWeek();
    }));
    document.getElementById('lockgo').addEventListener('click',()=>{
      const p=leanPrice;if(!p)return;
      const go=document.getElementById('lockgo');go.disabled=true;
      say(ROOM.prices,station+'|'+w+'|'+p,'w'+w).then(()=>say(ROOM.huddle,station+'|'+w+'|lock|'+name,'l'+w)).then(()=>{
        G.lock[station+'|'+w]=p;G.locker[station+'|'+w]=name;st.textContent='';paintWeek();
      }).catch(c=>{go.disabled=false;st.textContent=failMsg(c);});
    });
  }
  paintWeek();
  function postLean(){
    const line=station+'|'+w+'|'+leanPrice+'|'+name+'|'+clean(leanWhy||'').slice(0,60);
    const k=station+'|'+w;G.lean[k]=G.lean[k]||{};G.lean[k][norm(name)]={name,price:leanPrice,why:clean(leanWhy||'').slice(0,60)};
    say(ROOM.huddle,line,'h'+w).catch(c=>{st.textContent=failMsg(c);});
  }
}
function paintWeek(){
  const w=G.opened, mine=G.lock[station+'|'+w], leans=G.lean[station+'|'+w]||{};
  app.querySelectorAll('.signbtn').forEach(b=>{
    b.classList.toggle('lean',!mine&&b.dataset.p===leanPrice);
    b.classList.toggle('locked',!!mine&&b.dataset.p===mine);
  });
  const chips=p=>Object.values(leans).filter(l=>l.price===p).map(l=>'<div class="chip'+(norm(l.name)===norm(name)?' me':'')+'"><b>'+esc(l.name)+'</b>'+(l.why?'<span class="r">'+esc(l.why)+'</span>':'')+'</div>').join('');
  const ca=document.getElementById('chipsA'), cb=document.getElementById('chipsB');
  if(ca)ca.innerHTML=chips('1.50');if(cb)cb.innerHTML=chips('1.40');
  const go=document.getElementById('lockgo'), ll=document.getElementById('lockline');
  if(go){
    if(mine){go.textContent='Change it to £'+(mine==='1.50'?'1.40':'1.50');go.classList.add('quiet');go.disabled=false;
      go.onclick=()=>{leanPrice=mine==='1.50'?'1.40':'1.50';go.disabled=true;
        say(ROOM.prices,station+'|'+w+'|'+leanPrice,'w'+w).then(()=>say(ROOM.huddle,station+'|'+w+'|lock|'+name,'l'+w)).then(()=>{G.lock[station+'|'+w]=leanPrice;G.locker[station+'|'+w]=name;paintWeek();}).catch(c=>{go.disabled=false;st.textContent=failMsg(c);});};
    }
    else{go.textContent=leanPrice?'Lock £'+leanPrice+' in for the team':'Lock it in for the team';go.classList.remove('quiet');go.disabled=!leanPrice;go.onclick=null;}
  }
  if(ll){
    ll.innerHTML=mine?('<span class="pulse"></span>Your sign says <b>£'+mine+'</b>'+(G.locker[station+'|'+w]?', locked by <b>'+esc(G.locker[station+'|'+w])+'</b>':'')+'. Waiting for Monday morning. You can still change it until the signs go up.')
      :'Nobody on '+LBL[station[0]]+' '+station[1]+' has locked a price yet.';
  }
  setSigns(station[0]==='a'?(mine||leanPrice):'',station[0]==='b'?(mine||leanPrice):'');
  const lg=document.getElementById('ledger');if(lg)lg.outerHTML=ledgerHTML(w);
}
function ledgerHTML(cur){
  const L=ledger();
  let h='<table class="ledger" id="ledger"><thead><tr><th>Week</th><th>You</th><th>Them</th><th>This week</th><th>Running</th></tr></thead><tbody>';
  L.rows.forEach(x=>{
    const s=G.shock&&x.w>=5;
    h+='<tr'+(x.w===cur?' class="cur"':'')+'><td class="w">'+x.w+(s?'<em class="s">!</em>':(isDouble(x.w)?'<em>×2</em>':''))+'</td>'+
      '<td class="you '+(x.mine?'p'+x.mine.replace('.',''):'blank')+'">'+(x.mine?'£'+x.mine:'–')+'</td>'+
      '<td class="them '+(x.theirs?'p'+x.theirs.replace('.',''):'blank')+'">'+(x.theirs?'£'+x.theirs:'–')+'</td>'+
      '<td class="'+(x.p===null?'blank':'')+'">'+(x.p===null?'–':'£'+x.p+'k')+'</td>'+
      '<td class="'+(x.run===null?'blank':'')+'">'+(x.run===null?'–':'£'+x.run+'k')+'</td></tr>';
  });
  h+='<tr class="tot"><td colspan="4">Total so far</td><td>£'+L.total+'k</td></tr></tbody></table>';
  return h;
}

/* ---------- the reveal, and the wait between weeks ---------- */
function verdict(mine,theirs,w){
  const s=G.shock&&w>=5;
  if(mine==='1.50'&&theirs==='1.50')return 'You both held. A good week.';
  if(mine==='1.40'&&theirs==='1.40')return 'You both cut. Cheap fuel for the district, and nothing gained from each other.';
  if(mine==='1.40')return s?'They held and the app sent every car to you.':'They held. You took the road.';
  return s?'They cut and the app sent every car to them.':'They cut and you held. Only the regulars came in.';
}
function renderBetween(same){
  const w=G.revealed, r=rival();
  const mine=G.lock[station+'|'+w], theirs=r?G.lock[r+'|'+w]:'';
  if(same)return;
  const p=(mine&&theirs)?profit(mine,theirs,w):null;
  const L=ledger();
  app.innerHTML=weekHead(w)+junctionSVG(station[0])+
    (p===null?'<div class="card soft"><p>No sign went up for one of the two stations this week, so nothing was earned. The board at the front has the detail.</p></div>':
    '<div class="result"><div class="amt '+(p>=12?(p>12?'good':''):'bad')+'"><small>£</small><span id="amt">0</span><small>k</small></div><div class="verdict">'+verdict(mine,theirs,w)+'</div>'+
    '<div class="run">Six-week total so far <b>£'+L.total+'k</b></div></div>')+
    '<div class="waitcard"><span class="pulse"></span>'+(w<WEEKS?'Waiting for week '+(w+1)+' to open.':'That was the last week.')+'</div>'+
    '<div class="lbl">Your ledger</div>'+ledgerHTML(0);
  setSigns(station[0]==='a'?mine:theirs,station[0]==='b'?mine:theirs);
  if(p!==null){
    startCars('split',station[0]==='a'?mine:theirs,station[0]==='b'?mine:theirs);
    const el=document.getElementById('amt');const t0=performance.now();
    const step=now=>{const u=Math.min(1,(now-t0)/900);el.textContent=Math.round(p*(1-Math.pow(1-u,3)));if(u<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  }else startCars('flow');
}

/* ---------- the meetings ---------- */
function renderAsking(same){
  const w=G.meetOpen, mine=G.ask[station+'|'+w];
  if(!same){
    app.innerHTML='<div class="wkhead"><span class="wk">BEFORE WEEK '+w+'</span><span class="mine '+station[0]+'">'+LBL[station[0]]+' '+station[1]+'</span></div>'+
      (G.shock&&w>=5?bulletinHTML():'')+
      '<div class="card meet"><h3>A meeting with the other station?</h3><p>Two minutes, one person from each side, and only if both stations ask. Nothing said in it binds anyone. Whoever you send is the only one who will ever know which station is yours.</p></div>'+
      '<div class="meet"><div class="two"><button type="button" class="big" id="askY">Ask to meet</button><button type="button" class="big quiet" id="askN">No meeting</button></div></div>'+
      '<div class="lockline" id="askline"></div>';
    const send=y=>{const b=document.getElementById(y?'askY':'askN');b.disabled=true;
      say(ROOM.meet,station+'|'+w+'|ask|'+(y?'y':'n'),'m'+w).then(()=>{G.ask[station+'|'+w]=y;paintAsk();}).catch(c=>{b.disabled=false;st.textContent=failMsg(c);});};
    document.getElementById('askY').addEventListener('click',()=>send(true));
    document.getElementById('askN').addEventListener('click',()=>send(false));
  }
  paintAsk();
  function paintAsk(){
    const m=G.ask[station+'|'+w];
    const y=document.getElementById('askY'), n=document.getElementById('askN'), l=document.getElementById('askline');
    if(y){y.classList.toggle('quiet',m===false);y.disabled=false;}
    if(n){n.classList.toggle('quiet',m!==false);n.disabled=false;}
    if(l)l.innerHTML=m===undefined?'Your station hasn’t answered yet. Any of you can.':(m?'<b>You asked to meet.</b> If they asked too, you will be told where.':'<b>No meeting from your side.</b> You can change your mind until the reps are sent.');
  }
}
function renderMeeting(same){
  const w=G.meetOpen, r=rival();
  const on=!!(G.ask[station+'|'+w]&&r&&G.ask[r+'|'+w]);
  const idx=Object.keys(G.pair).filter(k=>k[0]==='a').sort().indexOf(station[0]==='a'?station:r);
  const spot=SPOTS[Math.max(0,idx)%SPOTS.length];
  const agreed=G.agreed[station+'|'+w];
  if(!same){
    app.innerHTML='<div class="wkhead"><span class="wk">BEFORE WEEK '+w+'</span><span class="mine '+station[0]+'">'+LBL[station[0]]+' '+station[1]+'</span></div>'+
      (on?'<div class="spot"><div class="sub">Meeting on. Send one person to</div><div class="where">'+esc(spot)+'</div><div class="sub">Two minutes</div></div>'+
          '<div class="card soft"><h3>Back from the meeting?</h3><p>What did the two of you agree? Only you and the debrief will see this. The other station writes its own version.</p></div>'+
          '<input class="reason" id="agreed" maxlength="120" autocomplete="off" placeholder="What was agreed, in a few words" value="'+esc(agreed?agreed.text:'')+'">'+
          '<button type="button" class="big" id="agreedgo">Send</button><div class="lockline" id="agreedline"></div>'
        :'<div class="card"><h3>No meeting this time.</h3><p>Week '+w+' opens when Ryan says so.</p></div>')+
      '<div class="waitcard"><span class="pulse"></span>Waiting for week '+w+' to open.</div>';
    const go=document.getElementById('agreedgo');
    if(go)go.addEventListener('click',()=>{
      const t=clean(document.getElementById('agreed').value).slice(0,120);if(!t)return;go.disabled=true;
      say(ROOM.meet,station+'|'+w+'|agreed|'+name+'|'+t,'g'+w).then(()=>{G.agreed[station+'|'+w]={name,text:t};go.disabled=false;paintAgreed();}).catch(c=>{go.disabled=false;st.textContent=failMsg(c);});
    });
  }
  paintAgreed();
  function paintAgreed(){const l=document.getElementById('agreedline');const a=G.agreed[station+'|'+w];
    if(l)l.innerHTML=a?'Noted from <b>'+esc(a.name)+'</b>: “'+esc(a.text)+'”. Send again to replace it.':'';}
}

/* ---------- game over ---------- */
function renderOver(same){
  if(same)return;
  const L=ledger();
  app.innerHTML='<div class="wkhead"><span class="wk">SIX WEEKS</span><span class="mine '+station[0]+'">'+LBL[station[0]]+' '+station[1]+'</span></div>'+
    '<div class="result"><div class="run">Your six weeks</div><div class="amt"><small>£</small>'+L.total+'<small>k</small></div><div class="verdict">The board at the front takes it from here.</div></div>'+
    '<div class="lbl">Your ledger</div>'+ledgerHTML(0)+
    '<div class="foot">Price Wars · Module 4</div>';
}

/* ---------- polling ---------- */
function tick(){
  if(!station){render();return;}
  Promise.all([answers(ROOM.prices),answers(ROOM.huddle),answers(ROOM.meet)]).then(([p,h,m])=>{
    parse(p,h,m);render();
  }).catch(()=>{});
}
setInterval(tick,2500);
render();tick();

/* ---------- the theme ---------- */
(function(){
  const btn=document.getElementById('theme'), a=document.getElementById('themeAudio');
  btn.addEventListener('click',()=>{
    if(!a.paused){a.pause();a.currentTime=0;btn.classList.remove('playing');btn.textContent='Theme';return;}
    a.volume=0.55;a.onended=()=>{btn.classList.remove('playing');btn.textContent='Theme';};
    const p=a.play();if(p&&p.then)p.then(()=>{btn.classList.add('playing');btn.textContent='Stop';}).catch(()=>{});
  });
})();

/* ---------- demo: the deck's moves, driven from a bar at the foot ----------
   ?demo=1 keeps everything on this phone. The rival team is Buco's 3 (or
   Aura 3), two invented teammates lean and sometimes lock before you do,
   the rival holds early and cuts late, and every press of the bar is one
   move the deck would make. */
const demoRoom={};
function demoAnswers(room){return (demoRoom[room]||[]).slice();}
function demoSay(room,line){(demoRoom[room]=demoRoom[room]||[]).push(line);}
if(DEMO){
  document.body.classList.add('demo-on');
  const bar=document.createElement('div');bar.className='demo';
  bar.innerHTML='<span><b>DEMO</b> <span class="dl" id="dl">no network, the deck’s next move is on the right</span></span><button type="button" id="dnext">Start the game</button>';
  document.body.appendChild(bar);
  const mates=['Priya K','Tom W'];
  let step=0;
  const rv=()=>G.pair[station]||(station[0]==='a'?'b3':'a3');
  const plan=()=>{
    const s=[];
    s.push({l:'Start the game',f:()=>{const me=station||'a1';const r=me[0]==='a'?'b3':'a3';const a=me[0]==='a'?me:r,b=me[0]==='a'?r:me;
      demoSay(ROOM.prices,'::pair|'+a+'='+b+',a2=b1,a4=b2');demoSay(ROOM.prices,'::open|1');}});
    for(let w=1;w<=6;w++){
      const mw=G.shock?[3,5]:[3,6];
      if(mw.includes(w)&&w>1){
        s.push({l:'Offer a meeting before week '+w,f:()=>{demoSay(ROOM.prices,'::meet|'+w);setTimeout(()=>{demoSay(ROOM.meet,rv()+'|'+w+'|ask|'+(Math.random()<.8?'y':'n'));},1500);}});
        s.push({l:'Send the reps',f:()=>{demoSay(ROOM.prices,'::reps|'+w);}});
        s.push({l:'Open week '+w,f:()=>{demoSay(ROOM.prices,'::open|'+w);}});
      }
      else if(w>1)s.push({l:'Open week '+w,f:()=>{demoSay(ROOM.prices,'::open|'+w);}});
      s.push({l:'Signs up, week '+w,f:()=>{
        const r=rv();const rp=w>=5?'1.40':(w===3?(Math.random()<.5?'1.40':'1.50'):'1.50');
        demoSay(ROOM.prices,r+'|'+w+'|'+rp);
        if(!G.lock[station+'|'+w]){demoSay(ROOM.prices,station+'|'+w+'|1.50');demoSay(ROOM.huddle,station+'|'+w+'|lock|'+mates[0]);}
        demoSay(ROOM.prices,'::reveal|'+w);}});
      if(w===4)s.push({l:'Stop the presses (Gazette)',f:()=>{demoSay(ROOM.prices,'::shock|on');}});
    }
    return s;
  };
  const btn=document.getElementById('dnext'), dl=document.getElementById('dl');
  btn.addEventListener('click',()=>{
    const s=plan();if(step>=s.length){btn.disabled=true;return;}
    s[step].f();step++;
    tick();
    const n=plan()[step];btn.textContent=n?n.l:'Done';dl.textContent=s[step-1].l;
  });
  /* teammates lean a moment after a week opens */
  setInterval(()=>{
    const w=G.opened;if(!station||!w||G.revealed>=w)return;
    const k=station+'|'+w;const have=G.lean[k]||{};
    mates.forEach((m,i)=>{if(!have[norm(m)]&&Math.random()<.35){
      const p=w>=5?'1.40':(Math.random()<.7?'1.50':'1.40');
      const why=p==='1.50'?['keep it civil','they held last week','double week, don’t rock it'][i%3]:['they’ll cut anyway','last chance to take the road','app week, go'][i%3];
      demoSay(ROOM.huddle,k+'|'+p+'|'+m+'|'+why);}});
  },2200);
}
</script>
