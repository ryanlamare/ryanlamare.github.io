<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Module 4 · Price Wars</title>
<link rel="stylesheet" href="/brand.css">
<style>
/* Participant page for the Module 4 price war (the capstone of day one).
   Teams of three run one petrol station each, Aura or Buco's, and post a
   price every week without seeing the other station's sign. Nobody knows
   which station they are playing against: the deck pairs the teams at
   random when the game starts and the only people who ever learn are the
   reps who meet. The phone teaches HOW to play (a guided practice week,
   four trials, one per cell of the game) and the rules of the six weeks
   are told to the room from the deck. No payoff matrix is shown during
   play; the deck puts it up afterwards.

   A hundred cars pass the junction each week and each one is worth £300
   at £1.50 or £200 at £1.40: forty each when both hold, ninety to the
   cutter and seven to the holder, forty-five each when both cut, and the
   rest drive past. Those are the real numbers behind the payoffs, so the
   cars the room watches pull in are the money.

   Locking (Ryan's rule, 16 Sep): everyone on the team locks a price by
   pressing and holding, and the sign goes up only when all of them have
   locked the same one. A team that has not agreed when the signs go up
   stays at £1.50, the standard price, so a holdout has real weight and a
   dead phone can never stall the room.

   Wire (four gt-poll rooms; ?room=<x> suffixes all of them for a
   rehearsal, ?demo=1 runs the whole thing locally with no network):
     m4-teams   "a1|Name"                        one line per phone, who is on which station
     m4-prices  "a1|w|1.40"                      the TEAM's sign for week w (posted by a phone once all locked)
                "::pair|a1=b3,a2=b5"             the deck's random pairing (the game has started)
                "::open|w"  "::reveal|w"         the deck opens a week, then puts the signs up
                "::meet|w"  "::reps|w"           the deck offers a meeting before week w, then closes the asking
                "::shock|on"                     the Gazette rules for weeks 5 and 6 (read by the points system too)
     m4-huddle  "a1|w|lean|Name|price|why"       a teammate's leaning, seen only by that team
                "a1|w|lock|Name|price"           a teammate's lock (latest per name wins until the sign is up)
                "a1|0|drop|Name"                 the facilitator drops a name from a team (a dead phone)
     m4-meet    "a1|w|ask|y"                     the team asked (or not) for the meeting before week w
                "a1|w|agreed|Name|text"          the rep's private note of what was agreed, for the debrief
   A week is revealed on this phone only once the deck says so, never
   from the other station's sign arriving. */
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:22px 18px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tag{font-weight:500;text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag>span{white-space:nowrap}
.tag i{display:inline-block;width:10px;height:10px;background:var(--red);margin-right:10px;vertical-align:middle}
h1{font-family:var(--display);font-weight:900;font-size:40px;line-height:.95;color:var(--red);letter-spacing:.01em}
h2{font-weight:700;font-size:21px;line-height:1.25}
p{font-size:16px;line-height:1.5}
p b{font-weight:700}
.lbl{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted)}
.status{font-weight:600;font-size:15px;color:var(--muted);min-height:1.4em}
.status b{color:var(--red)}
.tbtn{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:none;border:1.5px solid var(--muted);color:var(--muted);padding:5px 9px;cursor:pointer}
.tbtn.playing{border-color:var(--red);color:var(--red)}
.card{border:2.5px solid var(--ink);background:var(--card);padding:16px 18px}
.card.soft{border-style:dashed;border-color:var(--muted);background:none}
.card h3{font-weight:700;font-size:16px;margin-bottom:6px}
.card p{font-size:15px}
.card p+p{margin-top:8px}
button.big{display:block;width:100%;font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--paper);background:var(--red);border:2.5px solid var(--red);padding:16px 18px;cursor:pointer}
button.big:disabled{opacity:.4;cursor:default}
button.big.quiet{background:var(--card);color:var(--ink);border-color:var(--ink)}
.namerow{display:flex;gap:10px}
.namerow input{flex:1;font-family:var(--sans);font-weight:600;font-size:17px;color:var(--ink);
  background:var(--card);border:2.5px solid var(--ink);padding:14px 16px;min-width:0}
.namerow button{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:.08em;
  background:var(--red);border:2.5px solid var(--red);color:var(--paper);padding:14px 20px;cursor:pointer}
.me{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.me .who{font-weight:700;font-size:15px}
.me .who b{color:var(--red)}
.me .who b.a{color:var(--teal)} .me .who b.b{color:var(--terracotta)}
.me button{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  background:none;border:none;color:var(--muted);cursor:pointer;text-decoration:underline}
.waitcard{border:2.5px dashed var(--muted);padding:18px;font-weight:600;font-size:15px;color:var(--muted)}
.pulse{display:inline-block;width:10px;height:10px;background:var(--red);border-radius:50%;
  margin-right:9px;vertical-align:middle;animation:pu 1.2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.25}50%{opacity:1}}
.back{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:none;border:none;color:var(--muted);cursor:pointer;text-decoration:underline;align-self:flex-start;font-family:var(--sans)}

/* the station picker */
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stgrid .col{display:flex;flex-direction:column;gap:8px}
.stgrid .colh{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:12px;padding-bottom:2px;min-height:38px;display:flex;align-items:flex-end}
.stgrid .col.a .colh{color:var(--teal)} .stgrid .col.b .colh{color:var(--terracotta)}
.stgrid button{font-family:var(--sans);font-weight:700;font-size:16px;color:var(--ink);background:var(--card);
  border:2.5px solid var(--ink);padding:13px 10px;cursor:pointer}
.stgrid .col.a button{border-color:var(--teal)} .stgrid .col.b button{border-color:var(--terracotta)}

/* how it's played */
.tdots{display:flex;gap:6px}
.tdots i{width:22px;height:6px;background:var(--rule)}
.tdots i.on{background:var(--red)}
.tcard h3{font-weight:700;font-size:20px;line-height:1.2;color:var(--red)}
.tcard p{font-size:15.5px;line-height:1.45;margin-top:5px}
.goal{background:var(--blue);color:var(--paper);padding:18px;text-align:center;font-weight:700;font-size:19px;line-height:1.3}
.goal small{display:block;font-weight:500;font-size:13.5px;line-height:1.4;margin-top:10px;color:color-mix(in srgb,var(--paper) 80%,transparent)}

/* the junction */
.junction{border:2.5px solid var(--ink);background:var(--tan-light);overflow:hidden}
.junction svg{display:block;width:100%;height:auto}
.signg{transform-box:fill-box;transform-origin:center}
.signg.flip{animation:flip .52s ease-in-out}
@keyframes flip{0%{transform:scaleY(1)}50%{transform:scaleY(.04)}100%{transform:scaleY(1)}}
.fc.dim{opacity:.32}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wkhead .wk{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;color:var(--red)}
.wkhead .dbl{font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ochre);border:2px solid var(--ochre);padding:4px 8px}
.wkhead .shk{color:var(--red);border-color:var(--red)}
.wkhead .mine{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.wkhead .mine.a{color:var(--teal)} .wkhead .mine.b{color:var(--terracotta)}

/* the two prices: tap to lean, press and hold to lock */
.signs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.signbtn{position:relative;font-family:var(--sans);text-align:left;background:var(--paper-soft);border:2.5px solid var(--ink);padding:0;cursor:pointer;color:var(--ink);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:opacity .35s}
.signbtn .pr{position:relative;z-index:1;font-family:var(--display);font-weight:900;font-size:46px;line-height:1;padding:18px 10px 16px;text-align:center}
.signbtn .pr small{font-size:22px;vertical-align:top;margin-right:1px}
.signbtn .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--ink);transition:height .25s ease-out}
.signbtn.a .fill{background:var(--teal)} .signbtn.b .fill{background:var(--terracotta)}
.signbtn.holding .fill{height:100%;transition:height 1s linear}
.signbtn.lean{border-color:var(--red);border-width:3.5px}
.signbtn.locked{color:var(--paper)}
.signbtn.locked.a{background:var(--teal);border-color:var(--teal)} .signbtn.locked.b{background:var(--terracotta);border-color:var(--terracotta)}
.signbtn.locked .fill{display:none}
.signbtn.mute{opacity:.3}
.signbtn:disabled{cursor:default}
.hint{font-weight:600;font-size:13px;color:var(--muted);text-align:center;letter-spacing:.02em}
.tlines{display:flex;flex-direction:column;gap:5px}
.tl{font-size:15px;line-height:1.35;padding:6px 10px;background:var(--card);border-left:4px solid var(--rule)}
.tl.lean{border-left-color:var(--ochre)} .tl.prop{border-left-color:var(--green)} .tl.none{color:var(--muted)}
.committed{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--paper);animation:cin .35s ease-out;cursor:pointer}
.committed.a{background:var(--teal)} .committed.b{background:var(--terracotta)}
.committed.off{opacity:0;transition:opacity .4s}
.committed .ck{font-weight:700;font-size:16px;letter-spacing:.3em;text-transform:uppercase}
.committed .cp{font-family:var(--display);font-weight:900;font-size:96px;line-height:1}
.committed .cp small{font-size:44px;vertical-align:top}
.committed .cs{font-weight:600;font-size:15px;color:color-mix(in srgb,var(--paper) 80%,transparent)}
@keyframes cin{from{transform:scale(1.15);opacity:0}to{transform:scale(1);opacity:1}}
.chips2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-direction:column;gap:5px;min-height:6px}
.chip{font-size:13px;line-height:1.3;background:var(--card);border-left:4px solid var(--rule);padding:5px 8px}
.chip b{font-weight:700}
.chip.lock{border-left-color:var(--green)}
.chip.lean{border-left-color:var(--ochre)}
.chip .r{display:block;color:var(--muted);font-weight:500}
.chip .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-left:5px}
.reason{width:100%;font-family:var(--sans);font-weight:600;font-size:15px;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);padding:12px 14px}
.reason::placeholder{color:var(--muted);font-weight:500}
.lockline{font-weight:600;font-size:14px;color:var(--muted)}
.lockline b{color:var(--ink)}
.lockline.up{color:var(--green)} .lockline.up b{color:var(--green)}

/* the result card and the ledger */
.result{border:2.5px solid var(--ink);background:var(--card);padding:16px;text-align:center}
.result .amt{font-family:var(--display);font-weight:900;font-size:54px;line-height:1;color:var(--blue)}
.result .amt.good{color:var(--green)} .result .amt.bad{color:var(--red)}
.result .amt small{font-size:26px;vertical-align:top}
.result .verdict{font-weight:700;font-size:16px;margin-top:8px}
.result .run{font-weight:600;font-size:13.5px;color:var(--muted);margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
.result .run b{color:var(--ink);font-size:15px}
.result .note{font-weight:600;font-size:14px;color:var(--muted);margin-top:8px}
.result.small{padding:12px}
.result.small .amt{font-size:44px}
.result.small .verdict{font-size:15px}
table.ledger{width:100%;border-collapse:collapse;font-size:14px}
table.ledger th{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:2px solid var(--ink)}
table.ledger td{padding:7px 6px;border-bottom:1.5px solid var(--rule);font-weight:600}
table.ledger td.w{font-weight:700}
table.ledger td.w em{font-style:normal;font-size:10px;color:var(--ochre);margin-left:4px;letter-spacing:.1em}
table.ledger td.w em.s{color:var(--red)}
table.ledger td.p150{color:var(--green)} table.ledger td.p140{color:var(--red)}
table.ledger td.def{color:var(--muted);font-style:italic}
table.ledger tr.cur td{background:color-mix(in srgb,var(--card) 70%,transparent)}
table.ledger tr.tot td{border-top:2.5px solid var(--ink);border-bottom:none;font-weight:700;font-size:15px}
table.ledger td.blank{color:var(--rule)}

/* the meeting */
.meet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spot{background:var(--ink);color:var(--paper);padding:16px;text-align:center}
.spot .where{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;color:var(--ochre);margin:4px 0}
.spot .sub{font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--paper) 70%,transparent)}
.bulletin{border:3px double var(--ink);background:var(--paper-soft);padding:14px 16px}
.bulletin .mast{font-family:var(--display);font-weight:900;font-size:22px;line-height:1;text-align:center;letter-spacing:.02em}
.bulletin .mast small{display:block;font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.bulletin h3{font-weight:700;font-size:17px;line-height:1.2;margin:10px 0 6px;color:var(--red)}
.bulletin p{font-size:14px;line-height:1.45}
.bulletin p+p{margin-top:6px}
.bulletin .notice{background:var(--ink);color:var(--paper);padding:10px 12px;margin-top:8px}
.bulletin .notice p{font-size:13.5px;font-weight:600;margin-bottom:5px}
.bulletin .notice p:last-child{margin-bottom:0}
.bulletin .ru{margin-top:10px;font-size:13.5px;color:var(--muted)}
.bulletin .ru b{color:var(--red)}
.foot{font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;text-align:center;margin-top:10px}

/* demo driver */
.demo{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);display:flex;gap:10px;align-items:center;padding:10px 14px;font-size:13px;font-weight:600;z-index:9}
.demo button{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--red);border:none;color:var(--paper);padding:9px 12px;cursor:pointer;margin-left:auto;white-space:nowrap}
.demo .dl{color:color-mix(in srgb,var(--paper) 70%,transparent)}
body.demo-on{padding-bottom:90px}
</style>
</head><body>
<div class="wrap">
  <div class="tag"><span><i></i>APPLIED GAME THEORY · MODULE 4</span><button class="tbtn" id="theme" type="button" aria-label="Play the theme">Theme</button></div>
  <h1 id="q">PRICE WARS</h1>
  <div id="app"></div>
  <div class="status" id="status"></div>
</div>
<audio id="themeAudio" src="showdown.mp3" preload="none"></audio>
<script src="/go/names.js"></script>
<script>
const qs=new URLSearchParams(location.search);
const API=qs.get('api')||'https://gt-poll.rlamare.workers.dev';
const DEMO=qs.get('demo')==='1';
const SUF=qs.get('room')?('-'+qs.get('room').replace(/[^a-z0-9-]/g,'')):'';
const ROOM={teams:'m4-teams'+SUF,prices:'m4-prices'+SUF,huddle:'m4-huddle'+SUF,meet:'m4-meet'+SUF};
const WEEKS=6, N=5, HOLD_MS=1000;
const LBL={a:'Aura',b:'Buco’s'};
const FULL={a:'Aura Fuels',b:'Buco’s Service Station'};
const SPOTS=['the door','the window','the back of the room','the front of the room','the corridor'];
const SK='pw'+SUF+'-';   /* localStorage keys, per room */
const CARCOL=['var(--maroon)','var(--blue)','var(--green)','var(--ochre)','var(--sienna)','var(--grey)','var(--ink)','var(--red)'];

/* ---------- identity ---------- */
let voter=null;
try{
  voter=localStorage.getItem('gt-voter');
  if(!voter){voter=([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
    localStorage.setItem('gt-voter',voter);}
}catch(_){voter='v'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);}
let name=null, station='';
try{name=localStorage.getItem('gt-name');station=localStorage.getItem(SK+'station')||'';}catch(_){}
if(DEMO&&!name)name='You';
const app=document.getElementById('app'), st=document.getElementById('status');
const clean=n=>n.trim().replace(/[|]/g,' ').replace(/\s+/g,' ').slice(0,30);
const norm=n=>String(n).trim().toLowerCase().replace(/\s+/g,' ');
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function claimOnce(){
  if(DEMO)return;
  let done=false;
  try{done=localStorage.getItem('gt-claimed')===name;}catch(_){}
  if(done||!name)return;
  fetch(API+'/p/gt-names/say',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t:name,v:voter})})
  .then(r=>{if(r.ok){try{localStorage.setItem('gt-claimed',name);}catch(_){}}}).catch(()=>{});
}
if(name)claimOnce();

/* ---------- the wire ---------- */
const sayN={};
function say(room,line,tag){
  /* fifteen lines per voter per room is the Worker's cap; a tag (the week)
     gives each week its own allowance, so a team that changes its mind is
     never locked out */
  if(DEMO){demoSay(room,line);return Promise.resolve();}
  const k=room+(tag||'');sayN[k]=(sayN[k]||0)+1;
  const v=voter+(tag?'-'+tag:'')+'-'+(sayN[k]%9);
  return fetch(API+'/p/'+room+'/say',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({t:line,v})}).then(r=>{if(!r.ok)throw r.status;});
}
const answers=room=>DEMO?Promise.resolve(demoAnswers(room)):fetch(API+'/p/'+room+'/answers').then(r=>r.json()).then(d=>d.answers||[]);
const failMsg=code=>code===429?'That’s plenty from one phone. Flag the instructor.':'That didn’t send. Try again.';

/* the game as the wire describes it */
const G={pair:{},opened:0,revealed:0,myRev:0,shown:{},shock:false,meetOpen:0,repsSent:0,paper:0,sign:{},lean:{},lock:{},members:{},ask:{},agreed:{}};
function parse(teams,prices,huddle,meet){
  G.pair={};G.opened=0;G.revealed=0;G.shown={};G.shock=false;G.meetOpen=0;G.repsSent=0;G.paper=0;G.sign={};G.lean={};G.lock={};G.members={};G.ask={};G.agreed={};
  const claim={}, drop={};
  teams.forEach(t=>{
    const m=String(t).match(/^([ab][1-5])\s*\|\s*(.{1,40}?)$/i);
    if(m)claim[norm(m[2])]={name:m[2].trim(),st:m[1].toLowerCase()};
  });
  prices.forEach(t=>{
    const p=String(t).trim().toLowerCase().split('|').map(s=>s.trim());
    if(p[0]==='::pair'&&p[1]){p[1].split(',').forEach(x=>{const m=x.match(/^(a[1-5])=(b[1-5])$/);if(m){G.pair[m[1]]=m[2];G.pair[m[2]]=m[1];}});}
    else if(p[0]==='::open'&&/^[1-6]$/.test(p[1]))G.opened=Math.max(G.opened,+p[1]);
    else if(p[0]==='::reveal'&&/^[1-6]$/.test(p[1]))G.revealed=Math.max(G.revealed,+p[1]);
    else if(p[0]==='::shock')G.shock=p[1]==='on';
    else if(p[0]==='::meet'&&/^[1-6]$/.test(p[1]))G.meetOpen=Math.max(G.meetOpen,+p[1]);
    else if(p[0]==='::reps'&&/^[1-6]$/.test(p[1]))G.repsSent=Math.max(G.repsSent,+p[1]);
    else if(p[0]==='::paper'&&/^[1-6]$/.test(p[1]))G.paper=Math.max(G.paper,+p[1]);
    else if(p[0]==='::shown'&&/^[1-6]$/.test(p[1])&&/^a[1-5]$/.test(p[2]))G.shown[p[1]+'|'+p[2]]=true;
    else if(/^[ab][1-5]$/.test(p[0])&&/^[1-6]$/.test(p[1])&&/^1\.[45]0$/.test(p[2]))G.sign[p[0]+'|'+p[1]]=p[2];
  });
  huddle.forEach(t=>{
    const p=String(t).split('|').map(s=>s.trim());
    const s=p[0].toLowerCase();
    if(!/^[ab][1-5]$/.test(s)||!/^[0-6]$/.test(p[1]))return;
    const k=s+'|'+p[1];
    if(p[2]==='drop'&&p[3])drop[s+'|'+norm(p[3])]=true;
    else if(p[2]==='lean'&&p[3]&&/^1\.[45]0$/.test(p[4])){G.lean[k]=G.lean[k]||{};G.lean[k][norm(p[3])]={name:p[3],price:p[4],why:p[5]||''};}
    else if(p[2]==='lock'&&p[3]&&/^1\.[45]0$/.test(p[4])){G.lock[k]=G.lock[k]||{};G.lock[k][norm(p[3])]={name:p[3],price:p[4]};}
  });
  Object.entries(claim).forEach(([n,c])=>{if(drop[c.st+'|'+n])return;(G.members[c.st]=G.members[c.st]||[]).push(c.name);});
  meet.forEach(t=>{
    const p=String(t).split('|').map(s=>s.trim());
    const s=p[0].toLowerCase();
    if(!/^[ab][1-5]$/.test(s)||!/^[1-6]$/.test(p[1]))return;
    if(p[2]==='ask')G.ask[s+'|'+p[1]]=p[3]==='y';
    else if(p[2]==='agreed'&&p[3]){G.agreed[s+'|'+p[1]]={name:p[3],text:p.slice(4).join(' | ')};}
  });
  /* my junction is revealed when the deck has shown it, or closed the week */
  const mine=station?(station[0]==='a'?station:G.pair[station]):'';
  G.myRev=G.revealed;
  for(let w=G.revealed+1;w<=WEEKS;w++){if(mine&&G.shown[w+'|'+mine])G.myRev=w;else break;}
}
function profit(mine,theirs,week){
  if(G.shock&&week>=5){
    if(mine==='1.40'&&theirs==='1.50')return 72;
    if(mine==='1.50'&&theirs==='1.40')return 2;
    return mine==='1.50'?12:9;
  }
  const dbl=(week===3||week===6)?2:1;
  if(mine==='1.50')return (theirs==='1.50'?12:2)*dbl;
  return (theirs==='1.50'?18:9)*dbl;
}
/* how the hundred cars split between the two forecourts */
function carSplit(pa,pb,week){
  const shock=G.shock&&week>=5;
  if(pa===pb)return pa==='1.50'?[40,40]:[45,45];
  const cut=shock?93:90;
  return pa==='1.40'?[cut,7]:[7,cut];
}
const rival=()=>G.pair[station]||'';
const isDouble=w=>!G.shock||w<5?(w===3||w===6):false;
function myMembers(){
  const m=(G.members[station]||[]).slice();
  if(name&&!m.some(x=>norm(x)===norm(name)))m.push(name);
  return m;
}
/* the team's agreed price for week w: every member's latest lock, all the same */
function agreed(stn,w){
  const locks=G.lock[stn+'|'+w]||{};
  const mem=stn===station?myMembers():(G.members[stn]||[]);
  if(!mem.length)return '';
  let p='';
  for(const n of mem){const l=locks[norm(n)];if(!l)return '';if(p&&l.price!==p)return '';p=l.price;}
  return p;
}
/* the sign that went up: the team's posted sign, or £1.50 by default once the week is revealed */
function signUp(stn,w){
  const s=G.sign[stn+'|'+w];
  if(s)return {price:s,def:false};
  if(w<=G.myRev)return {price:'1.50',def:true};
  return null;
}
function ledger(){
  const r=rival();let run=0;const rows=[];
  for(let w=1;w<=WEEKS;w++){
    const mine=w<=G.myRev?signUp(station,w):null, theirs=(w<=G.myRev&&r)?signUp(r,w):null;
    const p=(mine&&theirs)?profit(mine.price,theirs.price,w):null;
    if(p!==null)run+=p;
    rows.push({w,mine,theirs,p,run:p===null?null:run});
  }
  return {rows,total:run};
}

/* ---------- phases ---------- */
function phase(){
  if(!name)return 'name';
  if(!station)return 'station';
  if(!G.pair[station])return 'brief';
  const next=G.myRev+1;
  if(G.myRev>=WEEKS)return 'over';
  if(G.opened<next){
    if(G.meetOpen===next)return G.repsSent===next?'meeting':'asking';
    return G.myRev===0?'brief':'between';
  }
  return G.myRev<G.opened?'week':'between';
}
let lastKey='';
function render(force){
  const ph=phase();
  const key=ph+'|'+G.opened+'|'+G.myRev+'|'+G.shock+'|'+G.meetOpen+'|'+G.repsSent+'|'+(G.pair[station]||'')+'|'+station;
  const same=key===lastKey&&!force;
  lastKey=key;
  if(!same){app.replaceChildren();stopCars();}
  ({name:renderName,station:renderStation,brief:renderBrief,week:renderWeek,between:renderBetween,asking:renderAsking,meeting:renderMeeting,over:renderOver})[ph](same);
}

/* ---------- press and hold ----------
   A short tap fires onTap (a leaning), a press held for a second fires
   onHold (a lock). The red bar along the foot of the button fills while
   it is held, so the gesture explains itself. */
function holdable(btn,onTap,onHold){
  let t=null, t0=0, fired=false;
  const cancel=()=>{if(t){clearTimeout(t);t=null;}btn.classList.remove('holding');};
  btn.addEventListener('pointerdown',e=>{
    if(btn.disabled)return;
    e.preventDefault();try{btn.setPointerCapture(e.pointerId);}catch(_){}
    fired=false;t0=performance.now();btn.classList.add('holding');
    t=setTimeout(()=>{fired=true;cancel();onHold&&onHold();},HOLD_MS);
  });
  const up=()=>{if(!t&&!btn.classList.contains('holding'))return;const short=performance.now()-t0<350;cancel();if(!fired&&short&&onTap)onTap();};
  btn.addEventListener('pointerup',up);
  btn.addEventListener('pointercancel',cancel);
  btn.addEventListener('pointerleave',cancel);
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}
function signButtons(me,opts){
  /* opts: {hint, only} */
  const b=p=>'<button type="button" class="signbtn '+me+'" data-p="'+p+'"'+(opts.only&&opts.only!==p?' disabled':'')+'>'+
    '<div class="fill"></div><div class="pr"><small>£</small>'+p+'</div></button>';
  return '<div class="signs">'+b('1.50')+b('1.40')+'</div>'+(opts.hint?'<div class="hint">'+opts.hint+'</div>':'');
}

/* ---------- how it's played: a guided practice week ----------
   Four trials, one per cell of the game, with two invented teammates so
   the team mechanic is learned too: tap to lean, hold to propose, the
   sign goes up only when all three propose the same price (PRICE
   COMMITTED fills the screen), and in the second trial a teammate
   proposes the other price first so a disagreement is felt. */
const tut={step:0,first:'',timers:[],lean:{},prop:{},committed:''};
const MATES=['Priya K','Tom W'];
function tutDone(){try{return localStorage.getItem(SK+'tut')==='1';}catch(_){return false;}}
function tutReset(){tut.timers.forEach(clearTimeout);tut.timers=[];tut.lean={};tut.prop={};tut.committed='';}

function tutCard(){
  tutReset();
  const me=station[0], them=me==='a'?'b':'a';
  const dots='<div class="tdots">'+[0,1,2,3,4].map(i=>'<i class="'+(i<=Math.min(tut.step,4)?'on':'')+'"></i>').join('')+'</div>';
  const card=(h,p)=>'<div class="tcard"><h3>'+h+'</h3>'+(p?'<p id="tcp">'+p+'</p>':'')+'</div>';
  const setBoth=(pm,pt)=>setSigns(me==='a'?pm:pt,me==='a'?pt:pm);
  app.innerHTML=meLine()+'<div class="lbl">How it\u2019s played</div>'+dots+junctionSVG(me)+'<div id="tbody"></div>';
  wireMe();
  const body=document.getElementById('tbody');
  const dim=on=>{const f=app.querySelector('.fc.'+them);if(f)f.classList.toggle('dim',on);};
  const other=p=>p==='1.50'?'1.40':'1.50';
  const members=[name].concat(MATES);
  /* one trial: the player leans and proposes (only `only` if set), the mates follow
     by the script, the other station posts `theirs` */
  const trial=(title,text,only,theirs,nextLabel,nextStep,script)=>{
    dim(false);setBoth('','');startCars('flow');
    body.innerHTML=card(title,text)+signButtons(me,{hint:'Tap to lean. Press and hold to propose.',only})+
      '<div id="tlines"></div><div class="lockline" id="tstat"></div><div id="tres"></div>';
    const paint=()=>{
      const mine=tut.prop[norm(name)];
      body.querySelectorAll('.signbtn').forEach(x=>{
        const p=x.dataset.p;
        x.classList.toggle('locked',tut.committed?p===tut.committed:(!!mine&&mine===p));
        x.classList.toggle('mute',tut.committed?p!==tut.committed:(!!mine&&mine!==p));
        x.classList.toggle('lean',!mine&&!tut.committed&&tut.lean[norm(name)]===p);
        if(tut.committed)x.disabled=true;
      });
      document.getElementById('tlines').innerHTML=teamLines(members,tut.lean,tut.prop,name);
      const st=document.getElementById('tstat');
      const props=members.filter(n=>tut.prop[norm(n)]);
      const prices=new Set(props.map(n=>tut.prop[norm(n)]));
      if(tut.committed)st.innerHTML='<b>Your sign is up: \u00a3'+tut.committed+'.</b>';
      else if(prices.size>1)st.innerHTML='<b>Your proposals don\u2019t agree.</b> Nothing goes on the sign until all three of you propose the same price. In the game you could switch by holding the other price; here, wait for him.';
      else if(props.length)st.innerHTML='<b>'+props.length+' of 3 proposed \u00a3'+[...prices][0]+'.</b> Waiting for '+members.filter(n=>!tut.prop[norm(n)]).map(n=>norm(n)===norm(name)?'you':esc(n)).join(' and ')+'.';
      else st.innerHTML='';
      setBoth(tut.committed||mine||tut.lean[norm(name)]||'','');
      if(!tut.committed&&props.length===3&&prices.size===1)commit([...prices][0]);
    };
    const commit=p=>{
      tut.committed=p;paint();committedOverlay(me,p);
      later(2900,()=>{flipSign(them,theirs);});
      later(3700,()=>{
        startCars('split',me==='a'?p:theirs,me==='a'?theirs:p,1);
        const pr=profit(p,theirs,1);
        document.getElementById('tres').innerHTML='<div class="result small"><div class="amt '+(pr>12?'good':(pr<12?'bad':''))+'"><small>\u00a3</small><span id="tamt">0</span><small>k</small></div><div class="verdict">'+verdict(p,theirs,1)+'</div></div>'+
          '<button type="button" class="big" id="tnext">'+nextLabel+'</button>';
        countUp('tamt',pr,6500);
        document.getElementById('tnext').addEventListener('click',()=>{tut.step=nextStep;tutCard();});
      });
    };
    body.querySelectorAll('.signbtn').forEach(b=>holdable(b,
      ()=>{if(tut.committed)return;const p=b.dataset.p;tut.lean[norm(name)]=p;paint();script.onLean&&script.onLean(p,paint);},
      ()=>{if(tut.committed)return;const p=b.dataset.p;if(!tut.first)tut.first=p;delete tut.lean[norm(name)];tut.prop[norm(name)]=p;paint();script.onPropose&&script.onPropose(p,paint);}));
    paint();
  };
  const mateLean=(i,p,paint,ms)=>later(ms,()=>{if(!tut.prop[norm(MATES[i])]){tut.lean[norm(MATES[i])]=p;paint();}});
  const matePropose=(i,p,paint,ms)=>later(ms,()=>{delete tut.lean[norm(MATES[i])];tut.prop[norm(MATES[i])]=p;paint();});
  if(tut.step===0){
    dim(true);setBoth('','');startCars('flow');
    body.innerHTML=card('This is your station','You sell the same fuel as '+LBL[them]+' across the road. About a hundred cars a week come down this road and read both signs before they choose. The price on your sign is the only difference between you.')+
      '<button type="button" class="big" id="tnext">Next</button>';
    document.getElementById('tnext').addEventListener('click',()=>{tut.step=1;tutCard();});
  }
  else if(tut.step===1)trial('Post a price','Every Monday you post a price without seeing theirs. Tap a price and your team sees you lean. Press and hold to propose it. When all three of you have proposed the same price, it goes on your sign.','','1.50','Now try the other price',2,
    {onLean:(p,paint)=>{mateLean(0,p,paint,900);mateLean(1,p,paint,1700);},
     onPropose:(p,paint)=>{matePropose(0,p,paint,1100);matePropose(1,p,paint,2100);}});
  else if(tut.step===2)trial('Now propose the other price','Same week, same hundred cars, and the other station holds at \u00a31.50 again. This time your team doesn\u2019t all agree straight away.',other(tut.first),'1.50','What if they cut?',3,
    {onLean:(p,paint)=>{mateLean(0,p,paint,800);mateLean(1,tut.first,paint,1400);},
     onPropose:(p,paint)=>{matePropose(0,p,paint,900);matePropose(1,tut.first,paint,1500);matePropose(1,p,paint,6500);}});
  else if(tut.step===3)trial('This time they cut','The other station is going to post \u00a31.40. Hold at \u00a31.50 and see what it costs you.','1.50','1.40','And if you both cut?',4,
    {onLean:(p,paint)=>{mateLean(0,p,paint,700);mateLean(1,p,paint,1200);},
     onPropose:(p,paint)=>{matePropose(0,p,paint,800);matePropose(1,p,paint,1500);}});
  else if(tut.step===4)trial('Both of you cut','Propose \u00a31.40 while they post \u00a31.40.','1.40','1.40','One more thing',5,
    {onLean:(p,paint)=>{mateLean(0,p,paint,700);mateLean(1,p,paint,1200);},
     onPropose:(p,paint)=>{matePropose(0,p,paint,800);matePropose(1,p,paint,1500);}});
  else{
    dim(false);setBoth('','');startCars('flow');
    body.innerHTML=goalHTML()+'<button type="button" class="big" id="tnext">I\u2019m ready</button>';
    document.getElementById('tnext').addEventListener('click',()=>{try{localStorage.setItem(SK+'tut','1');}catch(_){}render(true);});
  }
}

function startCars(mode,pa,pb,week){
  /* 'flow': cars drive past while the signs are blank. 'split': the
     week's hundred cars, each turning into the forecourt the prices send
     it to, the counters ticking as they arrive; the money under each
     forecourt climbs to that side's real payoff. */
  stopCars();
  const g=document.getElementById('cars');if(!g)return;
  let cars=[], queue=[], last=performance.now(), spawn=0, arrived=[0,0], total=[0,0], pay=[0,0];
  if(mode==='split'){
    const sp=carSplit(pa,pb,week||1);total=sp;pay=[profit(pa,pb,week||1),profit(pb,pa,week||1)];
    for(let i=0;i<sp[0];i++)queue.push('a');for(let i=0;i<sp[1];i++)queue.push('b');
    for(let i=queue.length;i<100;i++)queue.push('s');
    for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}
    setCount('A',0,0);setCount('B',0,0);
  }else{setCount('A',null,null);setCount('B',null,null);}
  const tick=now=>{
    const dt=Math.min(50,now-last);last=now;spawn-=dt;
    if(spawn<=0){
      if(mode==='split'){if(queue.length){cars.push({t:-0.05,dest:queue.shift(),lane:Math.random()<.5?168:192,col:CARCOL[Math.floor(Math.random()*CARCOL.length)]});spawn=60;}}
      else{cars.push({t:-0.05,dest:'s',lane:Math.random()<.5?168:192,col:CARCOL[Math.floor(Math.random()*CARCOL.length)]});spawn=420;}
    }
    cars.forEach(c=>{c.t+=dt/(mode==='split'?1500:2600);});
    let h='';
    cars.forEach(c=>{
      let x,y,rot=0,op=1;
      if(c.dest==='s'){x=c.lane;y=-30+c.t*290;}
      else{
        const k=c.t/0.42;
        if(k<1){x=c.lane;y=-30+k*130;}
        else{const u=Math.min(1,(c.t-0.42)/0.5);const tx=c.dest==='a'?70:290;
          x=c.lane+(tx-c.lane)*(1-Math.pow(1-u,2));y=100+u*40;rot=(c.dest==='a'?-1:1)*Math.sin(u*Math.PI)*70;op=u>0.8?1-(u-0.8)/0.2:1;
          if(u>=1&&!c.counted){c.counted=true;const i=c.dest==='a'?0:1;arrived[i]++;
            setCount(c.dest.toUpperCase(),arrived[i],total[i]?pay[i]*arrived[i]/total[i]:0);}}
      }
      if(c.t<1.05)h+='<rect x="-7" y="-12" width="14" height="24" rx="3" fill="'+c.col+'" opacity="'+op.toFixed(2)+'" transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+rot.toFixed(1)+')"/>';
    });
    cars=cars.filter(c=>c.t<1.05);
    g.innerHTML=h;
    if(mode==='split'&&!queue.length&&!cars.length){setCount('A',total[0],pay[0]);setCount('B',total[1],pay[1]);carsRAF=null;return;}
    carsRAF=requestAnimationFrame(tick);
  };
  carsRAF=requestAnimationFrame(tick);
}
function stopCars(){if(carsRAF){cancelAnimationFrame(carsRAF);carsRAF=null;}}

/* what happened, in a line */
function verdict(mine,theirs,w){
  const shock=G.shock&&w>=5, dbl=isDouble(w)?' This week paid double.':'';
  if(mine==='1.50'&&theirs==='1.50')return 'They posted £1.50 too. Forty cars pulled in to each of you.'+dbl;
  if(mine==='1.40'&&theirs==='1.40')return 'They posted £1.40 too. Forty-five cars each, at the lower price.'+dbl;
  if(mine==='1.40')return shock?'They posted £1.50. The app sent nearly every car in the district to you.':'They posted £1.50. Ninety cars pulled in to you and seven to them.'+dbl;
  return shock?'They posted £1.40. The app sent nearly every car in the district to them.':'They posted £1.40. Ninety cars pulled in to them and seven to you.'+dbl;
}

/* ---------- a week in play ---------- */
function weekHead(w){
  const s=G.shock&&w>=5;
  return '<div class="wkhead"><span class="wk">WEEK '+w+'</span>'+
    (s?'<span class="dbl shk">Gazette rules</span>':(isDouble(w)?'<span class="dbl">Pays double</span>':''))+
    '<span class="mine '+station[0]+'">'+LBL[station[0]]+' '+station[1]+'</span></div>';
}
let postedSign={}, seenCommit={};
function renderWeek(same){
  const w=G.opened;
  if(!same){
    app.innerHTML=weekHead(w)+junctionSVG(station[0])+
      '<div class="lbl">Post your price</div>'+
      signButtons(station[0],{hint:'Tap to lean. Press and hold to propose.'})+
      '<div id="wlines"></div>'+
      '<div class="lockline" id="lockline"></div>'+
      '<div class="lbl">Your ledger</div>'+ledgerHTML(w);
    startCars('flow');
    app.querySelectorAll('.signbtn').forEach(b=>holdable(b,
      ()=>{postLean(b.dataset.p);},
      ()=>{postLock(b.dataset.p);}));
  }
  paintWeek();
  function postLean(p){
    const k=station+'|'+w;G.lean[k]=G.lean[k]||{};G.lean[k][norm(name)]={name,price:p,why:''};
    say(ROOM.huddle,station+'|'+w+'|lean|'+name+'|'+p+'|','h'+w).catch(c=>{st.textContent=failMsg(c);});
    paintWeek();
  }
  function postLock(p){
    if(G.sign[station+'|'+w])return;
    const k=station+'|'+w;G.lock[k]=G.lock[k]||{};G.lock[k][norm(name)]={name,price:p};
    say(ROOM.huddle,station+'|'+w+'|lock|'+name+'|'+p,'k'+w).catch(c=>{st.textContent=failMsg(c);});
    paintWeek();
  }
}
function paintWeek(){
  const w=G.opened, k=station+'|'+w;
  const up=G.sign[k]||'', ag=agreed(station,w);
  /* the team has agreed and no sign is up yet: this phone posts it (any of them may; the same line twice is harmless) */
  if(ag&&!up&&!postedSign[k+ag]){postedSign[k+ag]=true;say(ROOM.prices,station+'|'+w+'|'+ag,'w'+w).then(()=>{G.sign[k]=ag;paintWeek();}).catch(()=>{postedSign[k+ag]=false;});}
  if(up&&!seenCommit[k]){seenCommit[k]=true;committedOverlay(station[0],up);}
  const locks=G.lock[k]||{}, leans=G.lean[k]||{};
  const myLock=locks[norm(name)], myLean=leans[norm(name)];
  app.querySelectorAll('.signbtn').forEach(b=>{
    const p=b.dataset.p;
    b.classList.toggle('locked',up?p===up:(!!myLock&&myLock.price===p));
    b.classList.toggle('mute',up?p!==up:(!!myLock&&myLock.price!==p));
    b.classList.toggle('lean',!up&&!myLock&&!!myLean&&myLean.price===p);
    b.disabled=!!up;
  });
  const mem=myMembers();
  const L={},P={};
  mem.forEach(n=>{const l=locks[norm(n)],e=leans[norm(n)];if(l)P[norm(n)]=l.price;else if(e)L[norm(n)]=e.price;});
  const wl=document.getElementById('wlines');if(wl)wl.innerHTML=teamLines(mem,L,P,name);
  const ll=document.getElementById('lockline');
  if(ll){
    const nLock=mem.filter(n=>locks[norm(n)]).length;
    const prices=new Set(mem.filter(n=>locks[norm(n)]).map(n=>locks[norm(n)].price));
    ll.classList.toggle('up',!!up);
    if(up)ll.innerHTML='<b>Your sign is up: \u00a3'+up+'.</b> Waiting for Monday morning.';
    else if(prices.size>1)ll.innerHTML='<b>Your proposals don\u2019t agree.</b> The sign goes up when everyone has proposed the same price. Hold the other price to switch.';
    else if(nLock===0)ll.innerHTML='Nobody on '+LBL[station[0]]+' '+station[1]+' has proposed yet. If you haven\u2019t all agreed by Monday morning, the sign stays at \u00a31.50.';
    else ll.innerHTML='<b>'+nLock+' of '+mem.length+' proposed'+(prices.size?' \u00a3'+[...prices][0]:'')+'.</b> Waiting for '+mem.filter(n=>!locks[norm(n)]).map(n=>norm(n)===norm(name)?'you':esc(n)).join(' and ')+'.';
  }
  const shown=up||(myLock?myLock.price:(myLean?myLean.price:''));
  setSigns(station[0]==='a'?shown:'',station[0]==='b'?shown:'');
  const lg=document.getElementById('ledger');if(lg)lg.outerHTML=ledgerHTML(w);
}
function ledgerHTML(cur){
  const L=ledger();
  const cell=s=>!s?'<td class="blank">\u2013</td>':'<td class="'+(s.def?'def ':'')+'p'+s.price.replace('.','')+'">\u00a3'+s.price+'</td>';
  let h='<table class="ledger" id="ledger"><thead><tr><th>Week</th><th>You</th><th>Them</th><th>This week</th><th>Running</th></tr></thead><tbody>';
  L.rows.forEach(x=>{
    const s=G.shock&&x.w>=5;
    h+='<tr'+(x.w===cur?' class="cur"':'')+'><td class="w">'+x.w+(s?'<em class="s">!</em>':(isDouble(x.w)?'<em>\u00d72</em>':''))+'</td>'+cell(x.mine)+cell(x.theirs)+
      '<td class="'+(x.p===null?'blank':'')+'">'+(x.p===null?'\u2013':'\u00a3'+x.p+'k')+'</td>'+
      '<td class="'+(x.run===null?'blank':'')+'">'+(x.run===null?'\u2013':'\u00a3'+x.run+'k')+'</td></tr>';
  });
  h+='<tr class="tot"><td colspan="4">Total so far</td><td>\u00a3'+L.total+'k</td></tr></tbody></table>';
  return h;
}

/* ---------- the reveal, and the wait between weeks ---------- */
function renderBetween(same){
  if(same)return;
  const w=G.myRev, r=rival();
  const mine=signUp(station,w), theirs=r?signUp(r,w):null;
  const p=(mine&&theirs)?profit(mine.price,theirs.price,w):null;
  const L=ledger();
  app.innerHTML=weekHead(w)+junctionSVG(station[0])+
    (p===null?'<div class="card soft"><p>The board at the front has this week.</p></div>':
    '<div class="result"><div class="amt '+(p>=12?(p>12?'good':''):'bad')+'"><small>\u00a3</small><span id="amt">0</span><small>k</small></div><div class="verdict">'+verdict(mine.price,theirs.price,w)+'</div>'+
    (mine.def?'<div class="note">Your team hadn\u2019t all agreed, so your sign stayed at \u00a31.50.</div>':'')+
    '<div class="run">Six-week total so far <b>\u00a3'+L.total+'k</b></div></div>')+
    '<div class="waitcard"><span class="pulse"></span>'+(w<WEEKS?'Waiting for week '+(w+1)+' to open.':'That was the last week.')+'</div>'+
    '<div class="lbl">Your ledger</div>'+ledgerHTML(0);
  if(p!==null){
    const pa=station[0]==='a'?mine.price:theirs.price, pb=station[0]==='a'?theirs.price:mine.price;
    setSigns(station[0]==='a'?mine.price:'',station[0]==='b'?mine.price:'');
    setTimeout(()=>{flipSign(station[0]==='a'?'b':'a',theirs.price);},700);
    setTimeout(()=>{startCars('split',pa,pb,w);countUp('amt',p,6500);},1500);
  }else startCars('flow');
}

/* ---------- the meetings ---------- */
function renderAsking(same){
  const w=G.meetOpen;
  if(!same){
    app.innerHTML='<div class="wkhead"><span class="wk">BEFORE WEEK '+w+'</span><span class="mine '+station[0]+'">'+LBL[station[0]]+' '+station[1]+'</span></div>'+
      '<div class="card meet"><h3>Do you want to meet the other station?</h3><p>Two minutes, one person from each side. It happens only if both stations ask. Nothing said in it counts for anything when the signs go up.</p></div>'+
      '<div class="meet"><div class="two"><button type="button" class="big" id="askY">Ask to meet</button><button type="button" class="big quiet" id="askN">No meeting</button></div></div>'+
      '<div class="lockline" id="askline"></div>';
    const send=y=>{const b=document.getElementById(y?'askY':'askN');b.disabled=true;
      say(ROOM.meet,station+'|'+w+'|ask|'+(y?'y':'n'),'m'+w).then(()=>{G.ask[station+'|'+w]=y;paintAsk();}).catch(c=>{b.disabled=false;st.textContent=failMsg(c);});};
    document.getElementById('askY').addEventListener('click',()=>send(true));
    document.getElementById('askN').addEventListener('click',()=>send(false));
  }
  paintAsk();
  function paintAsk(){
    const m=G.ask[station+'|'+w];
    const y=document.getElementById('askY'), n=document.getElementById('askN'), l=document.getElementById('askline');
    if(y){y.classList.toggle('quiet',m===false);y.disabled=false;}
    if(n){n.classList.toggle('quiet',m!==false);n.disabled=false;}
    if(l)l.innerHTML=m===undefined?'Your station hasn’t answered yet. Any of you can.':(m?'<b>You asked to meet.</b> If they asked too, you’ll be told where.':'<b>No meeting from your side.</b> You can change your mind until the reps are sent.');
  }
}
function renderMeeting(same){
  const w=G.meetOpen, r=rival();
  const on=!!(G.ask[station+'|'+w]&&r&&G.ask[r+'|'+w]);
  const idx=Object.keys(G.pair).filter(k=>k[0]==='a').sort().indexOf(station[0]==='a'?station:r);
  const spot=SPOTS[Math.max(0,idx)%SPOTS.length];
  const a=G.agreed[station+'|'+w];
  if(!same){
    app.innerHTML='<div class="wkhead"><span class="wk">BEFORE WEEK '+w+'</span><span class="mine '+station[0]+'">'+LBL[station[0]]+' '+station[1]+'</span></div>'+
      (on?'<div class="spot"><div class="sub">Meeting on. Send one person to</div><div class="where">'+esc(spot)+'</div><div class="sub">Two minutes</div></div>'+
          '<div class="card soft"><h3>Back from the meeting?</h3><p>What did the two of you agree? Only you and the debrief will see this. The other station writes its own version.</p></div>'+
          '<input class="reason" id="agreed" maxlength="120" autocomplete="off" placeholder="What was agreed, in a few words" value="'+esc(a?a.text:'')+'">'+
          '<button type="button" class="big" id="agreedgo">Send</button><div class="lockline" id="agreedline"></div>'
        :'<div class="card"><h3>No meeting this time.</h3><p>Week '+w+' opens when Ryan says so.</p></div>')+
      '<div class="waitcard"><span class="pulse"></span>Waiting for week '+w+' to open.</div>';
    const go=document.getElementById('agreedgo');
    if(go)go.addEventListener('click',()=>{
      const t=clean(document.getElementById('agreed').value).slice(0,120);if(!t)return;go.disabled=true;
      say(ROOM.meet,station+'|'+w+'|agreed|'+name+'|'+t,'g'+w).then(()=>{G.agreed[station+'|'+w]={name,text:t};go.disabled=false;paintAgreed();}).catch(c=>{go.disabled=false;st.textContent=failMsg(c);});
    });
  }
  paintAgreed();
  function paintAgreed(){const l=document.getElementById('agreedline');const x=G.agreed[station+'|'+w];
    if(l)l.innerHTML=x?'Noted from <b>'+esc(x.name)+'</b>: “'+esc(x.text)+'”. Send again to replace it.':'';}
}

/* ---------- game over ---------- */
function renderOver(same){
  if(same)return;
  const L=ledger();
  app.innerHTML='<div class="wkhead"><span class="wk">SIX WEEKS</span><span class="mine '+station[0]+'">'+LBL[station[0]]+' '+station[1]+'</span></div>'+
    '<div class="result"><div class="run">Your six weeks</div><div class="amt"><small>£</small>'+L.total+'<small>k</small></div><div class="verdict">The board at the front takes it from here.</div></div>'+
    '<div class="lbl">Your ledger</div>'+ledgerHTML(0)+
    '<div class="foot">Price Wars · Module 4</div>';
}

/* ---------- polling ---------- */
function tick(){
  if(!station){render();return;}
  Promise.all([answers(ROOM.teams),answers(ROOM.prices),answers(ROOM.huddle),answers(ROOM.meet)]).then(([t,p,h,m])=>{
    parse(t,p,h,m);render();
  }).catch(()=>{});
}
setInterval(tick,2500);
render();tick();

/* ---------- the theme ---------- */
(function(){
  const btn=document.getElementById('theme'), a=document.getElementById('themeAudio');
  btn.addEventListener('click',()=>{
    if(!a.paused){a.pause();a.currentTime=0;btn.classList.remove('playing');btn.textContent='Theme';return;}
    a.volume=0.55;a.onended=()=>{btn.classList.remove('playing');btn.textContent='Theme';};
    const p=a.play();if(p&&p.then)p.then(()=>{btn.classList.add('playing');btn.textContent='Stop';}).catch(()=>{});
  });
})();

/* ---------- demo: the deck's moves, driven from a bar at the foot ----------
   ?demo=1 keeps everything on this phone. The rival team is Buco's 3 (or
   Aura 3), two invented teammates lean and then lock (Tom holds out for a
   while in week 2, so the lock rule can be felt), the rival holds early
   and cuts late, and every press of the bar is one move the deck would
   make. */
const demoRoom={};
function demoAnswers(room){return (demoRoom[room]||[]).slice();}
function demoSay(room,line){(demoRoom[room]=demoRoom[room]||[]).push(line);}
if(DEMO){
  document.body.classList.add('demo-on');
  const bar=document.createElement('div');bar.className='demo';
  bar.innerHTML='<span><b>DEMO</b> <span class="dl" id="dl">no network, the deck’s next move is on the right</span></span><button type="button" id="dnext">Start the game</button>';
  document.body.appendChild(bar);
  const mates=['Priya K','Tom W'];
  let step=0;
  const rv=()=>G.pair[station]||(station[0]==='a'?'b3':'a3');
  const plan=()=>{
    const s=[];
    const me=station||'a1';const r=me[0]==='a'?'b3':'a3';const a=me[0]==='a'?me:r,b=me[0]==='a'?r:me;
    s.push({l:'Start the game',f:()=>{mates.forEach(m=>demoSay(ROOM.teams,me+'|'+m));demoSay(ROOM.prices,'::pair|'+a+'='+b+',a2=b1,a4=b2');}});
    for(let w=1;w<=6;w++){
      s.push({l:'Read the week\u2019s paper, week '+w,f:()=>{if(w===5)demoSay(ROOM.prices,'::shock|on');demoSay(ROOM.prices,'::paper|'+w);}});
      if((G.shock?[3,5]:[3,6]).includes(w)){
        s.push({l:'Offer a meeting before week '+w,f:()=>{demoSay(ROOM.prices,'::meet|'+w);setTimeout(()=>{demoSay(ROOM.meet,rv()+'|'+w+'|ask|'+(Math.random()<.8?'y':'n'));},1500);}});
        s.push({l:'Send the reps',f:()=>{demoSay(ROOM.prices,'::reps|'+w);}});
      }
      s.push({l:'Open week '+w,f:()=>{demoSay(ROOM.prices,'::open|'+w);}});
      s.push({l:'Signs up, week '+w,f:()=>{
        const rp=w>=5?'1.40':(w===3?(Math.random()<.5?'1.40':'1.50'):'1.50');
        demoSay(ROOM.prices,rv()+'|'+w+'|'+rp);
        demoSay(ROOM.prices,'::shown|'+w+'|'+(station[0]==='a'?station:rv()));demoSay(ROOM.prices,'::reveal|'+w);}});
    }
    return s;
  };
  const btn=document.getElementById('dnext'), dl=document.getElementById('dl');
  btn.addEventListener('click',()=>{
    const s=plan();if(step>=s.length){btn.disabled=true;return;}
    s[step].f();step++;
    tick();
    const n=plan()[step];btn.textContent=n?n.l:'Done';dl.textContent=s[step-1].l;
  });
  /* teammates lean a moment after a week opens, and propose behind you (Tom holds out in week 2) */
  setInterval(()=>{
    const w=G.opened;if(!station||!w||G.myRev>=w)return;
    const k=station+'|'+w;const leans=G.lean[k]||{}, locks=G.lock[k]||{};
    const my=locks[norm(name)], myLean=leans[norm(name)];
    mates.forEach((m,i)=>{
      if(!leans[norm(m)]&&!locks[norm(m)]&&(my||myLean)&&Math.random()<.5)demoSay(ROOM.huddle,k+'|lean|'+m+'|'+(my?my.price:myLean.price)+'|');
      else if(my&&!locks[norm(m)]&&Math.random()<(w===2&&i===1?.08:.45))demoSay(ROOM.huddle,k+'|lock|'+m+'|'+my.price);
    });
  },2200);
}
