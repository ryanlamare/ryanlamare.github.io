<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Price Wars — lock in your price</title>
<link rel="stylesheet" href="/brand.css">
<style>
/* Team-facing lock-in for the Module 4 price game. Posts one line per lock
   ("a1|3|1.40") into the gt-poll /say lane, room m4-prices; the deck's
   board and the instructor's desk page read the same room, latest line
   per station and week wins. Station choice sticks in localStorage. */
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper-soft);color:var(--ink);font-family:var(--sans);line-height:1.5;
  padding:28px 16px 60px;-webkit-font-smoothing:antialiased}
.sheet{max-width:520px;margin:0 auto;background:var(--paper);padding:36px 26px 40px;
  box-shadow:0 2px 30px rgba(27,28,25,.10);border:1px solid var(--rule)}
.hkick{font-weight:700;text-transform:uppercase;letter-spacing:.22em;font-size:11.5px;color:var(--muted);text-align:center}
.hword{font-family:var(--display);font-weight:900;font-size:46px;line-height:.9;color:var(--red);text-align:center;margin-top:12px}
.hsub{font-weight:700;font-size:16px;color:var(--ink);text-align:center;margin-top:8px}
.shead{display:flex;align-items:center;gap:10px;margin:30px 0 10px}
.shead .sq{width:13px;height:13px;background:var(--red);flex:none}
.shead h2{font-family:var(--display);font-weight:900;font-size:19px;color:var(--red)}
.stations{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.stations button{font-family:var(--sans);font-weight:700;font-size:15px;padding:12px 0;background:var(--card);
  border:2px solid var(--rule);cursor:pointer;color:var(--ink)}
.stations button.a{color:var(--teal)}
.stations button.b{color:var(--terracotta)}
.stations button.on{border-color:var(--ink);background:var(--paper-soft);box-shadow:inset 0 0 0 1.5px var(--ink)}
.weeks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.weeks button{font-family:var(--sans);font-weight:700;font-size:15px;padding:12px 0;background:var(--card);
  border:2px solid var(--rule);cursor:pointer;color:var(--ink)}
.weeks button .x2{display:block;font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--red)}
.weeks button.on{border-color:var(--ink);background:var(--paper-soft);box-shadow:inset 0 0 0 1.5px var(--ink)}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prices button{font-family:var(--display);font-weight:900;font-size:42px;padding:22px 0 18px;cursor:pointer;
  background:var(--ink);color:var(--paper);border:3px solid var(--ink)}
.prices button small{display:block;font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.14em;margin-top:6px;color:var(--tan-light)}
.prices button.on{background:var(--red);border-color:var(--red)}
.lockbtn{width:100%;margin-top:26px;font-family:var(--sans);font-weight:700;text-transform:uppercase;
  letter-spacing:.14em;font-size:16px;padding:18px 0;background:var(--red);color:var(--paper);border:0;cursor:pointer}
.lockbtn:disabled{background:var(--rule);cursor:default}
.status{margin-top:16px;text-align:center;font-weight:600;font-size:15.5px;color:var(--muted);min-height:1.5em}
.status.ok{color:var(--green)}
.status.bad{color:var(--red)}
.note{margin-top:26px;font-size:13.5px;line-height:1.5;color:var(--muted);border-left:3px solid var(--rule);padding-left:14px}
</style>
</head><body>
<main class="sheet">
  <div class="hkick">Applied Game Theory · Module 4</div>
  <div class="hword">PRICE WARS</div>
  <div class="hsub">Lock in your weekly price</div>

  <div class="shead"><span class="sq"></span><h2>Your station</h2></div>
  <div class="stations" id="stations"></div>

  <div class="shead"><span class="sq"></span><h2>Week</h2></div>
  <div class="weeks" id="weeks"></div>

  <div class="shead"><span class="sq"></span><h2>Your price</h2></div>
  <div class="prices">
    <button type="button" id="p150">£1.50<small>HOLD</small></button>
    <button type="button" id="p140">£1.40<small>UNDERCUT</small></button>
  </div>

  <button class="lockbtn" id="lock" disabled>LOCK IT IN</button>
  <div class="status" id="status">Pick your station, the week, and a price.</div>

  <p class="note">Your price stays hidden until both signs go up on the board at the front.
  Locking in again before the reveal replaces your earlier choice.</p>
</main>
<script>
(function(){
const API='https://gt-poll.rlamare.workers.dev/p/m4-prices/say';
const TEAMS=['a1','a2','a3','a4','b1','b2','b3','b4'];
const LBL={a:'Aura',b:"Buco's"};
let station=localStorage.getItem('pw-station')||'', week='', price='';
let voter=localStorage.getItem('pw-voter');
if(!voter){voter=(crypto.randomUUID?crypto.randomUUID():('v'+Date.now()+'-'+Math.random().toString(36).slice(2,10)));localStorage.setItem('pw-voter',voter);}

const stEl=document.getElementById('stations');
TEAMS.forEach(t=>{
  const b=document.createElement('button');b.type='button';
  b.className=t[0];b.textContent=LBL[t[0]]+' '+t[1];b.dataset.t=t;
  b.addEventListener('click',()=>{station=t;localStorage.setItem('pw-station',t);paint();});
  stEl.appendChild(b);
});
const wkEl=document.getElementById('weeks');
for(let w=1;w<=6;w++){
  const b=document.createElement('button');b.type='button';b.dataset.w=w;
  b.innerHTML='W'+w+((w===3||w===6)?'<span class="x2">×2</span>':'');
  b.addEventListener('click',()=>{week=String(w);paint();});
  wkEl.appendChild(b);
}
const b150=document.getElementById('p150'), b140=document.getElementById('p140');
b150.addEventListener('click',()=>{price='1.50';paint();});
b140.addEventListener('click',()=>{price='1.40';paint();});
const lock=document.getElementById('lock'), status=document.getElementById('status');
function paint(){
  [...stEl.children].forEach(b=>b.classList.toggle('on',b.dataset.t===station));
  [...wkEl.children].forEach(b=>b.classList.toggle('on',b.dataset.w===week));
  b150.classList.toggle('on',price==='1.50');
  b140.classList.toggle('on',price==='1.40');
  lock.disabled=!(station&&week&&price);
}
lock.addEventListener('click',()=>{
  lock.disabled=true;
  status.className='status';status.textContent='Locking in…';
  fetch(API,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({t:station+'|'+week+'|'+price,v:voter})})
  .then(r=>r.json()).then(d=>{
    if(d.ok){status.className='status ok';
      status.textContent='Locked: £'+price+' for Week '+week+' ('+LBL[station[0]]+' '+station[1]+')';}
    else{status.className='status bad';
      status.textContent=d.error==='enough'?'This phone has locked in too many times — use a teammate’s phone.':'That didn’t go through. Try again.';}
    paint();
  }).catch(()=>{status.className='status bad';status.textContent='No connection. Try again, or tell the facilitator your price.';paint();});
});
paint();
})();
</script>
</body></html>
