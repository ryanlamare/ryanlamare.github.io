<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Price Wars · phone mock</title>
<link rel="stylesheet" href="/brand.css">
<style>
/* A MOCK of the simplified Price Wars phone (16 Sep 2026), for Ryan to
   redline before the real page is rebuilt. Not wired to anything. One
   week: tap a price and your ring lands under it; two invented teammates
   follow; three dots under one price and the sign goes up. The bar at the
   foot plays the deck's Signs up. Delete this file when the real page has
   the design. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:20px 18px 110px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:baseline}
.top .wk{font-weight:700;letter-spacing:.16em;font-size:12px;color:var(--muted)}
.top .wk b{color:var(--teal)}
.top .tot{font-family:var(--display);font-weight:900;font-size:22px;line-height:1;color:var(--ink)}
.top .tot small{font-family:var(--sans);font-weight:700;font-size:10px;letter-spacing:.14em;color:var(--muted);margin-right:6px;vertical-align:middle}
.junction{border:2.5px solid var(--ink);background:var(--tan-light);overflow:hidden}
.junction svg{display:block;width:100%;height:auto}
.signg{transform-box:fill-box;transform-origin:center}
.signg.flip{animation:flip .5s ease-in-out}
@keyframes flip{0%{transform:scaleY(1)}50%{transform:scaleY(.04)}100%{transform:scaleY(1)}}
/* the two prices and the dots */
.signs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;background:var(--paper-soft);border:2.5px solid var(--ink);padding:0;cursor:pointer;font-family:var(--sans);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
.tile .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--teal);transition:height 1.1s cubic-bezier(.4,0,.2,1)}
.tile.locking .fill{height:100%}
.tile .pr{position:relative;z-index:1;font-family:var(--display);font-weight:900;font-size:52px;line-height:1;padding:22px 10px 18px;text-align:center;transition:color .4s}
.tile .pr small{font-size:24px;vertical-align:top;margin-right:1px}
.tile.locking .pr{color:var(--paper)}
.tile.mute{opacity:.3}
.dots{display:flex;justify-content:center;gap:12px;min-height:26px}
.dot{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--ink);background:transparent;transition:transform .3s,background .3s,border-color .3s;transform:scale(.001)}
.dot.on{transform:scale(1);background:var(--green);border-color:var(--green)}
.dots.split .dot.on{background:var(--red);border-color:var(--red)}
.dot.me.on{background:transparent;border-width:3.5px}
.dot.me.on::after{content:"";display:block;width:8px;height:8px;border-radius:50%;background:var(--green);margin:3px auto}
.dots.split .dot.me.on::after{background:var(--red)}
.splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--paper);background:var(--teal);animation:cin .35s ease-out;cursor:pointer}
.splash.off{opacity:0;transition:opacity .4s;pointer-events:none}
.splash .cl{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.02em;text-transform:uppercase}
.splash .ck{font-weight:700;font-size:16px;letter-spacing:.3em;text-transform:uppercase}
.splash .cp{font-family:var(--display);font-weight:900;font-size:96px;line-height:1}
.splash .cp small{font-size:44px;vertical-align:top}
@keyframes cin{from{transform:scale(1.12);opacity:0}to{transform:scale(1);opacity:1}}
.twist{display:none;background:var(--red);color:var(--paper);padding:12px 14px;font-weight:700;font-size:17px;line-height:1.3;text-align:center}
.twist.on{display:block}
.top.hot .wk,.top.hot .wk b{color:var(--red)}
/* the reveal */
.take{font-family:var(--display);font-weight:900;font-size:64px;line-height:1;text-align:center;color:var(--ink);opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.take.on{opacity:1;transform:none}
.take small{font-size:30px;vertical-align:top}
.take.good{color:var(--green)} .take.bad{color:var(--red)}
.pulse{display:none;width:10px;height:10px;background:var(--red);border-radius:50%;margin:0 auto;animation:pu 1.2s ease-in-out infinite}
.pulse.on{display:block}
@keyframes pu{0%,100%{opacity:.25}50%{opacity:1}}
/* the mock's own controls: what the deck would do */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);display:flex;gap:10px;align-items:center;padding:12px 16px;font-size:12px;flex-wrap:wrap}
.bar b{letter-spacing:.14em}
.bar button{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--red);border:none;color:var(--paper);padding:10px 12px;cursor:pointer}
.bar button.q{background:transparent;border:1.5px solid var(--paper)}
.bar button:disabled{opacity:.35}
</style>
</head><body>
<div class="wrap">
  <div class="top"><span class="wk">WEEK 1 &middot; <b>AURA 1</b> &middot; JUNCTION 1</span><span class="tot"><small>SO FAR</small>&pound;0k</span></div>
  <div class="junction"><svg viewBox="0 0 360 172" role="img" aria-label="The junction">
    <rect x="0" y="0" width="360" height="172" fill="var(--tan-light)"/>
    <rect x="150" y="0" width="60" height="172" fill="var(--grey)"/>
    <g fill="var(--paper)"><rect x="178" y="8" width="4" height="18"/><rect x="178" y="42" width="4" height="18"/><rect x="178" y="76" width="4" height="18"/><rect x="178" y="110" width="4" height="18"/><rect x="178" y="144" width="4" height="18"/></g>
    <rect x="118" y="90" width="32" height="70" fill="var(--grey)"/><rect x="210" y="90" width="32" height="70" fill="var(--grey)"/>
    <g><rect x="18" y="86" width="104" height="78" fill="var(--paper)" stroke="var(--teal)" stroke-width="3"/><rect x="34" y="104" width="12" height="30" fill="var(--teal)"/><rect x="58" y="104" width="12" height="30" fill="var(--teal)"/><rect x="82" y="104" width="12" height="30" fill="var(--teal)"/><rect x="18" y="86" width="104" height="10" fill="var(--teal)"/>
      <text id="cntA" x="70" y="150" text-anchor="middle" font-family="League Spartan,sans-serif" font-weight="900" font-size="20" fill="var(--teal)"></text></g>
    <g><rect x="238" y="86" width="104" height="78" fill="var(--paper)" stroke="var(--terracotta)" stroke-width="3"/><rect x="254" y="104" width="12" height="30" fill="var(--terracotta)"/><rect x="278" y="104" width="12" height="30" fill="var(--terracotta)"/><rect x="302" y="104" width="12" height="30" fill="var(--terracotta)"/><rect x="238" y="86" width="104" height="10" fill="var(--terracotta)"/>
      <text id="cntB" x="290" y="150" text-anchor="middle" font-family="League Spartan,sans-serif" font-weight="900" font-size="20" fill="var(--terracotta)"></text></g>
    <g id="sgA" class="signg"><rect x="18" y="14" width="104" height="58" fill="var(--teal)"/><rect x="66" y="72" width="8" height="14" fill="var(--teal)"/><text x="70" y="30" text-anchor="middle" font-family="Jost,sans-serif" font-weight="700" font-size="10" letter-spacing="1.5" fill="var(--paper)">AURA · YOU</text><text id="signA" x="70" y="62" text-anchor="middle" font-family="League Spartan,sans-serif" font-weight="900" font-size="30" fill="var(--paper)">?</text></g>
    <g id="sgB" class="signg"><rect x="238" y="14" width="104" height="58" fill="var(--terracotta)"/><rect x="286" y="72" width="8" height="14" fill="var(--terracotta)"/><text x="290" y="30" text-anchor="middle" font-family="Jost,sans-serif" font-weight="700" font-size="10" letter-spacing="1.5" fill="var(--paper)">BUCO’S</text><text id="signB" x="290" y="62" text-anchor="middle" font-family="League Spartan,sans-serif" font-weight="900" font-size="30" fill="var(--paper)">?</text></g>
  </svg></div>
  <div class="twist" id="twist">FuelWatch is watching. Undercut alone and the app sends the whole district to you: <b>&pound;72k</b>. Match, and nothing changes. No double in week 6.</div>
  <div class="signs">
    <button type="button" class="tile" data-p="1.50"><div class="fill"></div><div class="pr"><small>&pound;</small>1.50</div></button>
    <button type="button" class="tile" data-p="1.40"><div class="fill"></div><div class="pr"><small>&pound;</small>1.40</div></button>
    <div class="dots" data-p="1.50"><span class="dot me"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="dots" data-p="1.40"><span class="dot me"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  <span class="pulse" id="pulse"></span>
</div>
<div class="bar"><b>MOCK</b><span id="hint">Tap a price. Your ring lands under it; your teammates follow.</span>
  <button type="button" class="q" id="theyHold">They hold</button><button type="button" class="q" id="theyCut">They cut</button>
  <button type="button" id="signsUp" disabled>Signs up (the deck)</button><button type="button" class="q" id="twistBtn">Week 5 twist</button><button type="button" class="q" id="again">Again</button></div>
<script>
const S={week:1,total:0,mine:'',mates:['',''],locked:'',theirs:'1.50',twist:false,timers:[]};
const later=(ms,f)=>S.timers.push(setTimeout(f,ms));
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function head(){
  const dbl=(S.week===3||S.week===6)&&!S.twist;
  $('.top').classList.toggle('hot',S.twist);
  $('.wk').innerHTML='WEEK '+S.week+(dbl?' &middot; PAYS DOUBLE':'')+' &middot; <b>AURA 1</b> &middot; JUNCTION 1';
  $('.tot').innerHTML='<small>SO FAR</small>£'+S.total+'k';
  $('#twist').classList.toggle('on',S.twist);
}
function paint(){
  const placed=[S.mine,S.mates[0],S.mates[1]].filter(Boolean), split=new Set(placed).size>1;
  $$('.dots').forEach(d=>{const p=d.dataset.p;const dots=d.querySelectorAll('.dot');d.classList.toggle('split',split);
    dots[0].classList.toggle('on',S.mine===p);dots[1].classList.toggle('on',S.mates[0]===p);dots[2].classList.toggle('on',S.mates[1]===p);});
  $$('.tile').forEach(t=>{const p=t.dataset.p;t.classList.toggle('locking',S.locked===p);t.classList.toggle('mute',!!S.locked&&S.locked!==p);t.disabled=!!S.locked;});
  $('#signA').textContent=S.locked?'£'+S.locked:'?';
  $('#signsUp').disabled=!S.locked;$('#pulse').classList.toggle('on',!!S.locked);
  if(!S.locked&&S.mine&&S.mates[0]===S.mine&&S.mates[1]===S.mine){S.locked=S.mine;later(0,paint);later(900,splash);$('#hint').textContent='Three greens: the sign goes up, the splash says so, and the phone waits. The reveal is on the board.';}
}
function splash(){
  const o=document.createElement('div');o.className='splash';
  o.innerHTML='<div class="cl">Aura 1 · Junction 1</div><div class="ck">Price locked in</div><div class="cp"><small>£</small>'+S.locked+'</div>';
  document.body.appendChild(o);const off=()=>{o.classList.add('off');setTimeout(()=>o.remove(),450);};o.addEventListener('click',off);setTimeout(off,2600);
}
$$('.tile').forEach(t=>t.addEventListener('click',()=>{
  if(S.locked)return;S.mine=t.dataset.p;paint();
  S.timers.forEach(clearTimeout);S.timers=[];
  /* one teammate agrees; the other tries the other price first, then comes round, so the reds are seen once */
  const other=S.mine==='1.50'?'1.40':'1.50';
  later(1100,()=>{S.mates[0]=S.mine;paint();});
  later(2300,()=>{S.mates[1]=other;paint();$('#hint').textContent='Split: every dot is red until you agree. Anyone can move their own dot.';});
  later(5200,()=>{S.mates[1]=S.mine;paint();});
}));
$('#theyHold').addEventListener('click',()=>{S.theirs='1.50';$('#hint').textContent='The other station will post £1.50 (you only find out on the board).';});
$('#theyCut').addEventListener('click',()=>{S.theirs='1.40';$('#hint').textContent='The other station will post £1.40 (you only find out on the board).';});
$('#signsUp').addEventListener('click',()=>{
  if(!S.locked)return;
  const mine=S.locked,theirs=S.theirs;
  let pay=mine==='1.50'?(theirs==='1.50'?12:2):(theirs==='1.50'?18:9);
  if(S.twist)pay=mine===theirs?pay:(mine==='1.40'?72:2);else if(S.week===3||S.week===6)pay*=2;
  S.total+=pay;S.week=Math.min(6,S.week+1);S.mine='';S.mates=['',''];S.locked='';
  head();paint();$('#hint').textContent='Week '+S.week+': same two prices, and the team\'s total so far at the top.';
});
$('#twistBtn').addEventListener('click',()=>{S.twist=!S.twist;if(S.twist)S.week=Math.max(S.week,5);head();paint();$('#hint').textContent=S.twist?'Week 5 after the Gazette: the header goes red and one band carries the new rule. The paper itself is on the board.':'Twist off.';});
$('#again').addEventListener('click',()=>{S.timers.forEach(clearTimeout);S.timers=[];Object.assign(S,{week:1,total:0,mine:'',mates:['',''],locked:'',twist:false});head();paint();$('#hint').textContent='Tap a price. Your ring lands under it; your teammates follow.';});
head();paint();
</script>
</body></html>
