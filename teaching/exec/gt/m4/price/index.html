<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Module 4 · Price Wars</title>
<link rel="stylesheet" href="/brand.css">
<style>
/* A team's phone for Price Wars (29 Sep 2026, Ryan's design; the log it
   reads is described in ../pw.js). Ryan runs the game in person from his
   desk (m4/desk/): he asks each team for its price and taps it, and he tells
   each team its rival's price by tapping Reveal in front of it. This page
   only shows what he has already said: the week's payoff matrix (the hall
   cannot see the screen), the team's own price once he has tapped it, the
   rival's only once he has revealed it, and the revenue. The one thing a
   team taps is Meet?, before weeks 3 and 5. Any number of phones can follow
   one team. The plan B hold-up version is at m4/hold/. A Poll Desk reset of
   Price Wars sends the phone back to the station picker. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:22px 16px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tag{font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--muted)}
.tag i{display:inline-block;width:10px;height:10px;background:var(--red);margin-right:10px;vertical-align:middle}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.who{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.who.a{color:var(--teal)} .who.b{color:var(--terracotta)}
.total{font-weight:700;font-size:15px;color:var(--muted)} .total b{font-family:var(--display);font-weight:900;font-size:22px;color:var(--ink);margin-left:6px}
h1{font-weight:700;font-size:24px;line-height:1.25;color:var(--red)}
h1 .wt{display:inline-block;margin-left:10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);background:var(--red);padding:3px 8px;vertical-align:4px}
.lbl{font-weight:600;font-size:15px;line-height:1.4;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font-family:var(--sans);cursor:pointer;-webkit-tap-highlight-color:transparent}
button.opt{display:block;width:100%;text-align:left;font-weight:600;font-size:17px;line-height:1.3;color:var(--ink);
  background:var(--card);border:2.5px solid var(--ink);padding:15px 18px}
button.opt.sel{background:var(--ink);color:var(--paper)}
button.num{font-family:var(--display);font-weight:900;font-size:26px;text-align:center;padding:14px 0}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
button.go{width:100%;font-weight:700;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper);
  background:var(--red);border:2.5px solid var(--red);padding:16px}
button.go:disabled{opacity:.3;cursor:default}
button.meet{height:88px;font-weight:700;font-size:22px;color:var(--paper);border:4px solid var(--ink)}
button.meet.y{background:var(--green)} button.meet.n{background:var(--red)}
button.meet.dim{opacity:.35} button.meet.sel{outline:5px solid var(--ink);outline-offset:3px}
/* the week's matrix: rows Aura, columns Buco's, this team's numbers in bold */
table.pm{border-collapse:collapse;margin:0 auto}
table.pm th,table.pm td{padding:0;text-align:center}
table.pm th{font-weight:700;font-size:13px;letter-spacing:.04em;padding:4px 6px}
table.pm th.ax{text-transform:uppercase;letter-spacing:.14em;font-size:11px}
table.pm th.ax.a{color:var(--teal)} table.pm th.ax.b{color:var(--terracotta)}
table.pm td.c{border:2px solid var(--ink);background:var(--card);font-weight:600;font-size:18px;width:112px;height:54px;color:var(--muted)}
table.pm td.c span.me{font-weight:800;font-size:22px}
table.pm td.c .a.me{color:var(--teal)} table.pm td.c .b.me{color:var(--terracotta)}
table.pm td.c .s{margin:0 .25em}
.cap{font-weight:500;font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
.status{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{border:2.5px solid var(--ink);padding:10px 12px;text-align:center}
.chip .ck{font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.chip .cv{font-family:var(--display);font-weight:900;font-size:30px;line-height:1.1;color:var(--ink)}
.chip.h{background:var(--green);border-color:var(--green)} .chip.c{background:var(--red);border-color:var(--red)}
.chip.h .ck,.chip.c .ck,.chip.h .cv,.chip.c .cv{color:var(--paper)}
.card{border:2.5px solid var(--ink);background:var(--card);padding:18px;text-align:center}
.card .big{font-family:var(--display);font-weight:900;font-size:46px;line-height:1.05;color:var(--ink)}
.card .sub{font-weight:600;font-size:15px;color:var(--muted);margin-top:6px}
/* the record: six weeks, our sign over theirs */
.rec{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rec .wk{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.rec .wl{font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--muted);text-align:center}
.rec .wl em{font-style:normal;color:var(--red);margin-left:2px}
.rec .wk.cur .wl{color:var(--ink)}
.rec .sq{height:22px;border:1.5px solid var(--rule);background:transparent}
.rec .sq.h{background:var(--green);border-color:var(--green)}
.rec .sq.c{background:var(--red);border-color:var(--red)}
.rec .rv{font-weight:700;font-size:11.5px;text-align:center;color:var(--ink);min-height:14px}
.reckey{font-weight:600;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.foot{display:flex;gap:18px;margin-top:6px}
.foot button{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:none;border:none;color:var(--muted);text-decoration:underline}
</style>
</head><body>
<div class="wrap" id="app"></div>
<script src="../pw.js"></script>
<script>
const KEY='m4-team-v2-'+PW.ROOM;
let S={team:null,joined:false};
try{if(new URLSearchParams(location.search).get('fresh')==='1')localStorage.removeItem(KEY);}catch(_){}
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.team)S=Object.assign(S,s);}catch(_){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){}};
let lines=[], pickS=null, pickJ=null, myAns={};
const app=document.getElementById('app');
const me=PW.voter();

function join(){
  if(!S.team||S.joined)return;
  const t=S.team;
  PW.say(me,'pw|j|'+t).then(()=>{if(S.team===t){S.joined=true;save();}}).catch(()=>{});
}
function pull(){
  if(document.visibilityState==='hidden')return;
  PW.entries().then(es=>{
    /* a Poll Desk reset took this phone's line with it: back to the picker */
    if(S.team&&S.joined&&!es.some(e=>e.v===me&&/^pw\|j\|/.test(e.t))){S={team:null,joined:false};save();}
    lines=es.map(e=>e.t);render();
  }).catch(()=>{});
  join();
}

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function btn(cls,html,fn){const b=el('button',cls,html);b.type='button';b.addEventListener('click',fn);return b;}
const k=n=>'£'+n+'k';

function header(g,t){
  const top=el('div','top');
  top.appendChild(el('div','who '+t[0],PW.NAME[t[0]]+' &middot; Junction '+t.slice(1)));
  top.appendChild(el('div','total','Revenue<b>'+k(PW.earned(g,t))+'</b>'));
  return top;
}
function matrix(w,t){
  const box=el('div');
  box.appendChild(el('div','',PW.matrixHTML(w,t[0])));
  box.appendChild(el('div','cap','In thousands of pounds. Aura&rsquo;s revenue first, Buco&rsquo;s second.'));
  return box;
}
function record(g,t,cur){
  const r=PW.rival(t), box=el('div');box.style.cssText='display:flex;flex-direction:column;gap:8px';
  const rec=el('div','rec');
  for(let w=1;w<=6;w++){
    const mine=PW.p(g,t,w), told=PW.isTold(g,t,w), theirs=told?PW.p(g,r,w):null;
    const mark=g.news?(w>=5?'<em>!</em>':(w===3?'<em>&times;2</em>':'')):((w===3||w===6)?'<em>&times;2</em>':'');
    const wk=el('div','wk'+(w===cur?' cur':''));
    wk.appendChild(el('div','wl','W'+w+mark));
    wk.appendChild(el('div','sq'+(mine?' '+mine:'')));
    wk.appendChild(el('div','sq'+(theirs?' '+theirs:'')));
    wk.appendChild(el('div','rv',theirs?PW.rev(w,mine,theirs):''));
    rec.appendChild(wk);
  }
  box.appendChild(rec);
  box.appendChild(el('div','reckey','<span>Top row: your price</span><span>Bottom row: theirs</span><span>Green &pound;1.50 &middot; red &pound;1.40</span>'));
  return box;
}
function footer(g,t){
  const f=el('div','foot');
  if(!PW.p(g,t,1))f.appendChild(btn('','Wrong station or junction?',()=>{S={team:null,joined:false};save();render();}));
  return f;
}

function render(){
  app.innerHTML='';
  app.appendChild(el('div','tag','<i></i>APPLIED GAME THEORY &middot; MODULE 4'));
  if(!S.team)return setup();
  const g=PW.parse(lines), t=S.team, r=PW.rival(t);
  app.appendChild(header(g,t));
  let w=1;while(w<=6&&PW.isTold(g,t,w))w++;
  if(w===7){
    app.appendChild(el('h1','','Six weeks at the junction'));
    let theirs=0;for(let u=1;u<=6;u++)theirs+=PW.rev(u,PW.p(g,r,u),PW.p(g,t,u));
    app.appendChild(el('div','card','<div class="big">'+k(PW.earned(g,t))+'</div><div class="sub">your station&rsquo;s revenue</div>'));
    app.appendChild(el('div','card','<div class="big">'+k(theirs)+'</div><div class="sub">their station&rsquo;s revenue</div>'));
    app.appendChild(record(g,t,0));
    return;
  }
  const gate=PW.GATES.includes(w)&&!g.open[w]&&PW.allIn(g,w-1);
  if(w>=5&&!g.news){   /* nothing about weeks 5 and 6 until the news is out */
    app.appendChild(el('h1','','Stop here. There is news from the junction.'));
    app.appendChild(record(g,t,0));
    return;
  }
  if(gate&&!g.mc[w]){
    app.appendChild(el('h1','','Before week '+w+': do you want to meet them?'));
    const a=(g.ans[t]||{})[w]||myAns[w];
    const row=el('div','row2');
    [['y','Yes'],['n','No']].forEach(([x,l])=>row.appendChild(btn('meet '+x+(a?(a===x?' sel':' dim'):''),l,()=>{
      myAns[w]=x;render();PW.say(me,'pw|q|'+t+'|'+w+'|'+x).then(pull).catch(()=>{});
    })));
    app.appendChild(row);
    app.appendChild(el('div','lbl','Two minutes, one person from each station, and only if both of you ask. Nothing said in it binds anyone.'));
    app.appendChild(matrix(w,t));
    app.appendChild(record(g,t,w));
    return;
  }
  if(gate){
    app.appendChild(el('h1','','Before week '+w));
    app.appendChild(el('div','lbl',PW.meets(g,w,+t.slice(1))?'Your meeting is on: one person to the door.':'No meeting.'));
    app.appendChild(matrix(w,t));
    app.appendChild(record(g,t,w));
    return;
  }
  const tag=PW.tagOf(w);
  app.appendChild(el('h1','','Week '+w+(tag?'<span class="wt">'+tag+'</span>':'')));
  app.appendChild(matrix(w,t));
  const mine=PW.p(g,t,w), st=el('div','status');
  st.appendChild(el('div','chip'+(mine?' '+mine:''),'<div class="ck">Your price</div><div class="cv">'+(mine?PW.PRICE[mine]:'&ndash;')+'</div>'));
  const last=w>1?PW.p(g,r,w-1):null;   /* the latest price Ryan has told them, week w-1 */
  st.appendChild(el('div','chip'+(last?' '+last:''),'<div class="ck">'+(w>1?'Theirs, week '+(w-1):'Theirs')+'</div><div class="cv">'+(last?PW.PRICE[last]:'&ndash;')+'</div>'));
  app.appendChild(st);
  app.appendChild(record(g,t,w));
  app.appendChild(footer(g,t));
}

function setup(){
  app.appendChild(el('h1','','Price Wars'));
  app.appendChild(el('div','lbl','Which station are you?'));
  const st=el('div','choices');
  ['a','b'].forEach(x=>st.appendChild(btn('opt'+(pickS===x?' sel':''),PW.NAME[x],()=>{pickS=x;render();})));
  app.appendChild(st);
  app.appendChild(el('div','lbl','Which junction?'));
  const gr=el('div','grid6');
  for(let n=1;n<=6;n++)gr.appendChild(btn('opt num'+(pickJ===n?' sel':''),String(n),()=>{pickJ=n;render();}));
  app.appendChild(gr);
  const b=btn('go','Start',()=>{S={team:pickS+pickJ,joined:false};save();render();join();});b.disabled=!(pickS&&pickJ);
  app.appendChild(b);
}

let wl=null;
function awake(){try{if('wakeLock' in navigator&&!wl)navigator.wakeLock.request('screen').then(l=>{wl=l;l.addEventListener('release',()=>{wl=null;});}).catch(()=>{});}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){awake();pull();}});
awake();render();pull();setInterval(pull,3000);
</script>
</body></html>
