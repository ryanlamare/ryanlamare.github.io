<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rank the rules (sample)</title>
<link rel="stylesheet" href="/brand.css">
<style>
/* SAMPLE, not wired: the ranking screen for the Axelrod vote, for Ryan to
   drive before it becomes a poll type on /go (16 Sep 2026). Tap the rule
   you think finishes first, then the next; Tester is the anchor at fourth.
   Tap a placed rule to take it back. Wording is Claude's, for veto. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:22px 18px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tag{font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--muted)}
.tag i{display:inline-block;width:10px;height:10px;background:var(--red);margin-right:10px;vertical-align:middle}
h1{font-weight:700;font-size:24px;line-height:1.25;color:var(--red)}
.hint{font-weight:500;font-size:15px;line-height:1.4;color:var(--muted)}
.order{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:14px;min-height:58px;border:2.5px dashed var(--rule);padding:0 14px 0 0}
.slot .n{flex:none;width:44px;height:54px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:24px;color:var(--muted)}
.slot .body{flex:1;min-width:0;padding:8px 0}
.slot.filled{border:2.5px solid var(--ink);background:var(--card);cursor:pointer}
.slot.filled .n{background:var(--ink);color:var(--paper)}
.slot.anchor{border:2.5px solid var(--rule);background:var(--paper-soft);cursor:default}
.slot.anchor .n{background:var(--rule);color:var(--paper)}
.slot.anchor .body{opacity:.75}
.rn{font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
.rd{font-weight:500;font-size:13.5px;line-height:1.3;color:var(--muted);margin-top:2px}
.pool{display:flex;flex-direction:column;gap:8px}
.pool .ph{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;color:var(--muted);margin-top:6px}
button.opt{display:block;text-align:left;width:100%;font-family:var(--sans);background:var(--card);border:2.5px solid var(--ink);padding:12px 14px;cursor:pointer}
button.opt .rn,button.opt .rd{display:block}
button.lock{width:100%;font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:.1em;background:var(--red);border:2.5px solid var(--red);color:var(--paper);padding:16px 18px;cursor:pointer;margin-top:4px}
button.lock:disabled{background:var(--card);border-color:var(--ink);color:var(--ink);opacity:.45;cursor:default}
.status{font-weight:600;font-size:15px;color:var(--muted);min-height:1.4em}
.status b{color:var(--red)}
.locked .slot.filled{cursor:default}
</style></head><body><div class="wrap">
<div class="tag"><i></i>Applied Game Theory · Module 4</div>
<h1>Axelrod’s tournament: rank the rules</h1>
<div class="hint">Tap the rule you think finishes first, then the next. Tester finishes fourth; that one is done for you. Tap a rule you have placed to take it back.</div>
<div class="order" id="order"></div>
<div class="pool" id="pool"></div>
<button class="lock" id="lock" disabled>LOCK IT IN</button>
<div class="status" id="st"></div>
</div>
<script>
const RULES=[
 ['Tit for Tat','Start by cooperating, then copy whatever they did last move'],
 ['Tit for Two Tats','Cooperate, and defect only after they defect twice in a row'],
 ['Always Cooperate','Cooperate on every move, whatever they do to you'],
 ['Always Defect','Defect on every move, whatever they do to you'],
 ['Grudger','Cooperate until they defect once, then defect for ever after'],
 ['Random','Cooperate or defect on a coin toss, every single move'],
 ['Tester','Defect first. If they hit back, apologise and copy them from then on. If they don’t, keep taking every other move']
];
const ANCHOR=6, ANCHOR_AT=4;           /* Tester sits at fourth */
const SLOTS=[1,2,3,5,6,7];             /* the six the room fills, in order */
let placed=[], locked=false;           /* rule indexes, in the order tapped */
const order=document.getElementById('order'), pool=document.getElementById('pool'), lock=document.getElementById('lock'), st=document.getElementById('st');
function render(){
  const at={};placed.forEach((r,i)=>at[SLOTS[i]]=r);at[ANCHOR_AT]=ANCHOR;
  order.innerHTML='';
  for(let k=1;k<=7;k++){
    const r=at[k];const d=document.createElement('div');
    d.className='slot'+(r===undefined?'':(k===ANCHOR_AT?' anchor':' filled'));
    d.innerHTML='<div class="n">'+k+'</div><div class="body">'+(r===undefined?'':'<div class="rn">'+RULES[r][0]+'</div><div class="rd">'+RULES[r][1]+'</div>')+'</div>';
    if(r!==undefined&&k!==ANCHOR_AT&&!locked)d.addEventListener('click',()=>{placed=placed.filter(x=>x!==r);render();});
    order.appendChild(d);
  }
  pool.innerHTML='';
  const left=RULES.map((_,i)=>i).filter(i=>i!==ANCHOR&&!placed.includes(i));
  if(left.length&&!locked){
    const h=document.createElement('div');h.className='ph';h.textContent=placed.length?'Next: who finishes '+['','first','second','third','','fifth','sixth','seventh'][SLOTS[placed.length]]+'?':'Who finishes first?';pool.appendChild(h);
    left.forEach(i=>{const b=document.createElement('button');b.className='opt';b.type='button';b.innerHTML='<span class="rn">'+RULES[i][0]+'</span><span class="rd">'+RULES[i][1]+'</span>';b.addEventListener('click',()=>{placed.push(i);render();});pool.appendChild(b);});
  }
  lock.disabled=locked||placed.length<6;
  document.body.classList.toggle('locked',locked);
}
lock.addEventListener('click',()=>{if(placed.length<6)return;locked=true;st.innerHTML='<b>Response locked in.</b> Results on the screen soon.';render();});
render();
</script></body></html>
