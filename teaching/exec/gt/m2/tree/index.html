<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Build your branch</title>
<link rel="stylesheet" href="/brand.css">
<style>
/* Module 2's closing exercise, one phone per group: a branch of the
   room's tree. The group names an outcome it wants at work and cannot
   reach on its own, names the other player, then grows a pruned game
   tree toward the outcome, one move at a time: what could you do (two or
   three options, tap the one you take, the rest are pruned), what could
   they do back (tap the one you expect), until the last response reaches
   the outcome or the moves run out. Each locked node is one line into
   room m2-tree, "key‖text", so the deck's tree grows while the room
   writes; the deck reads /entries and groups the lines by phone. Nothing
   locked can be changed, as with every poll. Lines per phone stay under
   the Worker's cap of fifteen: outcome, player, up to four moves of two
   lines, and the ending. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:22px 18px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tag{font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--muted)}
.tag i{display:inline-block;width:10px;height:10px;background:var(--red);margin-right:10px;vertical-align:middle}
h1{font-weight:700;font-size:22px;line-height:1.25;color:var(--red)}
.hint{font-weight:500;font-size:15px;line-height:1.4;color:var(--muted)}
/* the sapling: a vertical stem, your leaves to the left, theirs to the
   right, pruned options as faded twigs, the outcome as the leaf at the top */
.sap{width:100%;display:block;background:var(--paper-soft);border:2.5px solid var(--ink);border-radius:12px}
.sap text{font-family:var(--sans);font-weight:600;font-size:11.5px;fill:var(--ink)}
.sap text.lab{font-weight:700;font-size:9.5px;letter-spacing:.14em;fill:var(--muted)}
.sap text.you{fill:var(--teal)} .sap text.them{fill:var(--terracotta)}
.sap .stem{stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:round}
.sap .stem.todo{stroke:var(--rule);stroke-dasharray:3 5}
.sap .twig{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;transition:opacity .4s}
.sap .twig.you{stroke:var(--teal)} .sap .twig.them{stroke:var(--terracotta)}
.sap .pruned{opacity:.28}
.sap text.pruned{text-decoration:line-through}
.sap .node{fill:var(--paper-soft);stroke:var(--ink);stroke-width:2.5}
.sap .node.you{stroke:var(--teal)} .sap .node.them{stroke:var(--terracotta)}
.sap .leaf{fill:none;stroke:var(--rule);stroke-width:2.5;stroke-dasharray:3 4}
.sap .leaf.got{fill:var(--red);stroke:var(--red);stroke-dasharray:none}
.sap .leaf.lost{fill:none;stroke:var(--muted);stroke-dasharray:none}
.sap .cand{opacity:.55}
/* the questions */
.card{border:3px solid var(--side,var(--ink));border-radius:14px;background:var(--paper-soft);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.07)}
.card.you{--side:var(--teal)} .card.them{--side:var(--terracotta)} .card.goal{--side:var(--red)}
.card .suit{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;color:var(--side);padding-bottom:7px;border-bottom:2px solid var(--side)}
.card .pq{font-weight:600;font-size:16px;line-height:1.35}
.card textarea,.card input{font-family:var(--sans);font-weight:600;font-size:17px;line-height:1.35;color:var(--ink);background:transparent;border:0;border-bottom:1.5px dashed var(--rule);padding:6px 0 8px;width:100%;resize:vertical;outline:none}
.card textarea{min-height:76px}
.card textarea:focus,.card input:focus{border-bottom-color:var(--side)}
.card ::placeholder{color:var(--muted);font-weight:500}
.card .fcnt{font-weight:600;font-size:12px;color:var(--muted);text-align:right}
.optrow{display:flex;align-items:center;gap:10px}
.optrow .on{flex:none;font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--muted);width:18px}
.optrow input{flex:1}
.picks{display:flex;flex-direction:column;gap:8px}
.picks .plab{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--side)}
button.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;font-family:var(--sans);font-weight:600;font-size:16px;line-height:1.3;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);padding:12px 14px;cursor:pointer}
button.opt .sw{flex:none;width:26px;height:26px;background:var(--ink)}
button.opt.mine{background:var(--side);border-color:var(--side);color:var(--paper)}
button.opt.mine .sw{background:var(--paper)}
button.opt:disabled{opacity:.35;cursor:default}
button.lock{width:100%;font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:.1em;background:var(--red);border:2.5px solid var(--red);color:var(--paper);padding:15px 18px;cursor:pointer}
button.lock:disabled{background:var(--card);border-color:var(--ink);color:var(--ink);opacity:.45;cursor:default}
button.lock.quiet{background:var(--card);border-color:var(--ink);color:var(--ink)}
.status{font-weight:600;font-size:15px;color:var(--muted);min-height:1.4em}
.status b{color:var(--red)}
.links{display:flex;justify-content:flex-end;gap:22px}
.ptslink{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--red);text-decoration:none}
a.small{align-self:center;font-weight:600;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer}
</style>
</head><body>
<div class="wrap">
  <div class="tag"><i></i>APPLIED GAME THEORY · LIVE</div>
  <h1 id="q">Build your branch</h1>
  <div class="hint" id="hint">One phone per group. Your branch grows on the screen as you lock each step.</div>
  <svg class="sap" id="sap" viewBox="0 0 340 200" aria-hidden="true"></svg>
  <div id="opts"></div>
  <div class="status" id="status"></div>
  <div class="links"><a class="ptslink" href="/go/points/">MY POINTS &rarr;</a></div>
</div>
<script>
const API='https://gt-poll.rlamare.workers.dev', ROOM='m2-tree', KEY='gt-tree-'+ROOM;
const MAXMOVES=4, OPTMAX=48, LONGMAX=110;
let voter=null;
try{
  voter=localStorage.getItem('gt-voter');
  if(!voter){voter=([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
    localStorage.setItem('gt-voter',voter);}
}catch(_){voter='v'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);}
/* the branch so far; stage is what the phone is asking for next */
let T={o:'',p:'',moves:[],end:null,stage:'o'};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.stage)T=s;}catch(_){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(T));}catch(_){}};
const E=id=>document.getElementById(id);
const clean=t=>String(t||'').replace(/[|‖]/g,'/').replace(/\s+/g,' ').trim();
const cut=(t,n)=>t.length>n?t.slice(0,n-1).trim()+'…':t;
function say(line){
  return fetch(API+'/p/'+ROOM+'/say',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({t:line,v:voter})}).then(r=>{if(!r.ok)throw r.status;});
}
const fail=code=>{E('status').textContent=code===429?'That’s plenty from one phone — thank you!':'That didn’t send — try again.';};

/* ---- the sapling ---- */
/* candidates: options being typed at the node not yet locked, drawn faint */
function drawSap(cand){
  const nodes=[];
  T.moves.forEach((m,i)=>{
    if(m.y)nodes.push({side:'you',opts:m.y.opts,pick:m.y.pick,n:i+1});
    if(m.t)nodes.push({side:'them',opts:m.t.opts,pick:m.t.pick,n:i+1});
  });
  if(cand)nodes.push(cand);
  const P=40, n=nodes.length, rows=Math.max(n,2);
  const H=70+(rows+1)*P, X=175, y0=H-38;
  const yAt=k=>y0-k*P;
  const gy=yAt(rows+1)+4;
  let s='';
  const done=T.stage==='done';
  /* stem: solid up to the last node, then dashed to the leaf */
  s+='<path class="stem" d="M'+X+' '+y0+' L'+X+' '+(n?yAt(n):y0)+'"/>';
  s+='<path class="stem todo'+(T.end===1?' got':'')+'" d="M'+X+' '+(n?yAt(n):y0)+' L'+X+' '+(gy+14)+'"/>';
  if(T.end===1)s+='<path class="stem" d="M'+X+' '+yAt(n)+' L'+X+' '+(gy+14)+'"/>';
  /* root */
  s+='<circle class="node" cx="'+X+'" cy="'+y0+'" r="6"/>';
  s+='<text class="lab" x="'+(X+14)+'" y="'+(y0+4)+'">YOU, TODAY</text>';
  if(T.p)s+='<text class="lab" x="'+X+'" y="'+(y0+24)+'" text-anchor="middle">VS '+esc(cut(T.p,30).toUpperCase())+'</text>';
  /* the leaf at the top */
  const lc=T.end===1?'got':T.end===0?'lost':'';
  s+='<path class="leaf '+lc+'" d="M'+X+' '+(gy+14)+' C'+(X-22)+' '+(gy+2)+' '+(X-14)+' '+(gy-22)+' '+X+' '+(gy-24)+' C'+(X+14)+' '+(gy-22)+' '+(X+22)+' '+(gy+2)+' '+X+' '+(gy+14)+' Z"/>';
  const ol=T.o?wrap(T.o,24,2):['the outcome'];
  s+='<text class="lab" x="'+(X+30)+'" y="'+(gy-14)+'">THE OUTCOME</text>';
  ol.forEach((ln,i)=>{s+='<text x="'+(X+30)+'" y="'+(gy+2+i*14)+'" style="'+(T.o?'':'fill:var(--muted);font-weight:500')+'">'+esc(ln)+'</text>';});
  nodes.forEach((nd,k)=>{
    const y=yAt(k+1), left=nd.side==='you', dir=left?-1:1, isCand=nd===cand;
    const tx=X+dir*30, anchor=left?'end':'start';
    nd.opts.forEach((o,j)=>{
      const chosen=nd.pick===j, dy=(j-(nd.opts.length-1)/2)*15;
      const cls='twig '+nd.side+(isCand?' cand':chosen?'':' pruned');
      s+='<path class="'+cls+'" d="M'+X+' '+y+' Q'+(X+dir*14)+' '+(y+dy)+' '+(X+dir*26)+' '+(y+dy)+'"/>';
      s+='<text class="'+(isCand?'cand':chosen?nd.side:'pruned')+'" x="'+tx+'" y="'+(y+dy+4)+'" text-anchor="'+anchor+'" style="font-size:'+(chosen&&!isCand?'11':'9.5')+'px">'+esc(cut(o,chosen&&!isCand?24:20))+'</text>';
    });
    s+='<circle class="node '+nd.side+'" cx="'+X+'" cy="'+y+'" r="5.5"/>';
    if(!nd.opts.length)s+='<text class="lab" x="'+tx+'" y="'+(y+4)+'" text-anchor="'+anchor+'">'+(left?'MOVE '+nd.n:esc(cut(T.p,14).toUpperCase()))+'</text>';
  });
  const sap=E('sap');sap.setAttribute('viewBox','0 0 340 '+H);sap.innerHTML=s;
}
/* a few words per line, at most `max` lines, the last one cut */
function wrap(t,w,max){const out=[];let line='';t.split(' ').forEach(word=>{if((line+' '+word).trim().length>w&&line){out.push(line);line=word;}else line=(line+' '+word).trim();});if(line)out.push(line);if(out.length>max){out.length=max;out[max-1]=cut(out[max-1]+'…',w);}return out;}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ---- the questions, one stage at a time ---- */
function render(){
  const opts=E('opts');opts.innerHTML='';
  const q=E('q'), hint=E('hint');
  const st=E('status');st.textContent='';
  if(T.stage==='o'){
    q.textContent='Build your branch';
    hint.textContent='One phone per group. Your branch grows on the screen as you lock each step.';
    longCard(opts,'goal','THE OUTCOME','What is an outcome you want at work that you cannot get to on your own?',t=>{
      T.o=t;return say('o‖'+t).then(()=>{T.stage='p';save();render();});
    });
  }else if(T.stage==='p'){
    q.textContent='The other player';
    hint.textContent='The person, or the side, whose moves decide whether you get there.';
    shortCard(opts,'them','THE OTHER PLAYER','Who is the other player in this game?',60,t=>{
      T.p=t;return say('p‖'+t).then(()=>{T.moves.push({});T.stage='y';save();render();});
    });
  }else if(T.stage==='y'||T.stage==='t'){
    const i=T.moves.length, you=T.stage==='y';
    q.textContent='Move '+i+(you?': your move':': their move');
    hint.textContent=you?'Write two or three things you could do here. Then tap the one you would actually do; the others are pruned.'
                        :'Write two or three things '+T.p+' could do back. Then tap the one you expect; the others are pruned.';
    optionsCard(opts,you?'you':'them',you?'WHAT COULD YOU DO?':'WHAT COULD '+cut(T.p,24).toUpperCase()+' DO BACK?',you,(list,pick)=>{
      const key=(you?'y':'t')+i;
      return say(key+'‖'+pick+'|'+list.join('|')).then(()=>{
        T.moves[i-1][you?'y':'t']={opts:list,pick};
        T.stage=you?'t':'after';save();render();
      });
    });
  }else if(T.stage==='after'){
    const i=T.moves.length;
    q.textContent='Does that get you there?';
    hint.textContent='If '+T.p+' does what you expect, are you at your outcome?';
    const b1=btn('YES, THAT REACHES THE OUTCOME','lock',()=>{b1.disabled=true;st.textContent='Sending…';
      say('e‖1').then(()=>{T.end=1;T.stage='done';save();render();}).catch(c=>{fail(c);b1.disabled=false;});});
    opts.appendChild(b1);
    if(i<MAXMOVES){
      const b2=btn('NOT YET: ANOTHER MOVE','lock quiet',()=>{T.moves.push({});T.stage='y';save();render();});
      opts.appendChild(b2);
    }else{
      const b3=btn('WE RUN OUT OF MOVES BEFORE WE GET THERE','lock quiet',()=>{b3.disabled=true;st.textContent='Sending…';
        say('e‖0').then(()=>{T.end=0;T.stage='done';save();render();}).catch(c=>{fail(c);b3.disabled=false;});});
      opts.appendChild(b3);
    }
    if(i<MAXMOVES){
      const a=document.createElement('a');a.className='small';a.textContent='We can’t get there from here';
      a.addEventListener('click',()=>{st.textContent='Sending…';
        say('e‖0').then(()=>{T.end=0;T.stage='done';save();render();}).catch(fail);});
      opts.appendChild(a);
    }
    opts.style.display='flex';opts.style.flexDirection='column';opts.style.gap='12px';
  }else{
    q.textContent='Your branch is on the tree';
    hint.textContent=T.end===1?'Your last move reaches the outcome. Look up at the screen.':'Your branch stops short of the outcome. That is worth talking about; look up at the screen.';
  }
  drawSap(null);
}
function btn(label,cls,fn){const b=document.createElement('button');b.className=cls;b.textContent=label;b.addEventListener('click',fn);return b;}
function lockBtn(){return btn('LOCK IT IN','lock',null);}
function longCard(opts,side,suit,question,onLock){
  const c=card(side,suit,question);
  const ta=document.createElement('textarea');ta.maxLength=LONGMAX;ta.placeholder='Write it here…';ta.autocomplete='off';
  const cnt=document.createElement('div');cnt.className='fcnt';cnt.textContent='0 / '+LONGMAX;
  ta.addEventListener('input',()=>{cnt.textContent=ta.value.length+' / '+LONGMAX;lk.disabled=!clean(ta.value);});
  const lk=lockBtn();lk.disabled=true;
  lk.addEventListener('click',()=>{const t=clean(ta.value);if(!t)return;lk.disabled=true;ta.disabled=true;E('status').textContent='Sending…';
    onLock(t).catch(c=>{fail(c);lk.disabled=false;ta.disabled=false;});});
  c.appendChild(ta);c.appendChild(cnt);opts.appendChild(c);opts.appendChild(lk);ta.focus();
}
function shortCard(opts,side,suit,question,max,onLock){
  const c=card(side,suit,question);
  const inp=document.createElement('input');inp.maxLength=max;inp.placeholder='A name, or a role…';inp.autocomplete='off';
  const lk=lockBtn();lk.disabled=true;
  inp.addEventListener('input',()=>{lk.disabled=!clean(inp.value);});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!lk.disabled)lk.click();}});
  lk.addEventListener('click',()=>{const t=clean(inp.value);if(!t)return;lk.disabled=true;inp.disabled=true;E('status').textContent='Sending…';
    onLock(t).catch(c=>{fail(c);lk.disabled=false;inp.disabled=false;});});
  c.appendChild(inp);opts.appendChild(c);opts.appendChild(lk);inp.focus();
}
/* two or three options typed, then one tapped: the sapling shows the
   candidates as they are typed and prunes the others on the tap */
function optionsCard(opts,side,suit,you,onLock){
  const c=card(side,suit,null);
  const inputs=[];
  for(let j=0;j<3;j++){
    const row=document.createElement('div');row.className='optrow';
    row.innerHTML='<span class="on">'+(j+1)+'</span>';
    const inp=document.createElement('input');inp.maxLength=OPTMAX;inp.placeholder=j<2?'Option '+(j+1)+'…':'Option 3 (if you have one)…';inp.autocomplete='off';
    row.appendChild(inp);c.appendChild(row);inputs.push(inp);
  }
  const picks=document.createElement('div');picks.className='picks';
  picks.innerHTML='<div class="plab">'+(you?'Tap the one you would do':'Tap the one you expect')+'</div>';
  const pbtns=[];
  for(let j=0;j<3;j++){
    const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="sw"></span><span></span>';b.disabled=true;
    b.addEventListener('click',()=>{pick=j;pbtns.forEach((x,k)=>x.classList.toggle('mine',k===j));sync();});
    picks.appendChild(b);pbtns.push(b);
  }
  let pick=-1;
  const lk=lockBtn();lk.disabled=true;
  const list=()=>inputs.map(i=>clean(i.value));
  function sync(){
    const L=list();
    pbtns.forEach((b,j)=>{b.lastChild.textContent=L[j]||'…';b.disabled=!L[j];if(!L[j]&&pick===j)pick=-1;b.classList.toggle('mine',pick===j);});
    const filled=L.filter(Boolean);
    lk.disabled=!(filled.length>=2&&pick>=0&&L[pick]);
    const cand={side:you?'you':'them',opts:filled,pick:-1,n:T.moves.length};
    drawSap(filled.length?cand:null);
  }
  inputs.forEach(i=>i.addEventListener('input',sync));
  lk.addEventListener('click',()=>{
    const L=list(); const kept=[]; let p=-1;
    L.forEach((t,j)=>{if(t){if(j===pick)p=kept.length;kept.push(t);}});
    if(kept.length<2||p<0)return;
    lk.disabled=true;inputs.forEach(i=>i.disabled=true);pbtns.forEach(b=>b.disabled=true);E('status').textContent='Sending…';
    onLock(kept,p).catch(cd=>{fail(cd);lk.disabled=false;inputs.forEach(i=>i.disabled=false);pbtns.forEach((b,j)=>b.disabled=!clean(inputs[j].value));});
  });
  c.appendChild(picks);opts.appendChild(c);opts.appendChild(lk);inputs[0].focus();
  opts.style.display='flex';opts.style.flexDirection='column';opts.style.gap='12px';
}
function card(side,suit,question){
  const c=document.createElement('div');c.className='card '+side;
  c.innerHTML='<div class="suit"></div>'+(question?'<div class="pq"></div>':'');
  c.querySelector('.suit').textContent=suit;if(question)c.querySelector('.pq').textContent=question;
  E('opts').style.display='flex';E('opts').style.flexDirection='column';E('opts').style.gap='12px';
  return c;
}
render();
</script>
</body></html>
