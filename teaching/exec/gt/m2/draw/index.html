<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Chart your course of action</title>
<link rel="stylesheet" href="/brand.css">
<style>
/* Module 2's closing exercise as a form (Ryan, 20 Sep 2026): one phone per
   pair fills in the eight boxes of the blank tree on the slide, the outcome
   they want, who else is in the game, two opening moves, and two reactions to
   each, and the tree goes up on the deck's wall of trees for the debrief. No
   payoffs, no role play, no rules: a form. It replaces pen and paper, which
   was the suite's only one. (The two-phone role play of 14 Sep is still at
   m2/tree/, cut on 19 Sep; this is not that.)

   Wire: three lines into room m2-trees, read back per phone through /entries,
   the latest of each kind winning, so an edited tree replaces the old one:
     "1‖name‖outcome‖who"
     "2‖first move‖reaction‖other reaction"
     "3‖second move‖reaction‖other reaction"
   The Worker keeps 200 characters a line and 15 lines a phone, hence three
   short lines and five sends. The draft lives in this phone's storage, so a
   reload loses nothing. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:22px 18px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tag{font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--muted)}
.tag i{display:inline-block;width:10px;height:10px;background:var(--red);margin-right:10px;vertical-align:middle}
h1{font-weight:700;font-size:24px;line-height:1.25;color:var(--red)}
button.pick{display:block;text-align:left;width:100%;font-family:var(--sans);font-weight:600;
  font-size:17px;line-height:1.35;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);
  padding:15px 18px;cursor:pointer}
.choices{display:flex;flex-direction:column;gap:11px}
.namerow{display:flex;gap:10px}
.namerow input{flex:1;font-family:var(--sans);font-weight:600;font-size:17px;color:var(--ink);
  background:var(--card);border:2.5px solid var(--ink);padding:14px 16px;min-width:0}
.namerow button{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:.08em;
  background:var(--red);border:2.5px solid var(--red);color:var(--paper);padding:14px 20px;cursor:pointer}
.me{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.me .who{font-weight:700;font-size:16px}
.me .who b{color:var(--red)}
.me button{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  background:none;border:none;color:var(--muted);cursor:pointer;text-decoration:underline}
.status{font-weight:600;font-size:15px;color:var(--muted);min-height:1.4em}
.send{font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:.08em;
  background:var(--red);border:2.5px solid var(--red);color:var(--paper);padding:15px 0;width:100%;cursor:pointer}
.send:disabled{opacity:.4;cursor:default}
/* the form is the tree on its side: a box, and its branches indented under it */
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted)}
.f input{width:100%;font-family:var(--sans);font-weight:600;font-size:17px;color:var(--ink);
  background:var(--card);border:2.5px solid var(--ink);padding:12px 14px;border-radius:0}
.f input:focus{outline:3px solid var(--red);outline-offset:1px}
.branch{display:flex;flex-direction:column;gap:12px}
.kids{display:flex;flex-direction:column;gap:10px;margin-left:14px;padding-left:16px;border-left:3px solid var(--ink)}
.done{border:2.5px solid var(--ink);background:var(--card);padding:22px;text-align:center;font-weight:700;font-size:20px}
.done span{display:block;font-weight:600;font-size:15px;color:var(--muted);margin-top:8px}
</style>
</head><body>
<div class="wrap">
  <div class="tag"><i></i>APPLIED GAME THEORY · MODULE 2</div>
  <h1 id="q">&hellip;</h1>
  <div id="app"></div>
  <div class="status" id="status"></div>
</div>
<script src="/go/names.js"></script>
<script>
const API='https://gt-poll.rlamare.workers.dev', ROOM='m2-trees';
let voter=null;
try{
  voter=localStorage.getItem('gt-voter');
  if(!voter){voter=([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
    localStorage.setItem('gt-voter',voter);}
}catch(_){voter='v'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);}
let name=null;
try{name=localStorage.getItem('gt-name');}catch(_){}
const q=document.getElementById('q'), app=document.getElementById('app'), st=document.getElementById('status');
const clean=n=>n.trim().replace(/[|‖]/g,' ').replace(/\s+/g,' ').slice(0,30);
let roster=[];
fetch('/go/roster.json').then(r=>r.json()).then(d=>{roster=d.names||[];render();}).catch(()=>{render();});
function claimOnce(){
  let done=false;
  try{done=localStorage.getItem('gt-claimed')===name;}catch(_){}
  if(done||!name)return;
  fetch(API+'/p/gt-names/say',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({t:name,v:voter})})
  .then(r=>{if(r.ok){try{localStorage.setItem('gt-claimed',name);}catch(_){}}})
  .catch(()=>{});
}
const say=line=>fetch(API+'/p/'+ROOM+'/say',{method:'POST',headers:{'content-type':'application/json'},
  body:JSON.stringify({t:line,v:voter})}).then(r=>{if(!r.ok)throw r.status;});

/* the eight boxes, in the order of the slide's questions */
const BOXES=[['o','What outcome would you like to achieve?',80],['w','Who else is in this game?',40],
  ['m1','Your first opening move',45],['r11','How they react',45],['r12','Or how else they react',45],
  ['m2','Your second opening move',45],['r21','How they react',45],['r22','Or how else they react',45]];
let draft={};
try{draft=JSON.parse(localStorage.getItem('m2-draw-draft')||'{}')||{};}catch(_){}
const keep=()=>{try{localStorage.setItem('m2-draw-draft',JSON.stringify(draft));}catch(_){}};

function render(){
  st.textContent='';
  if(!name){renderName();return;}
  let sent=false;
  try{sent=localStorage.getItem('m2-draw-sent')==='1';}catch(_){}
  sent?renderDone():renderForm();
}
function renderName(){
  q.textContent='Who are you?';
  app.innerHTML='';
  const done=n=>GT_NAMES.guard(n,voter,m=>{
    name=m;try{localStorage.setItem('gt-name',name);}catch(_){}
    claimOnce();render();
  },app,{clean});
  const list=document.createElement('div');list.className='choices';
  roster.forEach(n=>{
    const b=document.createElement('button');b.className='pick';b.textContent=n;
    b.addEventListener('click',()=>done(clean(n)));
    list.appendChild(b);
  });
  app.appendChild(list);
  const row=document.createElement('div');row.className='namerow';row.style.marginTop=roster.length?'12px':'0';
  const inp=document.createElement('input');
  inp.maxLength=30;inp.placeholder=roster.length?'Not on the list? Type the name':'Type the first name';
  inp.autocomplete='off';
  const btn=document.createElement('button');btn.textContent='OK';
  const go=()=>{const v=clean(inp.value);if(v)done(v);};
  btn.addEventListener('click',go);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
  row.appendChild(inp);row.appendChild(btn);
  app.appendChild(row);
}
function meRow(){
  const me=document.createElement('div');me.className='me';
  me.innerHTML='<span class="who">Charting as <b></b></span><button type="button">change</button>';
  me.querySelector('b').textContent=name;
  me.querySelector('button').addEventListener('click',()=>{name=null;try{localStorage.removeItem('gt-name');}catch(_){}render();});
  return me;
}
function renderForm(){
  claimOnce();
  q.textContent='Chart your course of action';
  app.innerHTML='';
  app.appendChild(meRow());
  const form=document.createElement('div');form.className='branch';form.style.marginTop='14px';
  const send=document.createElement('button');send.className='send';send.type='button';send.textContent='PUT IT ON THE SCREEN';
  const full=()=>BOXES.every(([k])=>(draft[k]||'').trim());
  const box=([k,label,max])=>{
    const f=document.createElement('div');f.className='f';
    const l=document.createElement('label');l.textContent=label;l.htmlFor='b-'+k;
    const i=document.createElement('input');i.id='b-'+k;i.maxLength=max;i.autocomplete='off';i.value=draft[k]||'';
    i.addEventListener('input',()=>{draft[k]=i.value;keep();send.disabled=!full();});
    f.appendChild(l);f.appendChild(i);return f;
  };
  form.appendChild(box(BOXES[0]));form.appendChild(box(BOXES[1]));
  [[2,3,4],[5,6,7]].forEach(([m,a,b])=>{
    const br=document.createElement('div');br.className='branch';
    br.appendChild(box(BOXES[m]));
    const kids=document.createElement('div');kids.className='kids';
    kids.appendChild(box(BOXES[a]));kids.appendChild(box(BOXES[b]));
    br.appendChild(kids);form.appendChild(br);
  });
  app.appendChild(form);
  send.style.marginTop='16px';send.disabled=!full();
  send.addEventListener('click',()=>{
    send.disabled=true;st.textContent='Sending…';
    const t=k=>String(draft[k]||'').replace(/[|‖]/g,' ').replace(/\s+/g,' ').trim();
    say('1‖'+name+'‖'+t('o')+'‖'+t('w'))
      .then(()=>say('2‖'+t('m1')+'‖'+t('r11')+'‖'+t('r12')))
      .then(()=>say('3‖'+t('m2')+'‖'+t('r21')+'‖'+t('r22')))
      .then(()=>{try{localStorage.setItem('m2-draw-sent','1');}catch(_){}render();})
      .catch(code=>{send.disabled=false;st.textContent=code===429?'That’s plenty from one phone — flag the instructor.':'That didn’t send — try again.';});
  });
  app.appendChild(send);
}
function renderDone(){
  q.textContent='Chart your course of action';
  app.innerHTML='';
  const d=document.createElement('div');d.className='done';
  d.innerHTML='Your tree is on the screen<span></span>';
  d.querySelector('span').textContent=draft.o||'';
  app.appendChild(d);
  const again=document.createElement('button');again.className='send';again.type='button';again.style.marginTop='14px';
  again.textContent='CHANGE IT';
  again.addEventListener('click',()=>{try{localStorage.removeItem('m2-draw-sent');}catch(_){}render();});
  app.appendChild(again);
}
</script>
</body></html>
