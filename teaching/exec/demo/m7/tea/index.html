/* The one code on the screen lands here, and so does ryanlamare.com/go.
   Each person types their own first name and their partner's; the two names
   decide the side, the same way on both phones, so a pair always gets one
   brief each without anything being sent: whoever comes first in the
   alphabet plays Hartwell's. A phone that already holds a brief goes back to
   it. The same landing as Module 3's negotiation (m3/lot/), 27 Sep 2026. */
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none !important}
.briefwrap{display:flex;flex-direction:column;gap:20px}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);padding:26px 18px 60px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.tag{font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--muted)}
.tag i{display:inline-block;width:10px;height:10px;background:var(--red);margin-right:10px;vertical-align:middle}
.side{display:flex;flex-direction:column;gap:4px;padding-bottom:12px;border-bottom:3px solid currentColor}
.side .n{font-family:var(--display);font-weight:900;font-size:30px;line-height:1.08;text-transform:uppercase}
.side .k{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--ink)}
.side .who{font-weight:600;font-size:15px;color:var(--ink)}
.ht{color:var(--terracotta)} .sw{color:var(--teal)}
.shelf{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.memo{border:2.5px solid var(--ink);background:var(--card);padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.memo .hd{display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:3px;font-size:14px;padding-bottom:12px;border-bottom:1.5px solid var(--rule)}
.memo .hd b{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted);align-self:center}
.memo p{font-weight:500;font-size:17px}
.obj{border:2.5px solid var(--red);padding:15px 18px;font-weight:700;font-size:18px;text-align:center}
.locked{border:2.5px dashed var(--muted);padding:18px;font-weight:600;font-size:16px;color:var(--muted)}
.locked a{color:var(--red);font-weight:700}
.form{display:flex;flex-direction:column;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px}
.form input:not([type=checkbox]),.form textarea{font:inherit;font-weight:500;font-size:17px;line-height:1.4;padding:11px 13px;border:2.5px solid var(--ink);border-radius:0;background:var(--paper-soft);color:var(--ink);width:100%;-webkit-appearance:none;appearance:none}
.form textarea{resize:vertical}
.form label.nodeal{flex-direction:row;align-items:center;gap:12px;font-weight:600;cursor:pointer}
.form label.nodeal input{width:24px;height:24px;flex:none;accent-color:var(--red);margin:0}
.form input:not([type=checkbox]):focus,.form textarea:focus{outline:3px solid var(--red);outline-offset:0}
.pctrow{display:flex;align-items:center;gap:10px}
.pctrow input{max-width:130px}
.pctrow b{font-family:var(--display);font-weight:900;font-size:26px}
.ask{display:flex;flex-direction:column;gap:10px}
.ask .aq{font-weight:700;font-size:16px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{font-family:var(--sans);font-weight:800;font-size:16px;letter-spacing:.14em;background:var(--paper-soft);color:var(--ink);border:2.5px solid var(--ink);border-radius:0;padding:13px 10px;cursor:pointer}
.yn button.on{background:var(--ink);color:var(--paper)}
.btn{font-family:var(--sans);font-weight:800;font-size:16px;letter-spacing:.14em;text-transform:uppercase;background:var(--red);color:var(--paper);border:none;border-radius:0;padding:15px 18px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-weight:600;font-size:15px;color:var(--red)}
.msg:empty{display:none}
.swap{text-align:center;font-weight:500;font-size:14px}
.swap a{color:var(--muted)}
.hint{font-weight:500;font-size:15px;color:var(--muted);text-align:center}
.report{border:2.5px solid var(--ink);background:var(--card);padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.report .rt{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--red)}
.report .rn{font-weight:500;font-size:16px}
.report .done{font-weight:600;font-size:17px;border:2.5px solid var(--green);color:var(--green);padding:14px 16px}
@media (max-width:520px){.side .n{font-size:24px}.memo,.report{padding:16px}.memo p{font-size:16px}}
</style>

<script src="/teaching/exec/demo/go/names.js"></script>
<script>
(function(){
  const KEY='gt-m7-tea', PAIR='gt-m7-tea-pair';
  try{
    if(new URLSearchParams(location.search).has('fresh')){localStorage.removeItem(KEY);localStorage.removeItem(PAIR);}
    const h=localStorage.getItem(KEY);
    if(h==='h2x'||h==='s9k'){location.replace(h+'/');return;}
  }catch(_){}
  const f=document.getElementById('names'), me=document.getElementById('me'), them=document.getElementById('them'), msg=document.getElementById('msg');
  f.hidden=false;
  try{const n=localStorage.getItem('gt-name');if(n)me.value=n;}catch(_){}
  GT_NAMES.roster().then(ns=>{
    if(!ns.length)return;
    const dl=document.createElement('datalist');dl.id='gt-roster-list';
    ns.forEach(n=>{const o=document.createElement('option');o.value=n;dl.appendChild(o);});
    document.body.appendChild(dl);me.setAttribute('list',dl.id);them.setAttribute('list',dl.id);
  });
  const clean=s=>s.trim().replace(/\s+/g,' ').slice(0,30);
  const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
  f.addEventListener('submit',e=>{
    e.preventDefault();
    const a=clean(me.value), b=clean(them.value), x=norm(a), y=norm(b);
    if(!x||!y){msg.textContent='Type both names.';return;}
    if(x===y){msg.textContent='You two share a name. Add an initial to each, the same way on both phones.';return;}
    const k=x<y?'h2x':'s9k';
    try{localStorage.setItem(KEY,k);localStorage.setItem(PAIR,JSON.stringify({me:a,them:b}));}catch(_){}
    location.replace(k+'/');
  });
})();
</script>
