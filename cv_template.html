<!doctype html><html lang='en'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>J. Ryan Lamare — Curriculum Vitae</title>
<!-- EDIT TIP: this single file is the source for BOTH the web CV and the PDF.
     Edit text/data in cv_data.py, run `python3 build_cv.py` to regenerate
     cv/index.html, and (optionally) make the downloadable PDF with:
       weasyprint cv/index.html Lamare-CV.pdf
     Screen uses @media screen; the PDF uses @media print/@page — one file. -->
<style>
/* ONE source, TWO renderings:
     @media screen        -> the web CV (responsive) — the primary version
     @media print / @page -> the downloadable PDF (weasyprint reads these)

   Typography (restyled Sept 2026 for legibility): ONE typeface, Source Serif 4,
   for everything in the CV proper — text, years, headings. Headings are plain
   bold with a hairline rule, like a classic economics / industrial relations
   CV; no tracked sans labels, no monospace, no ornaments. The only colour is
   the red rule under the name. The site nav (screen only) keeps the site's
   label face from /brand.css.
   The `ital,` entries matter: without real italic faces, <i> renders upright. */
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap');

:root{
  --paper:#E9E2D2; --ink:#1B1C19; --red:#CE1E32;
  --accent:var(--red); --soft:#5C554E;
  --cvrule:#1B1C19; --hair:rgba(27,28,25,.22);
  --line:rgba(27,28,25,.14);
  --serif:'Source Serif 4','Georgia','Times New Roman',serif;
  --label:'Jost','Arial',sans-serif;
  --maxw:52rem;
}

*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:var(--serif); color:var(--ink); background:var(--paper); }
a{ color:inherit; text-decoration:none; }
.it .me{ font-weight:700; }
.pagebreak{ break-before:page; }

/* ===================== SCREEN: the web CV ===================== */
@media screen{
  body{ background:#FDFCFA; font-size:1.08rem; line-height:1.5; }
  .site-nav{ position:sticky; top:0; z-index:20; background:rgba(253,252,250,.9);
             -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
             border-bottom:1px solid var(--line); }
  .nav-inner{ max-width:var(--maxw); margin:0 auto; padding:.9rem 2rem;
              display:flex; align-items:center; justify-content:space-between; gap:1rem; }
  .nav-home{ font-family:var(--label); font-weight:700; text-transform:uppercase;
             letter-spacing:.12em; font-size:.72rem; }
  .nav-home:hover{ color:var(--accent); }
  .nav-dl{ font-family:var(--label); font-weight:500; text-transform:uppercase;
           letter-spacing:.1em; font-size:.7rem; border:1px solid var(--ink);
           padding:.5rem .95rem; transition:background .2s,color .2s; }
  .nav-dl:hover{ background:var(--ink); color:var(--paper); }

  .cv{ max-width:var(--maxw); margin:0 auto; padding:3rem 2rem 3.5rem; }

  .head{ display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap;
         border-bottom:3px solid var(--accent); padding-bottom:.6rem; }
  .name{ font-weight:700; font-size:2.4rem; letter-spacing:.01em; line-height:1; text-transform:uppercase; }
  .updated{ font-size:.85rem; color:var(--soft); padding-bottom:.2rem; }
  .role{ font-weight:600; font-size:1.15rem; margin-top:1rem; }
  .dept{ font-size:1.05rem; margin-top:.1rem; }
  .contact{ font-size:1rem; margin-top:.55rem; line-height:1.6; color:var(--soft); }
  .contact a{ border-bottom:1px solid var(--hair); }
  .contact a:hover{ color:var(--accent); border-bottom-color:var(--accent); }

  h2{ font-size:1rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
      margin:2.4rem 0 .8rem; padding-bottom:.3rem; border-bottom:1px solid var(--cvrule); }
  h3{ font-size:1.05rem; font-weight:700; margin:1.3rem 0 .45rem; }
  .note{ font-weight:600; margin:.9rem 0 .3rem; }
  .note:first-of-type{ margin-top:.3rem; }

  .row{ display:flex; gap:1.2rem; margin:0 0 .5rem; }
  .yr{ flex:0 0 6.2rem; color:var(--soft); white-space:nowrap; }
  .it{ flex:1; }
  .rowlink .lt{ text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; text-decoration-color:var(--hair); }
  .rowlink:hover .lt{ color:var(--accent); text-decoration-color:var(--accent); }

  .web-footer{ max-width:var(--maxw); margin:0 auto; padding:2rem; border-top:1px solid var(--line);
               font-family:var(--label); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
               color:var(--soft); display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
}
@media screen and (max-width:640px){
  .name{ font-size:1.9rem; }
  .cv{ padding:2rem 1.2rem 3rem; }
  .nav-inner{ padding:.8rem 1.2rem; }
  .row{ flex-direction:column; gap:.05rem; }
  .yr{ flex-basis:auto; }
}

/* ===================== PRINT: the PDF (weasyprint) ===================== */
@page{
  size:A4; margin:16mm 18mm 17mm 18mm;
  @bottom-left{ content:"J. Ryan Lamare \00B7 Curriculum Vitae"; font-family:'Source Serif 4','Georgia',serif; font-size:8pt; color:#777; }
  @bottom-right{ content:counter(page) " / " counter(pages); font-family:'Source Serif 4','Georgia',serif; font-size:8pt; color:#777; }
}
@media print{
  /* Same face as the screen. Black text on white, 10pt, the classic CV page.
     Sizes are in pt; nothing here is inherited from the screen block. */
  body{ background:#fff; color:#111; font-size:10pt; line-height:1.35; }
  a{ color:inherit; }
  .site-nav, .web-footer{ display:none !important; }
  .cv{ max-width:none; margin:0; padding:0; }
  .head{ display:flex; justify-content:space-between; align-items:flex-end;
         border-bottom:2.5pt solid var(--accent); padding-bottom:5pt; }
  .name{ font-weight:700; font-size:21pt; letter-spacing:.01em; text-transform:uppercase; line-height:1; }
  .updated{ font-size:8.5pt; color:#666; padding-bottom:1pt; }
  .role{ font-weight:600; font-size:11pt; margin-top:7pt; }
  .dept{ font-size:10pt; margin-top:1pt; }
  .contact{ font-size:9.5pt; margin-top:4pt; line-height:1.4; color:#444; }
  h2{ font-size:10pt; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
      margin:13pt 0 5pt; padding-bottom:2pt; border-bottom:.7pt solid #111; }
  h3{ font-size:10pt; font-weight:700; margin:8pt 0 3pt; }
  .note{ font-weight:600; margin:6pt 0 2pt; }
  .note:first-of-type{ margin-top:2pt; }
  .row{ display:flex; gap:9pt; margin:0 0 3.5pt; }
  .yr{ flex:0 0 5.3em; color:#555; white-space:nowrap; }
  .it{ flex:1; }
  h2, h3, .note, .row{ break-inside:avoid; }
  h2, h3, .note{ break-after:avoid; }
}
</style>
<link rel="stylesheet" href="/brand.css">
</head><body>
<nav class="site-nav"><div class="nav-inner"><a class="nav-home" href="/">&larr; Back to site</a><a class="nav-dl" href="#" onclick="event.preventDefault();window.print();">Save as PDF</a></div></nav>

</main>
<footer class="web-footer"><span>&copy; 2026 J. Ryan Lamare</span><span>London School of Economics</span></footer>
</body></html>
