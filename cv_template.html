<!doctype html><html lang='en'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>J. Ryan Lamare — Curriculum Vitae</title>
<!-- EDIT TIP: this single file is the source for BOTH the web CV and the PDF.
     Edit text/data in build_cv.py, run `python3 build_cv.py` to regenerate
     cv.html, and (optionally) make the downloadable PDF with:
       weasyprint cv.html Lamare-CV.pdf
     Screen uses @media screen; the PDF uses @media print/@page — one file. -->
<style>
/* ONE source, TWO renderings:
     @media screen        -> the web CV (on-brand, responsive) — the primary version
     @media print / @page -> the downloadable PDF (weasyprint reads these)
   Fonts: Source Serif 4 (body/name) + Arimo (labels/years), a standard academic
   pairing. Colours mirror brand.css; /brand.css is also linked in <head> so the
   served page stays in sync with the rest of the site (the inline values below let
   the PDF render even when that file isn't reachable, e.g. local weasyprint). */
/* Screen uses Source Serif 4 + Arimo; the PDF uses Archivo + IBM Plex Mono.
   The `ital,` entries matter: without real italic faces, <i> renders upright. */
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Arimo:wght@400;500;700&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --paper:#E9E2D2; --paper-soft:#F0EAD9; --card:#DFD6C2; --rule:#CDBFA6;
  --ink:#1B1C19; --muted:#6A5F59; --red:#CE1E32;
  --accent:var(--red); --soft:#5C554E;
  --line:rgba(27,28,25,.14);
  --serif:'Source Serif 4','Georgia',serif;
  --label:'Arimo','Arial',sans-serif;
  --maxw:56rem;
}

*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:var(--serif); color:var(--ink); line-height:1.5; background:var(--paper); }
a{ color:inherit; text-decoration:none; }
.it .me{ font-weight:700; }
.pagebreak{ break-before:page; }

/* ===================== SCREEN: the web CV ===================== */
@media screen{
  body{ background:#FDFCFA; font-size:1.02rem; }
  .site-nav{ position:sticky; top:0; z-index:20; background:rgba(253,252,250,.9);
             -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
             border-bottom:1px solid var(--line); }
  .nav-inner{ max-width:var(--maxw); margin:0 auto; padding:.9rem 2rem;
              display:flex; align-items:center; justify-content:space-between; gap:1rem; }
  .nav-home{ font-family:var(--label); font-weight:700; text-transform:uppercase;
             letter-spacing:.12em; font-size:.72rem; }
  .nav-home:hover{ color:var(--accent); }
  .nav-dl{ font-family:var(--label); font-weight:500; text-transform:uppercase;
           letter-spacing:.1em; font-size:.7rem; border:1px solid var(--ink);
           padding:.5rem .95rem; transition:background .2s,color .2s; }
  .nav-dl:hover{ background:var(--ink); color:var(--paper); }

  .cv{ max-width:var(--maxw); margin:0 auto; padding:3rem 2rem 3.5rem; }

  .head{ display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap; }
  .name{ font-family:var(--serif); font-weight:700; font-size:2.6rem; letter-spacing:.005em;
         line-height:1; text-transform:uppercase; border-bottom:3px solid var(--accent);
         padding-bottom:.5rem; }
  .updated{ font-family:var(--label); font-weight:500; font-size:.7rem; letter-spacing:.14em;
            text-transform:uppercase; color:var(--soft); padding-bottom:.55rem; }
  .role{ font-weight:600; font-size:1.2rem; margin-top:1rem; }
  .dept{ color:var(--soft); font-size:1rem; margin-top:.15rem; }
  .contact{ font-family:var(--label); font-size:.9rem; margin-top:.7rem; line-height:1.55; }
  .contact a{ border-bottom:1px solid var(--line); }
  .contact a:hover{ color:var(--accent); border-bottom-color:var(--accent); }

  h2{ font-family:var(--label); font-size:.8rem; font-weight:700; letter-spacing:.16em;
      text-transform:uppercase; margin:2.3rem 0 .9rem; padding-bottom:.4rem;
      border-bottom:1px solid var(--rule); display:flex; align-items:center; gap:.6rem; }
  h2::before{ content:""; width:.55rem; height:.55rem; background:var(--accent); flex:0 0 auto; }
  h3{ font-family:var(--label); font-size:.82rem; font-weight:700; letter-spacing:.1em;
      text-transform:uppercase; color:var(--soft); margin:1.3rem 0 .5rem; }

  .row{ display:flex; gap:1rem; margin:0 0 .5rem; }
  .yr{ font-family:var(--label); font-size:.98rem; color:var(--soft); flex:0 0 6rem; padding-top:.05rem; }
  .it{ flex:1; }
  .rowlink .lt{ text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:2px; text-decoration-color:rgba(27,28,25,.32); }
  .rowlink:hover .lt{ color:var(--accent); text-decoration-color:var(--accent); }
  .note{ color:var(--ink); font-weight:500; font-size:1rem; margin-top:.3rem; }
  .ecell{ display:inline-block; min-width:5.5rem; }
  .eyr{ font-family:var(--label); font-size:.98rem; color:var(--soft); }

  .web-footer{ max-width:var(--maxw); margin:0 auto; padding:2rem; border-top:1px solid var(--line);
               font-family:var(--label); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
               color:var(--soft); display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
}
@media screen and (max-width:640px){
  .name{ font-size:2rem; }
  .cv{ padding:2rem 1.2rem 3rem; }
  .nav-inner{ padding:.8rem 1.2rem; }
  .row{ flex-direction:column; gap:.05rem; }
  .yr{ flex-basis:auto; }
}

/* ===================== PRINT: the PDF (weasyprint) ===================== */
@page{
  size:A4; margin:13mm 16mm 15mm 16mm;
  @bottom-left{ content:"J. Ryan Lamare \00B7 Curriculum Vitae"; font-family:'IBM Plex Mono','Menlo',monospace; font-size:7.5pt; color:#9a9a9a; }
  @bottom-right{ content:counter(page) " / " counter(pages); font-family:'IBM Plex Mono','Menlo',monospace; font-size:7.5pt; color:#9a9a9a; }
}
@media print{
  /* The PDF deliberately does NOT match the site's theme: it is a print-oriented
     document — white ground, Archivo for text, IBM Plex Mono for labels/years.
     Re-pointing these two variables flips every rule below in one place. */
  :root{ --serif:'Archivo','Helvetica Neue',Arial,sans-serif;
         --label:'IBM Plex Mono','Menlo',monospace; }
  body{ background:#fff; color:#1c1c1c; font-size:9.3pt; line-height:1.4; }
  .site-nav, .web-footer{ display:none !important; }
  .cv{ max-width:none; margin:0; padding:0; }
  .head{ display:flex; justify-content:space-between; align-items:flex-end; padding-bottom:3pt; }
  .name{ font-family:var(--serif); font-weight:700; font-size:25pt; letter-spacing:.01em;
         text-transform:uppercase; line-height:.95; border-bottom:3pt solid var(--accent);
         padding-bottom:6pt; padding-right:30pt; }
  .updated{ font-family:var(--label); font-weight:500; font-size:8pt; letter-spacing:.08em;
            text-transform:uppercase; color:#7a7a7a; padding-bottom:3pt; }
  .role{ font-weight:600; font-size:11pt; margin-top:7pt; }
  .dept{ color:#7a7a7a; font-size:9.5pt; margin-top:1pt; }
  /* --serif here, not --label: the contact line reads as text, not as a label. */
  .contact{ font-family:var(--serif); font-size:8.8pt; margin-top:5pt; line-height:1.3; }
  h2{ font-family:var(--label); font-size:8.2pt; font-weight:700; letter-spacing:.14em;
      text-transform:uppercase; color:#1c1c1c; margin:11pt 0 5pt; padding-bottom:3pt;
      border-bottom:.6pt solid #d9d9d9; display:flex; align-items:center; gap:7pt; }
  h2::before{ content:""; width:6pt; height:6pt; background:var(--accent); display:inline-block; flex:0 0 auto; }
  h3{ font-family:var(--label); font-size:7.8pt; font-weight:700; letter-spacing:.1em;
      text-transform:uppercase; color:#7a7a7a; margin:8pt 0 3pt; }
  .row{ display:flex; gap:9pt; margin:0 0 3pt; }
  .yr{ font-family:var(--label); font-size:8.8pt; color:#7a7a7a; flex:0 0 5.5em; padding-top:.6pt; white-space:nowrap; }
  .it{ flex:1; }
  .note{ color:#1c1c1c; font-weight:500; font-size:8.8pt; margin-top:2pt; }
  .ecell{ display:inline-block; width:51.9pt; }
  .eyr{ font-family:var(--label); font-size:8.8pt; color:#7a7a7a; }
  h2, h3, .row{ break-inside:avoid; }
}
</style>

</head><body>
